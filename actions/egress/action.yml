name: OBAAF egress control
description: >-
  Run one command with its network limited to a list of host names, on a
  GitHub-hosted Linux runner. The command runs under the Agent Workflow
  Firewall (github/gh-aw-firewall) at a version OBAAF's CI has tried to escape;
  everything else is refused and logged. The command can write only to a
  scratch copy of the workspace, and cannot change the runner's files. The
  proxy's resolver answers only the listed names (and, with model keys, the
  provider's API host), so a name the proxy refuses does not leave the runner
  in a DNS query either. Read docs/egress-control.md for what this blocks and
  what it does not.
author: Osita Sean Keluo-Udeke
branding:
  icon: shield
  color: red
inputs:
  allow:
    description: >-
      Host names the command may reach over HTTP and HTTPS, separated by commas,
      spaces or new lines. A name covers its subdomains. Plain names only: no
      wildcard, address, port or scheme.
    required: true
  run:
    description: >-
      The command, run with bash -e in a copy of the workspace. It sees none of
      the runner's environment except the variables named in env.
    required: true
  env:
    description: >-
      Names of variables from the step's env to pass to the command, separated
      by commas, spaces or new lines. Values are not printed.
    required: false
    default: ""
  model-keys:
    description: >-
      Names of model-key variables from the step's env to give to AWF's API
      proxy, not to the command: ANTHROPIC_API_KEY, OPENAI_API_KEY. The command
      gets a base URL pointing at the proxy and a placeholder key; the proxy adds
      the real key and reaches the provider's API host whatever allow says.
    required: false
    default: ""
outputs:
  workspace:
    description: >-
      The copy of the workspace the command ran in and could change. Treat what
      is in it as data: do not run or load anything from it in a later step.
    value: ${{ steps.run.outputs.workspace }}
  scratch:
    description: >-
      The scratch directory that holds the copy, the command's home and TMPDIR.
      Only regular files and directories are left in it.
    value: ${{ steps.run.outputs.scratch }}
  log-dir:
    description: The proxy's log, outside the scratch directory.
    value: ${{ steps.run.outputs.log-dir }}
  denied:
    description: Hosts the proxy refused, separated by commas.
    value: ${{ steps.run.outputs.denied }}
  dns-refused:
    description: >-
      Names the proxy's resolver refused, separated by commas. The action's
      resolver answers only names the allow-list covers and the API host of
      each model key; these went no further than the runner.
    value: ${{ steps.run.outputs.dns-refused }}
  dns-log:
    description: The log of the proxy's resolver, outside the scratch directory.
    value: ${{ steps.run.outputs.dns-log }}
  removed:
    description: >-
      Symbolic links, pipes, sockets and device files the action deleted from
      the scratch directory after the run, relative to it, separated by commas
      (the first 200). The copy holds only regular files and directories, so a
      later step that reads or uploads it cannot be pointed at the runner's
      own files.
    value: ${{ steps.run.outputs.removed }}
  refused:
    description: >-
      "credential" when the action refused to run anything because a checkout
      in the workspace kept its token; "input" when the run step refused
      another input; "environment" when the run step found a variable set that
      would make the dynamic loader load other code, which the action's own
      env empties. (What the first step refuses, such as allow, env and
      model-keys, leaves it empty; that step fails first.)
    value: ${{ steps.run.outputs.refused }}
  exit-code:
    description: >-
      AWF's exit status, which is the command's own unless AWF itself failed
      after the probe held.
    value: ${{ steps.run.outputs.exit-code }}
  confined:
    description: >-
      "true" when the step's status is the command's own, from a sandbox whose
      probe held and that left nothing behind; "false" when the action failed
      the step itself (status 3).
    value: ${{ steps.run.outputs.confined }}
runs:
  using: composite
  # Each step runs outside the sandbox and holds what the workflow put in the
  # step's env, model keys included. So none is started by bash, and none is
  # found through the PATH: the shell is Python by its full path, isolated (-I:
  # no PYTHON* variable, no script or user directory on sys.path) and without
  # site directories (-S), and it only runs egress.py. Each step's env empties
  # the variables that make the dynamic loader load other code (the list is
  # LOADER_VARIABLES in egress.py, which refuses to go on if one still has a
  # value). The last step fails the action if the run step ended 0 without
  # reporting that the sandbox held, which is what a variable the loader obeys
  # whatever its value (LD_TRACE_LOADED_OBJECTS) does to every step. Slice 2c.9,
  # issues #139 and #145; see docs/egress-control.md.
  steps:
    - name: Check the inputs and the runner
      shell: /usr/bin/python3 -I -S {0}
      env:
        INPUT_ALLOW: ${{ inputs.allow }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_MODEL_KEYS: ${{ inputs.model-keys }}
        OBAAF_EGRESS_SCRIPT: ${{ github.action_path }}/egress.py
        GCONV_PATH: ""
        GETCONF_DIR: ""
        GLIBC_TUNABLES: ""
        HOSTALIASES: ""
        LD_AUDIT: ""
        LD_BIND_NOT: ""
        LD_BIND_NOW: ""
        LD_DEBUG: ""
        LD_DEBUG_OUTPUT: ""
        LD_HWCAP_MASK: ""
        LD_LIBRARY_PATH: ""
        LD_ORIGIN_PATH: ""
        LD_PRELOAD: ""
        LD_PROFILE: ""
        LD_VERBOSE: ""
        LD_WARN: ""
        LOCALDOMAIN: ""
        LOCPATH: ""
        MALLOC_ARENA_MAX: ""
        MALLOC_ARENA_TEST: ""
        MALLOC_MMAP_MAX_: ""
        MALLOC_MMAP_THRESHOLD_: ""
        MALLOC_PERTURB_: ""
        MALLOC_TOP_PAD_: ""
        MALLOC_TRACE: ""
        MALLOC_TRIM_THRESHOLD_: ""
        NIS_PATH: ""
        NLSPATH: ""
        RESOLV_HOST_CONF: ""
        RES_OPTIONS: ""
        TMPDIR: ""
        TZDIR: ""
      run: |
        import os, runpy, sys
        sys.argv = [os.environ["OBAAF_EGRESS_SCRIPT"], "check-allow"]
        runpy.run_path(sys.argv[0], run_name="__main__")

    - name: Install the pinned Agent Workflow Firewall
      shell: /usr/bin/python3 -I -S {0}
      env:
        OBAAF_EGRESS_SCRIPT: ${{ github.action_path }}/egress.py
        GCONV_PATH: ""
        GETCONF_DIR: ""
        GLIBC_TUNABLES: ""
        HOSTALIASES: ""
        LD_AUDIT: ""
        LD_BIND_NOT: ""
        LD_BIND_NOW: ""
        LD_DEBUG: ""
        LD_DEBUG_OUTPUT: ""
        LD_HWCAP_MASK: ""
        LD_LIBRARY_PATH: ""
        LD_ORIGIN_PATH: ""
        LD_PRELOAD: ""
        LD_PROFILE: ""
        LD_VERBOSE: ""
        LD_WARN: ""
        LOCALDOMAIN: ""
        LOCPATH: ""
        MALLOC_ARENA_MAX: ""
        MALLOC_ARENA_TEST: ""
        MALLOC_MMAP_MAX_: ""
        MALLOC_MMAP_THRESHOLD_: ""
        MALLOC_PERTURB_: ""
        MALLOC_TOP_PAD_: ""
        MALLOC_TRACE: ""
        MALLOC_TRIM_THRESHOLD_: ""
        NIS_PATH: ""
        NLSPATH: ""
        RESOLV_HOST_CONF: ""
        RES_OPTIONS: ""
        TMPDIR: ""
        TZDIR: ""
      run: |
        import os, runpy, sys
        sys.argv = [os.environ["OBAAF_EGRESS_SCRIPT"], "install"]
        runpy.run_path(sys.argv[0], run_name="__main__")

    - name: Run the command with its network limited
      id: run
      shell: /usr/bin/python3 -I -S {0}
      env:
        INPUT_ALLOW: ${{ inputs.allow }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_MODEL_KEYS: ${{ inputs.model-keys }}
        INPUT_RUN: ${{ inputs.run }}
        OBAAF_EGRESS_SCRIPT: ${{ github.action_path }}/egress.py
        GCONV_PATH: ""
        GETCONF_DIR: ""
        GLIBC_TUNABLES: ""
        HOSTALIASES: ""
        LD_AUDIT: ""
        LD_BIND_NOT: ""
        LD_BIND_NOW: ""
        LD_DEBUG: ""
        LD_DEBUG_OUTPUT: ""
        LD_HWCAP_MASK: ""
        LD_LIBRARY_PATH: ""
        LD_ORIGIN_PATH: ""
        LD_PRELOAD: ""
        LD_PROFILE: ""
        LD_VERBOSE: ""
        LD_WARN: ""
        LOCALDOMAIN: ""
        LOCPATH: ""
        MALLOC_ARENA_MAX: ""
        MALLOC_ARENA_TEST: ""
        MALLOC_MMAP_MAX_: ""
        MALLOC_MMAP_THRESHOLD_: ""
        MALLOC_PERTURB_: ""
        MALLOC_TOP_PAD_: ""
        MALLOC_TRACE: ""
        MALLOC_TRIM_THRESHOLD_: ""
        NIS_PATH: ""
        NLSPATH: ""
        RESOLV_HOST_CONF: ""
        RES_OPTIONS: ""
        TMPDIR: ""
        TZDIR: ""
      run: |
        import os, runpy, sys
        sys.argv = [os.environ["OBAAF_EGRESS_SCRIPT"], "run"]
        runpy.run_path(sys.argv[0], run_name="__main__")

    # A step that fails without starting a program: its shell does not exist,
    # so the runner fails it (a program the loader starts could be stopped
    # before it runs and end 0, as every step above can). It runs only when
    # the run step ended 0 without setting confined to true, which egress.py
    # never does: it sets confined=true on the one path that ends with the
    # command's own status, and every other path ends 2 or 3.
    - name: Stop if the run step ended 0 without reporting that the sandbox held
      if: success() && steps.run.outputs.confined != 'true'
      shell: /obaaf-egress/the-run-step-ended-0-without-reporting-that-the-sandbox-held {0}
      run: The run step ended 0 without setting confined to true, so egress.py did not finish; see docs/egress-control.md.
