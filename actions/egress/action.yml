name: OBAAF egress control
description: >-
  Run one command with its network limited to a list of host names, on a
  GitHub-hosted Linux runner. The command runs under the Agent Workflow
  Firewall (github/gh-aw-firewall) at a version OBAAF's CI has tried to escape;
  everything else is refused and logged. The command can write only to a
  scratch copy of the workspace, and cannot change the runner's files. The
  proxy's resolver answers only the listed names (and, with model keys, the
  provider's API host), so a name the proxy refuses does not leave the runner
  in a DNS query either. Read docs/egress-control.md for what this blocks and
  what it does not.
author: Osita Sean Keluo-Udeke
branding:
  icon: shield
  color: red
inputs:
  allow:
    description: >-
      Host names the command may reach over HTTP and HTTPS, separated by commas,
      spaces or new lines. A name covers its subdomains. Plain names only: no
      wildcard, address, port or scheme.
    required: true
  run:
    description: >-
      The command, run with bash -e in a copy of the workspace. It sees none of
      the runner's environment except the variables named in env.
    required: true
  env:
    description: >-
      Names of variables from the step's env to pass to the command, separated
      by commas, spaces or new lines. Values are not printed.
    required: false
    default: ""
  model-keys:
    description: >-
      Names of model-key variables from the step's env to give to AWF's API
      proxy, not to the command: ANTHROPIC_API_KEY, OPENAI_API_KEY. The command
      gets a base URL pointing at the proxy and a placeholder key; the proxy adds
      the real key and reaches the provider's API host whatever allow says.
    required: false
    default: ""
outputs:
  workspace:
    description: >-
      The copy of the workspace the command ran in and could change. Treat what
      is in it as data: do not run or load anything from it in a later step.
    value: ${{ steps.run.outputs.workspace }}
  scratch:
    description: >-
      The scratch directory that holds the copy, the command's home and TMPDIR.
      Only regular files and directories are left in it.
    value: ${{ steps.run.outputs.scratch }}
  log-dir:
    description: The proxy's log, outside the scratch directory.
    value: ${{ steps.run.outputs.log-dir }}
  denied:
    description: Hosts the proxy refused, separated by commas.
    value: ${{ steps.run.outputs.denied }}
  dns-refused:
    description: >-
      Names the proxy's resolver refused, separated by commas. The action's
      resolver answers only names the allow-list covers and the API host of
      each model key; these went no further than the runner.
    value: ${{ steps.run.outputs.dns-refused }}
  dns-log:
    description: The log of the proxy's resolver, outside the scratch directory.
    value: ${{ steps.run.outputs.dns-log }}
  removed:
    description: >-
      Symbolic links, pipes, sockets and device files the action deleted from
      the scratch directory after the run, relative to it, separated by commas
      (the first 200). The copy holds only regular files and directories, so a
      later step that reads or uploads it cannot be pointed at the runner's
      own files.
    value: ${{ steps.run.outputs.removed }}
  refused:
    description: >-
      "credential" when the action refused to run anything because a checkout
      in the workspace kept its token; "input" when the run step refused
      another input. (Inputs refused by the first step, such as allow, env and
      model-keys, leave it empty; that step fails first.)
    value: ${{ steps.run.outputs.refused }}
  exit-code:
    description: >-
      AWF's exit status, which is the command's own unless AWF itself failed
      after the probe held.
    value: ${{ steps.run.outputs.exit-code }}
  confined:
    description: >-
      "true" when the step's status is the command's own, from a sandbox whose
      probe held and that left nothing behind; "false" when the action failed
      the step itself (status 3).
    value: ${{ steps.run.outputs.confined }}
runs:
  using: composite
  steps:
    - name: Check the inputs and the runner
      shell: bash
      env:
        INPUT_ALLOW: ${{ inputs.allow }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_MODEL_KEYS: ${{ inputs.model-keys }}
        OBAAF_EGRESS_SCRIPT: ${{ github.action_path }}/egress.py
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "Linux" ] || [ "$(uname -m)" != "x86_64" ]; then
          echo "::error::The OBAAF egress control runs on Linux x64 runners only."
          exit 2
        fi
        /usr/bin/python3 -I "$OBAAF_EGRESS_SCRIPT" check-allow

    - name: Install the pinned Agent Workflow Firewall
      shell: bash
      env:
        OBAAF_EGRESS_SCRIPT: ${{ github.action_path }}/egress.py
      run: /usr/bin/python3 -I "$OBAAF_EGRESS_SCRIPT" install

    - name: Run the command with its network limited
      id: run
      shell: bash
      env:
        INPUT_ALLOW: ${{ inputs.allow }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_MODEL_KEYS: ${{ inputs.model-keys }}
        INPUT_RUN: ${{ inputs.run }}
        OBAAF_EGRESS_SCRIPT: ${{ github.action_path }}/egress.py
      run: /usr/bin/python3 -I "$OBAAF_EGRESS_SCRIPT" run
