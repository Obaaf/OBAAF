version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/actions/setup-obaaf"]
    schedule:
      interval: weekly
    # Propose a version only once it has been out for seven days, so a compromised release has
    # time to be found first (zizmor's dependabot-cooldown; slice 2d.4c). Security updates are
    # not delayed by a cooldown.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
