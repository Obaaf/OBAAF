name: Check the integrated consumer draft and walkthrough after PR 418
on:
  push:
    branches: [lead/adopters-418-aa2a4a5]
permissions:
  contents: read
jobs:
  adopter-comparisons:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 155a0020bfd8ce1c0580692887c0fb393f7c2cbd
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Compare fixed repositories on each pair of checker revisions
        run: |
          export TMPDIR="$RUNNER_TEMP/obaaf-temp"
          mkdir "$TMPDIR"
          git worktree add -q --detach "$RUNNER_TEMP/flagship" 73658d7366eaa250848ce693cb05976327c8cc20
          git worktree add -q --detach "$RUNNER_TEMP/adoption" e49616ec3b1abe58e73273c852f2073e3dcb9f30
          git worktree add -q --detach "$RUNNER_TEMP/combined" e49616ec3b1abe58e73273c852f2073e3dcb9f30
          git config user.name 'Sean Keluo-Udeke'
          git config user.email '55066947+seanudeke@users.noreply.github.com'
          git -C "$RUNNER_TEMP/combined" merge --no-ff --no-commit 155a0020bfd8ce1c0580692887c0fb393f7c2cbd
          git -C "$RUNNER_TEMP/combined" write-tree
          git clone --quiet --no-checkout https://github.com/Expectrail/Expectrail.git "$RUNNER_TEMP/expectrail"
          git -C "$RUNNER_TEMP/expectrail" checkout --quiet --detach de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          settings = root / "flagship"
          sites = [
              ("OBAAF", settings, settings / ".github/obaaf-settings.json", "medium", 0),
              ("Expectrail", root / "expectrail", settings / "tests/fixtures/settings/live-expectrail-2026-11-13/snapshot.json", "low", 1),
          ]
          for label, before, after in [("Merged #418 with the adoption drafts",root/"adoption", root/"combined")]:
              for name, site, snapshot, threshold, expected in sites:
                  for mode in ("text", "json", "sarif", "summary"):
                      command = [sys.executable, "-m", "obaaf", "check", ".", "--settings", str(snapshot),
                                 "--baseline", ".github/obaaf-baseline.json", "--fail-on", threshold]
                      command.extend(["--summary"] if mode=="summary" else ["--format", mode])
                      if name=="Expectrail":
                          command.append("--no-fixes")
                      outputs = []
                      for source in (before, after):
                          env = dict(os.environ, PYTHONPATH=str(source/"src"), PYTHONDONTWRITEBYTECODE="1")
                          result = subprocess.run(command, cwd=site, env=env, capture_output=True)
                          assert result.returncode==expected, (name, mode, result.stderr[-300:])
                          assert b"git did not list the tracked files" not in result.stdout
                          outputs.append((result.stdout, result.stderr, result.returncode))
                      assert outputs[0]==outputs[1], (label,name,mode)
                      print(label, name, mode, "matched", expected, flush=True)
          PY
      - name: Run the full suite on the integrated walkthrough tree
        run: |
          cd "$RUNNER_TEMP/combined"
          export TMPDIR="$RUNNER_TEMP/obaaf-temp" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python -m unittest discover -s tests -v
  draft-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: 14c406ada254991f07ddbeae72d49e645a6b5dc7
          persist-credentials: false
      - name: Record the native merge tree and the overlapping edits
        run: |
          git config user.name 'Sean Keluo-Udeke'
          git config user.email '55066947+seanudeke@users.noreply.github.com'
          git merge --no-ff --no-commit 155a0020bfd8ce1c0580692887c0fb393f7c2cbd
          git write-tree
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          incoming = '155a0020bfd8ce1c0580692887c0fb393f7c2cbd'
          for path in ('CHANGELOG.md','DECISIONS.md','docs/checker-configuration.md','docs/upgrading.md','src/obaaf/checker/rules.py'):
              patch = subprocess.check_output(['git','diff','--cached','--unified=0',incoming,'--',path], text=True)
              additions = subprocess.check_output(['git','hash-object',path], text=True).strip()
              print('MERGED-BLOB',path,additions)
              for line in patch.splitlines():
                  if line.startswith(('@@', '+', '-')):
                      print('PATCH', json.dumps(line))
              print('END-PATCH')
          PY
