name: Verify the conflict resolution for the settings audit
on:
  push:
    branches: [lead/verify-383-366-fc822e7]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1ea2cd49bb6f66c2c62a0016950c4d56e6180918
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Verify the merge tree and the settings rules on the handoff commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1ea2cd49bb6f66c2c62a0016950c4d56e6180918
          test "$(git rev-parse HEAD^{tree})" = b41e0acc70361b916881a1b6ad1b7a7078e34c30
          export TMPDIR="$(mktemp -d "$RUNNER_TEMP/obaaf-audit.XXXXXX")"
          if git -C "$TMPDIR" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          python -m pip install -q --constraint actions/setup-obaaf/constraints.txt '.[keys]'
          PYTHONPATH=tests python -m unittest test_settings_reusable_secrets test_settings_rules
          obaaf audit . --from-snapshot .github/obaaf-settings.json --format json --fail-on never > "$TMPDIR/report.json"
          python -c 'from pathlib import Path; import os,json; assert json.loads((Path(os.environ["TMPDIR"]) / "report.json").read_text())["snapshot"] == json.loads(Path(".github/obaaf-settings.json").read_text()); print("Saved snapshot preserved")'
