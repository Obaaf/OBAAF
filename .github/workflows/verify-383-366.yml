name: Verify the settings audit with the artifact-consumer draft

on:
  push:
    branches: [lead/verify-383-366-b117b9d]

permissions:
  contents: read

jobs:
  handoff-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0dc0f6ebdeadc63efa8023672e72fdb1e6798801
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the full suite on the published integration commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0dc0f6ebdeadc63efa8023672e72fdb1e6798801
          test "$(git rev-parse HEAD^{tree})" = eeda34f2fb07b0746711e161bd8d52180db4d1bd
          export TMPDIR="$(mktemp -d "$RUNNER_TEMP/obaaf-tests.XXXXXX")"
          if git -C "$TMPDIR" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e '.[keys]'
          python -m unittest discover -s tests

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: [suite, comparisons]
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2f8474ed1cbe75cfe1197633502c9e1204bb1817
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Prepare the checker and Git-free temporary storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2f8474ed1cbe75cfe1197633502c9e1204bb1817
          cat > "$RUNNER_TEMP/resolve-383.py" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          
          def git(*args):
              return subprocess.check_output(["git", *args])
          
          target = sys.argv[1]
          ours = git("rev-parse", "HEAD").strip().decode()
          result = subprocess.run(["git", "-c", "user.name=Verification Runner", "-c", "user.email=verification@localhost", "merge", "--no-ff", "--no-commit", target])
          paths = git("diff", "--name-only", "--diff-filter=U").decode().splitlines()
          assert result.returncode == 1 and paths == ["CHANGELOG.md", "DECISIONS.md"], paths
          for path in paths:
              ancestor, current, incoming = [git("show", f":{stage}:{path}").decode() for stage in (1, 2, 3)]
              if path == "CHANGELOG.md":
                  marker = "## [Unreleased]\n\n"
                  section = incoming.split(marker, 1)[1]
                  block = section[:section.index("\n### ", 1) + 1]
                  assert block.startswith("### OBAAF-SET-011") and ancestor.count(marker) == current.count(marker) == 1
          
                  def apply_to(source):
                      return source.replace(marker, marker + block, 1)
              else:
                  row, = [line for line in incoming.splitlines(keepends=True) if line.startswith("| D-140 |")]
                  heading = "### D-140 "
                  assert incoming.count(heading) == 1
                  tail = "\n" + incoming[incoming.index(heading):]
          
                  def apply_to(source):
                      lines = source.splitlines(keepends=True)
                      index = max(i for i, line in enumerate(lines) if line.startswith("| D-"))
                      lines.insert(index + 1, row)
                      return "".join(lines) + tail
              assert apply_to(ancestor) == incoming, path
              merged = apply_to(current)
              assert merged.count("### D-139 ") == current.count("### D-139 ")
              if path == "DECISIONS.md":
                  assert merged.index("| D-139 |") < merged.index("| D-140 |")
                  assert merged.index("### D-139 ") < merged.index("### D-140 ")
              Path(path).write_bytes(merged.encode())
              git("add", "--", path)
          git("-c", "user.name=Verification Runner", "-c", "user.email=verification@localhost", "commit", "--no-edit")
          assert git("show", "-s", "--format=%P").decode().strip() == f"{ours} {target}"
          print("Resolved documentation on", ours, "tree", git("rev-parse", "HEAD^{tree}").decode().strip(), flush=True)
          PY
          git worktree add --detach "$RUNNER_TEMP/flagship-383" fdb77411e0f2e6ef78f47b78d631e5d246d9d23d
          (cd "$RUNNER_TEMP/flagship-383" && python "$RUNNER_TEMP/resolve-383.py" b117b9dccd8520bd8eb2fdb4006c4686319c9c52)
          test "$(git -C "$RUNNER_TEMP/flagship-383" rev-parse HEAD^{tree})" = eeda34f2fb07b0746711e161bd8d52180db4d1bd
          python "$RUNNER_TEMP/resolve-383.py" b117b9dccd8520bd8eb2fdb4006c4686319c9c52
          test "$(git show -s --format=%P)" = "2f8474ed1cbe75cfe1197633502c9e1204bb1817 b117b9dccd8520bd8eb2fdb4006c4686319c9c52"
          git show --no-patch --format='Native merge %H parents %P tree %T'
          git merge-base --is-ancestor b117b9dccd8520bd8eb2fdb4006c4686319c9c52 HEAD
          echo "Integrated review tree $(git rev-parse HEAD^{tree})"
          git diff --check HEAD^1 HEAD
          worktemp="$(mktemp -d "$RUNNER_TEMP/obaaf-validation.XXXXXX")"
          if git -C "$worktemp" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          export TMPDIR="$worktemp"
          echo "TMPDIR=$worktemp" >> "$GITHUB_ENV"
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e '.[keys]'
      - name: Replay the walkthrough upgrade patch and read the committed settings snapshot
        if: matrix.test == 'suite'
        shell: bash
        run: |
          set -euo pipefail
          git diff fc0bcdca219c0581138cf70010322fc99fd9ba8b d884604e00e7ef660a0e13667581dc8430d33a38 -- docs/upgrading.md > "$TMPDIR/guide.patch"
          test -s "$TMPDIR/guide.patch"
          git apply --check "$TMPDIR/guide.patch"
          mkdir "$TMPDIR/previous"
          git archive 2f8474ed1cbe75cfe1197633502c9e1204bb1817 src | tar -x -C "$TMPDIR/previous"
          for tag in previous combined; do
            if [[ "$tag" == previous ]]; then source_path="$TMPDIR/previous/src"; else source_path="$PWD/src"; fi
            SRC_ROOT="$source_path" PYTHONPATH="$source_path" python -c 'import os, obaaf.cli; from pathlib import Path; assert Path(obaaf.cli.__file__).resolve().is_relative_to(Path(os.environ["SRC_ROOT"]).resolve())'
            PYTHONPATH="$source_path" obaaf audit . --from-snapshot .github/obaaf-settings.json --format json --fail-on never > "$TMPDIR/$tag.audit"
            PYTHONPATH="$source_path" obaaf check . --settings .github/obaaf-settings.json --baseline .github/obaaf-baseline.json --format json --fail-on never > "$TMPDIR/$tag.check" 2> "$TMPDIR/$tag.stderr"
          done
          cmp "$TMPDIR/previous.check" "$TMPDIR/combined.check"
          cmp "$TMPDIR/previous.stderr" "$TMPDIR/combined.stderr"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          work = Path(os.environ["TMPDIR"])
          original = json.loads(Path(".github/obaaf-settings.json").read_text())
          for tag in ("previous", "combined"):
              report = json.loads((work / (tag + ".audit")).read_text())
              assert report["snapshot"] == original
              scan = json.loads((work / (tag + ".check")).read_text())
              assert scan["files"] and not scan["errors"]
          print("Both audits preserved the saved observations; both settings-enabled checker reports matched.")
          PY
      - name: Check the fourth-review corrections on the resolved flagship tree
        if: matrix.test == 'suite'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/flagship-383"
          PYTHONPATH="$PWD/src:$PWD/tests" python -c 'from pathlib import Path; import obaaf.audit.rules as r; assert Path(r.__file__).resolve().is_relative_to(Path("src").resolve())'
          PYTHONPATH="$PWD/src:$PWD/tests" python -m unittest test_settings_reusable_secrets test_settings_rules
      - name: Check attribution on ordinary static workflow inputs
        if: matrix.test == 'suite'
        run: |
          obaaf docs build --check
          python - <<'PY'
          from itertools import product
          from pathlib import Path
          import json
          import subprocess
          from tempfile import TemporaryDirectory
          from obaaf import checker

          pin = "b" * 40
          for local, tool in product((False, True), ("claude", "printf")):
              for consumer in ("sh", "cat"):
                  with TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      workflows = root / ".github" / "workflows"
                      workflows.mkdir(parents=True)
                      source = f"""on: workflow_dispatch
          permissions: {{contents: read}}
          jobs:
            build:
              runs-on: ubuntu-24.04
              steps:
                - run: $TOOL -p review
                  env: {{TOOL: {tool}}}
                - uses: actions/upload-artifact@{pin}
                  with: {{name: report, path: report.txt}}
            reader:
              needs: build
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/download-artifact@{pin}
                  with: {{name: report, path: result}}
                - name: inspect
                  run: {consumer} result/report.txt
          """
                      if local:
                          action = root / "tools" / "review"
                          action.mkdir(parents=True)
                          (action / "action.yml").write_text(
                              "name: Review\ndescription: Read the review settings\nruns:\n"
                              "  using: composite\n  steps:\n    - shell: bash\n      run: $TOOL -p review\n",
                              encoding="utf-8",
                          )
                          source = source.replace(
                              "    steps:\n      - run: $TOOL -p review\n        env: {TOOL: " + tool + "}",
                              "    env: {TOOL: " + tool + "}\n    steps:\n      - uses: ./tools/review",
                          )
                          assert "uses: ./tools/review" in source
                      (workflows / "pipeline.yml").write_text(source, encoding="utf-8")
                      result = checker.check(root, config=checker.Config.from_data({}, "obaaf.yml"), catalog=checker.load())
                      producer = any(f.rule == "OBAAF-GHA-020" and f.job == "build" for f in result.findings)
                      consuming = [(f.job, f.step) for f in result.findings if f.rule == "OBAAF-GHA-027"]
                      print("static fixture", local, tool, consumer, producer, consuming)
                      assert producer == (tool == "claude")
                      assert consuming == ([("reader", "inspect")] if tool == "claude" and consumer == "sh" else [])
                      cli = subprocess.run(
                          ["obaaf", "check", ".", "--format", "json", "--fail-on", "never"],
                          cwd=root, capture_output=True, text=True, check=True,
                      )
                      findings = json.loads(cli.stdout)["findings"]
                      cli_producer = any(f["rule"] == "OBAAF-GHA-020" and f["job"] == "build" for f in findings)
                      cli_consumer = [(f["job"], f["step"]) for f in findings if f["rule"] == "OBAAF-GHA-027"]
                      assert (cli_producer, cli_consumer) == (producer, consuming), findings
                      print("CLI fixture", local, tool, consumer, cli_producer, cli_consumer)
          PY
      - name: Verify packaging, catalog, generated docs, site and medium gate
        if: matrix.test == 'suite'
        run: |
          set -euo pipefail
          python -m pip install --constraint actions/setup-obaaf/constraints.txt setuptools
          python -c 'from setuptools.build_meta import build_sdist; import os; build_sdist(os.environ["TMPDIR"])'
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$TMPDIR" "$TMPDIR"/obaaf-*.tar.gz
          python -m venv "$TMPDIR/package"
          "$TMPDIR/package/bin/python" -m pip install --constraint actions/setup-obaaf/constraints.txt "$TMPDIR"/obaaf-*.whl
          (cd "$TMPDIR" && "$TMPDIR/package/bin/obaaf" catalog > /dev/null)
          obaaf catalog > /dev/null
          obaaf docs build --check
          python site/build.py --output "$RUNNER_TEMP/resource-site"
          obaaf check . --baseline .github/obaaf-baseline.json --fail-on medium > /dev/null
      - name: Compare text, JSON, SARIF and summary on both repositories
        if: matrix.test == 'comparisons'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/base-src"
          git archive 2f8474ed1cbe75cfe1197633502c9e1204bb1817 src | tar -x -C "$RUNNER_TEMP/base-src"
          git init -q "$RUNNER_TEMP/expectrail"
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout set --no-cone '/*' '!/bugs/' '!/fresh-*/'
          git -C "$RUNNER_TEMP/expectrail" fetch -q --filter=blob:none --depth=1 https://github.com/Expectrail/Expectrail.git de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          git -C "$RUNNER_TEMP/expectrail" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/expectrail" rev-parse HEAD)" = de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import difflib
          import hashlib
          import json
          from collections import Counter
          import os
          import subprocess
          import sys
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          candidate = Path(os.environ["GITHUB_WORKSPACE"])
          sources = [temp / "base-src/src", candidate / "src"]
          reports = temp / "comparison-evidence"
          reports.mkdir()
          for path, level, expected in [(candidate, "medium", 0), (temp / "expectrail", "low", 1)]:
              extra = ["--no-fixes"] if level == "low" else []
              for mode in [["--format", "text"], ["--format", "json"], ["--format", "sarif"], ["--summary"]]:
                  observations = []
                  for src in sources:
                      env = {**os.environ, "PYTHONPATH": str(src), "PYTHONDONTWRITEBYTECODE": "1"}
                      module = subprocess.check_output(
                          [sys.executable, "-c", "import obaaf.cli; print(obaaf.cli.__file__)"],
                          env=env, text=True,
                      ).strip()
                      assert Path(module).resolve().is_relative_to(src.resolve())
                      argv = ["obaaf", "check", str(path), "--baseline", str(path / ".github/obaaf-baseline.json"),
                              "--fail-on", level, *extra, *mode]
                      run = subprocess.run(argv, env=env, capture_output=True)
                      observations.append((run.returncode, run.stdout, run.stderr))
                  before, after = observations
                  label = f"{path.name}-{mode[-1].strip('-')}"
                  for side, (code, out, err) in zip(("base", "candidate"), observations):
                      (reports / f"{label}-{side}.stdout").write_bytes(out)
                      (reports / f"{label}-{side}.stderr").write_bytes(err)
                      (reports / f"{label}-{side}.exit").write_text(str(code))
                  assert before == after, f"Comparison differs for {label}"
                  assert before[0] == expected, f"Unexpected exit for {label}"
                  print(f"Matched {label} exit={expected}", flush=True)
          PY
