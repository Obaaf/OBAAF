name: Validate flagship PR 367

on:
  push:
    branches: [lead/validate-settings-caa3db4]

permissions:
  contents: read

jobs:
  deployed-settings:
    name: Run generated report and gate with deployed setup pin
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: caa3db45d11270429c01ad0c0964cc9d0d7f97cb
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install generated workflow's pinned checker
        uses: Obaaf/OBAAF/actions/setup-obaaf@8caddd6f06c50b9266d8116fd672f39b55770477
      - name: Exercise shipped checker against both event trees
        shell: bash
        run: |
          set -eu
          export OBAAF_TEST_PINNED_CHECKER="$(command -v obaaf)"
          test "$OBAAF_TEST_PINNED_CHECKER" = "$RUNNER_TEMP/obaaf-venv/bin/obaaf"
          export TMPDIR="$(mktemp -d "$RUNNER_TEMP/obaaf-settings.XXXXXX")"
          if git -C "$TMPDIR" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          "$RUNNER_TEMP/obaaf-venv/bin/python" -m venv "$TMPDIR/candidate-venv"
          "$TMPDIR/candidate-venv/bin/python" -m pip install --constraint actions/setup-obaaf/constraints.txt -e '.[keys]'
          PYTHONPATH=tests:src "$TMPDIR/candidate-venv/bin/python" -m unittest -v test_init_gate.GateTests.test_generated_ci_reads_opted_in_settings_from_the_event_commit
