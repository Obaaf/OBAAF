# CI for the OBAAF repository itself. It runs the offline acceptance tests,
# checks that the generated documents match the data, and runs OBAAF's own
# pipeline checker on this repository's workflows.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: Build resource site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install OBAAF
        run: python -m pip install --constraint actions/setup-obaaf/constraints.txt -e .
      - name: Build and check the site without publishing
        run: python site/build.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install OBAAF
        run: python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"

      - name: Run the acceptance tests (FR1–FR12)
        run: python -m unittest discover -s tests -v

      - name: Check the data files and the generated documents
        run: |
          obaaf catalog
          obaaf docs build --check

      - name: Check this repository's own workflows
        run: obaaf check . --fail-on medium

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Builds the wheel with the pinned backend and runs it from a clean environment, so missing
      # package data fails here.
      - name: Build and smoke-test the wheel
        run: |
          python -m pip install --constraint actions/setup-obaaf/constraints.txt setuptools
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheelhouse .
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --constraint actions/setup-obaaf/constraints.txt wheelhouse/obaaf-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/obaaf" catalog
          "$RUNNER_TEMP/clean/bin/obaaf" assess form --output form.html
          "$RUNNER_TEMP/clean/bin/obaaf" check "$GITHUB_WORKSPACE/tests/fixtures/workflows/risky/pwn-request.yml" --fail-on never

  setup-action:
    # The composite action the templates use, run from this checkout on every
    # hosted operating system, so the hash-pinned requirements cover each one (D-011).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OBAAF with the action
        uses: ./actions/setup-obaaf

      - name: Use it
        shell: bash
        run: |
          obaaf --version
          obaaf check tests/fixtures/workflows/risky/pwn-request.yml --fail-on never
          python -c "import cryptography" 2>/dev/null || "$(dirname "$(command -v obaaf)")/python" -c "import cryptography"

  dependency-lock:
    # requirements.txt must hold PyPI's SHA-256 for every file of every version in
    # constraints.txt (D-011).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the hash-pinned requirements against PyPI
        run: python scripts/lock_setup_obaaf.py --check

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      # actionlint checks workflow syntax and expressions. `cache-mode` is a recent workflow key;
      # ignore it in case this actionlint version predates it.
      - name: Lint workflows and templates
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -ignore 'cache-mode' .github/workflows/*.yml templates/github-actions/workflows/*.yml
