name: Validate flagship PR 365

on:
  push:
    branches: [lead/validate-365-047e2af]

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1a5715d413215a2d0e983daef6def8f9aea76303
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Prepare the checker and Git-free temporary storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1a5715d413215a2d0e983daef6def8f9aea76303
          worktemp="$(mktemp -d "$RUNNER_TEMP/obaaf-validation.XXXXXX")"
          if git -C "$worktemp" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          echo "TMPDIR=$worktemp" >> "$GITHUB_ENV"
          git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit 047e2afe6700955e943f5336785e627206adc404 # PR 365
          git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit 60ba958709925ccd24c5bd23fa62b9fce34bc43c # PR 367
          if ! git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit 7d8478ec2d1ef22a49ec52457d091a4a4d0473ae; then
            test "$(git diff --name-only --diff-filter=U)" = DECISIONS.md
            git show :1:DECISIONS.md > "$worktemp/base"
            git show :2:DECISIONS.md > "$worktemp/ours"
            git show :3:DECISIONS.md > "$worktemp/theirs"
            python - "$worktemp" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          ours = (root / "ours").read_bytes()
          marker = b"\n### D-135 "
          assert ours.count(marker) == 1
          cut = ours.index(marker)
          (root / "ours").write_bytes(ours[:cut])
          (root / "jenkins-decision").write_bytes(ours[cut:])
          PY
            git merge-file -p "$worktemp/ours" "$worktemp/base" "$worktemp/theirs" > DECISIONS.md
            cat "$worktemp/jenkins-decision" >> DECISIONS.md
            git add DECISIONS.md
            git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' commit --no-edit
          fi
          if ! git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit d9e643f7e4cf7c284fd6c1e568c696de82d5ed92; then
            test "$(git diff --name-only --diff-filter=U)" = CHANGELOG.md
            git show :1:CHANGELOG.md > "$worktemp/base-log"
            git show :2:CHANGELOG.md > "$worktemp/ours-log"
            git show :3:CHANGELOG.md > "$worktemp/theirs-log"
            python - "$worktemp" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          base, ours, theirs = [(root / (name + "-log")).read_bytes() for name in ("base", "ours", "theirs")]
          heading = b"### Save a proven fix as a patch\n"
          assert theirs.count(heading) == 1 and heading not in ours
          start = theirs.index(heading)
          end = theirs.index(b"\n### ", start + len(heading)) + 1
          assert theirs[:start] + theirs[end:] == base
          marker = b"## [Unreleased]\n\n"
          assert ours.count(marker) == 1
          Path("CHANGELOG.md").write_bytes(ours.replace(marker, marker + theirs[start:end], 1))
          PY
            git add CHANGELOG.md
            git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' commit --no-edit
          fi
          git rev-parse HEAD^{tree}
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e '.[keys]'
      - name: Run the full acceptance suite and repository checks
        run: |
          set -euo pipefail

          obaaf docs build --check
          python -m unittest discover -s tests > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -100 "$RUNNER_TEMP/tests.log"; exit 1; }
          grep -E '^(Ran [0-9]+ tests|OK)' "$RUNNER_TEMP/tests.log"
          obaaf catalog > /dev/null
          obaaf docs build --check
          python site/build.py --output "$RUNNER_TEMP/resource-site"
          obaaf check . --baseline .github/obaaf-baseline.json --fail-on medium > /dev/null
