name: Verify the egress review candidate on current flagship

on:
  push:
    branches: [lead/validate-366-on-73ce746]

permissions:
  contents: read

jobs:
  packaged-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e186458064a30c5413d79bb314fc4c13ea101c84
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install the candidate wheel built from its source distribution
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/packaged-reports.XXXXXX")"
          test "$(git rev-parse HEAD)" = e186458064a30c5413d79bb314fc4c13ea101c84
          if git -C "$work" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          export TMPDIR="$work"
          echo "TMPDIR=$work" >> "$GITHUB_ENV"
          python -m pip install --constraint actions/setup-obaaf/constraints.txt setuptools
          python -c 'from setuptools.build_meta import build_sdist; import sys; build_sdist(sys.argv[1])' "$work"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$work" "$work"/obaaf-*.tar.gz
          python -m venv "$work/venv"
          "$work/venv/bin/python" -m pip install --constraint actions/setup-obaaf/constraints.txt "$work"/obaaf-*.whl
      - name: Read the two producer verdicts with the shipped catalogue
        run: |
          set -euo pipefail
          cd "$TMPDIR"
          "$TMPDIR/venv/bin/python" -I - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          import obaaf
          from obaaf import checker
          assert Path(obaaf.__file__).resolve().is_relative_to(Path(sys.prefix))
          sys.path.insert(0, str(Path(os.environ["GITHUB_WORKSPACE"]) / "tests"))
          from test_egress_recognised import CHECKOUT, FIREWALL, REVIEWED_PIN, keyed, workflow
          from test_egress_artifact_producers import ROUTES, upload

          cli = str(Path(sys.executable).with_name("obaaf"))
          assert REVIEWED_PIN in checker.load().detection["egress_action_releases"]
          for route, (runner, steps, _) in ROUTES.items():
              if route == "action":
                  steps = CHECKOUT + "\n" + keyed(ref=REVIEWED_PIN)
              root = Path(os.environ["TMPDIR"]) / route
              workflows = root / ".github/workflows"
              workflows.mkdir(parents=True)
              (workflows / "report.yml").write_text(workflow(steps + "\n" + upload(), runs_on=runner))
              (root / ".github/egress-firewall.yaml").write_text(FIREWALL)
              (root / ".github/CODEOWNERS").write_text("* @example/maintainers\n")
              (root / "obaaf.yml").write_text("lanes:\n  .github/workflows/report.yml#agent: agent\n")
              def check(fmt):
                  result = subprocess.run([cli, "check", ".", "--format", fmt, "--fail-on", "never"],
                                          cwd=root, text=True, capture_output=True, check=True)
                  return result.stdout
              output = json.loads(check("json"))
              fixed = [f for f in output["fixed"] if f["rule"] == "OBAAF-GHA-020"]
              assert len(fixed) == 1 and fixed[0]["job"] == "agent", fixed
              control, = fixed[0]["controls"]
              assert control["verdict"] == "verified" and "other repositories" in control["detail"], control
              line, = [l for l in check("text").splitlines() if "fixed: OBAAF-GHA-020" in l]
              assert control["detail"] in line, line
              assert not any(f["rule"] == "OBAAF-GHA-027" for f in output["findings"])
              print(route, "producer fixed; scope on the same text line and JSON control; upload alone has no consumer finding")
          PY
