name: Publish verified native merge tree
on:
  push:
    branches: [lead/verify-375-366-27b15a1]
    paths: [.github/workflows/verify-integration-375-366.yml]
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8e82c992c3f90500368a191c7907fefb3308bea9
          fetch-depth: 0
      - name: Verify native merge tree and publish isolated ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Verification Runner'
          git config user.email 'verification@localhost'
          test "$(git rev-parse HEAD)" = 8e82c992c3f90500368a191c7907fefb3308bea9
          git -c core.hooksPath=/dev/null merge --no-ff --no-commit 2454e7c4ecdaf2a3290a45ba324d995c075629a0
          test "$(git write-tree)" = d900a53ece01c19d3ea9a2a279efe84f915649cc
          git -c core.hooksPath=/dev/null commit -m 'Integrate flagship plan handover into the artifact attribution draft' -m 'Assisted-by: ChatGPT (OpenAI)
          Signed-off-by: Sean Keluo-Udeke <55066947+seanudeke@users.noreply.github.com>'
          test "$(git show -s --format=%P)" = '8e82c992c3f90500368a191c7907fefb3308bea9 2454e7c4ecdaf2a3290a45ba324d995c075629a0'
          test "$(git rev-parse HEAD^{tree})" = d900a53ece01c19d3ea9a2a279efe84f915649cc
          test -z "$(git ls-remote --heads origin refs/heads/lead/verify-366-native-d900a53)"
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/lead/verify-366-native-d900a53
          git ls-remote --heads origin refs/heads/lead/verify-366-native-d900a53
