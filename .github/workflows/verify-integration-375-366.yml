name: Verify static integration of drafts 375 and 366

on:
  push:
    branches: [lead/verify-375-366-27b15a1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: [suite, comparisons]
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8e82c992c3f90500368a191c7907fefb3308bea9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Prepare the checker and Git-free temporary storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8e82c992c3f90500368a191c7907fefb3308bea9
          git -c user.name='Verification Runner' -c user.email='verification@localhost' merge --no-ff --no-edit 27b15a19c61028ee711eaeebd255d5e95298dad2
          test "$(git show -s --format=%P)" = "8e82c992c3f90500368a191c7907fefb3308bea9 27b15a19c61028ee711eaeebd255d5e95298dad2"
          git show --no-patch --format='Native merge %H parents %P tree %T'
          git merge-base --is-ancestor ae86067cae8fcd11be92457db2d8b21448b76beb HEAD
          echo "Integrated review tree $(git rev-parse HEAD^{tree})"
          git diff --check ae86067cae8fcd11be92457db2d8b21448b76beb HEAD
          worktemp="$(mktemp -d "$RUNNER_TEMP/obaaf-validation.XXXXXX")"
          if git -C "$worktemp" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          export TMPDIR="$worktemp"
          echo "TMPDIR=$worktemp" >> "$GITHUB_ENV"
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e '.[keys]'
      - name: Check attribution on ordinary static workflow inputs
        if: matrix.test == 'suite'
        run: |
          obaaf docs build --check
          PYTHONPATH=tests python - <<'PY'
          from test_egress_artifact_producers import upload
          from test_egress_recognised import SHA, workflow, run_check
          producer = workflow("      - run: $AGENT -p review\n        env: {AGENT: claude}\n" + upload())
          for command, expected in [('sh result/report.txt', [('reader', 'inspect')]), ('cat result/report.txt', [])]:
              consumer = ("  reader:\n    needs: agent\n    runs-on: ubuntu-24.04\n    steps:\n"
                          f"      - uses: actions/download-artifact@{SHA}\n"
                          "        with: {name: report, path: result}\n"
                          f"      - name: inspect\n        run: {command}\n")
              report = run_check(producer + consumer)
              actual = [(f.job, f.step) for f in report.findings if f.rule == "OBAAF-GHA-027"]
              print(command, actual)
              assert actual == expected
          PY
      - name: Compare text, JSON, SARIF and summary on both repositories
        if: matrix.test == 'comparisons'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/base-src"
          git archive 8e82c992c3f90500368a191c7907fefb3308bea9 src | tar -x -C "$RUNNER_TEMP/base-src"
          git init -q "$RUNNER_TEMP/expectrail"
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout set --no-cone '/*' '!/bugs/' '!/fresh-*/'
          git -C "$RUNNER_TEMP/expectrail" fetch -q --filter=blob:none --depth=1 https://github.com/Expectrail/Expectrail.git de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          git -C "$RUNNER_TEMP/expectrail" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/expectrail" rev-parse HEAD)" = de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import difflib
          import hashlib
          import json
          from collections import Counter
          import os
          import subprocess
          import sys
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          candidate = Path(os.environ["GITHUB_WORKSPACE"])
          sources = [temp / "base-src/src", candidate / "src"]
          reports = temp / "comparison-evidence"
          reports.mkdir()
          for path, level, expected in [(candidate, "medium", 0), (temp / "expectrail", "low", 1)]:
              extra = ["--no-fixes"] if level == "low" else []
              for mode in [["--format", "text"], ["--format", "json"], ["--format", "sarif"], ["--summary"]]:
                  observations = []
                  for src in sources:
                      env = {**os.environ, "PYTHONPATH": str(src), "PYTHONDONTWRITEBYTECODE": "1"}
                      module = subprocess.check_output(
                          [sys.executable, "-c", "import obaaf.cli; print(obaaf.cli.__file__)"],
                          env=env, text=True,
                      ).strip()
                      assert Path(module).resolve().is_relative_to(src.resolve())
                      argv = ["obaaf", "check", str(path), "--baseline", str(path / ".github/obaaf-baseline.json"),
                              "--fail-on", level, *extra, *mode]
                      run = subprocess.run(argv, env=env, capture_output=True)
                      observations.append((run.returncode, run.stdout, run.stderr))
                  before, after = observations
                  label = f"{path.name}-{mode[-1].strip('-')}"
                  for side, (code, out, err) in zip(("base", "candidate"), observations):
                      (reports / f"{label}-{side}.stdout").write_bytes(out)
                      (reports / f"{label}-{side}.stderr").write_bytes(err)
                      (reports / f"{label}-{side}.exit").write_text(str(code))
                  changes = list(difflib.diff_bytes(difflib.unified_diff, before[1].splitlines(True), after[1].splitlines(True)))
                  (reports / f"{label}.diff").write_bytes(b"".join(changes))
                  if mode[-1] == "json" and changes:
                      old, new = (json.loads(obs[1]) for obs in observations)
                      for field in sorted(set(old) | set(new)):
                          if old.get(field) == new.get(field):
                              continue
                          if isinstance(old.get(field), list) and isinstance(new.get(field), list):
                              def rows(report):
                                  return Counter(json.dumps(row, sort_keys=True) for row in report[field])
                              removed = rows(old) - rows(new)
                              added = rows(new) - rows(old)
                              for direction, items in [("removed", removed), ("added", added)]:
                                  for row, count in items.items():
                                      print(label, field, direction, count, row)
                          else:
                              print(label, field, "changed", old.get(field), new.get(field))
                  if mode[-1] == "sarif" and changes:
                      left, right = (json.loads(obs[1]) for obs in observations)
                      a, = left["runs"]
                      b, = right["runs"]
                      for key in sorted(set(a) | set(b)):
                          if a.get(key) == b.get(key):
                              continue
                          if key == "tool":
                              rules = [{r["id"]: r for r in run["tool"]["driver"]["rules"]} for run in (a, b)]
                              print(label, "changed SARIF rule descriptors", [rid for rid in sorted(set(rules[0]) | set(rules[1])) if rules[0].get(rid) != rules[1].get(rid)])
                          elif key == "results":
                              results = [Counter((r["ruleId"], json.dumps(r, sort_keys=True)) for r in run[key]) for run in (a,b)]
                              for kind, change in [("removed", results[0]-results[1]), ("added", results[1]-results[0])]:
                                  print(label, kind, [(rid, count) for (rid, _), count in change.items()])
                          else:
                              print(label, "changed SARIF field", key)
                  if mode[-1] in ("--summary", "text") and changes:
                      print(b"".join(changes).decode(errors="replace"))
                  print(label, "stdout diff lines", len(changes), "sha256", hashlib.sha256(after[1]).hexdigest())
                  if changes:
                      assert label == "expectrail-sarif", label
                      before_doc, after_doc = (json.loads(obs[1]) for obs in observations)
                      before_rules, after_rules = [doc["runs"][0]["tool"]["driver"].pop("rules") for doc in (before_doc, after_doc)]
                      assert before_doc == after_doc
                      assert [r["id"] for r in before_rules] == [r["id"] for r in after_rules]
                      delta = {old["id"]: sorted(k for k in set(old) | set(new) if old.get(k) != new.get(k)) for old,new in zip(before_rules, after_rules) if old != new}
                      print("SARIF descriptor changes:", delta, flush=True)
                      assert set(delta) == {"OBAAF-GHA-005", "OBAAF-GHA-020"}
                      assert all(set(fields) <= {"shortDescription","fullDescription","help"} for fields in delta.values())
                  assert (before[0], before[2]) == (after[0], after[2])
                  assert observations[0][0] == expected, (level, mode, observations[0][0])
                  print(f"Compared {path.name} {' '.join(mode)} exit={expected}", flush=True)
          PY
      - name: Retain both reports and their complete diffs for review
        if: always() && matrix.test == 'comparisons'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scoped-checker-comparisons
          path: ${{ runner.temp }}/comparison-evidence
          if-no-files-found: error
