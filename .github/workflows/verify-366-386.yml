name: Verify the egress draft with scoped settings evidence

on:
  push:
    branches: [lead/verify-366-386-1c82c0c]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: [suite, comparisons]
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1c82c0c79e6bb4f603d0f18313895f5c297dff38
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Prepare the checker and Git-free temporary storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1c82c0c79e6bb4f603d0f18313895f5c297dff38
          test "$(git show -s --format=%P)" = "f5e8f417cd9316b7bd29916c9185fdf682f203ae fe84c40d0888a68ec468d4e6d0647415721dccda"
          test "$(git merge-base f5e8f417cd9316b7bd29916c9185fdf682f203ae fe84c40d0888a68ec468d4e6d0647415721dccda)" = 9601f082e661fdcfeee43001b651d6d53e217eb8
          native_tree="$(git merge-tree --write-tree f5e8f417cd9316b7bd29916c9185fdf682f203ae fe84c40d0888a68ec468d4e6d0647415721dccda)"
          test "$native_tree" = 904d25f383dc268a628419b034e2b95541dcada6
          test "$(git rev-parse HEAD^{tree})" = "$native_tree"
          echo "Verified native merge tree $native_tree"
          git diff --check HEAD^1 HEAD
          worktemp="$(mktemp -d "$RUNNER_TEMP/obaaf-validation.XXXXXX")"
          if git -C "$worktemp" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          export TMPDIR="$worktemp"
          echo "TMPDIR=$worktemp" >> "$GITHUB_ENV"
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e '.[keys]'
      - name: Replay the walkthrough upgrade patch and read the committed settings snapshot
        if: matrix.test == 'suite'
        shell: bash
        run: |
          set -euo pipefail
          git diff fc0bcdca219c0581138cf70010322fc99fd9ba8b d884604e00e7ef660a0e13667581dc8430d33a38 -- docs/upgrading.md > "$TMPDIR/guide.patch"
          test -s "$TMPDIR/guide.patch"
          git apply --check "$TMPDIR/guide.patch"
          git show f5e8f417cd9316b7bd29916c9185fdf682f203ae:.github/obaaf-settings.json > "$TMPDIR/prior-snapshot.json"
          for snapshot in "$TMPDIR/prior-snapshot.json" .github/obaaf-settings.json; do
            obaaf audit . --from-snapshot "$snapshot" --format json --fail-on never > "$TMPDIR/audit.json"
            obaaf check . --settings "$snapshot" --baseline .github/obaaf-baseline.json --format json --fail-on never > "$TMPDIR/check.json"
            python -c 'import json, sys; a, c, s = (json.load(open(p)) for p in sys.argv[1:]); assert a["snapshot"] == s and c["files"] and not c["errors"]' "$TMPDIR/audit.json" "$TMPDIR/check.json" "$snapshot"
          done
      - name: Run the full suite on the published draft
        if: matrix.test == 'suite'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src:$PWD/tests" python -c 'from pathlib import Path; import obaaf.audit.rules as r; assert Path(r.__file__).resolve().is_relative_to(Path("src").resolve())'
          PYTHONPATH="$PWD/src:$PWD/tests" python -m unittest discover -s tests
      - name: Check attribution on ordinary static workflow inputs
        if: matrix.test == 'suite'
        run: |
          obaaf docs build --check
          python - <<'PY'
          from itertools import product
          from pathlib import Path
          import json
          import subprocess
          from tempfile import TemporaryDirectory
          from obaaf import checker

          pin = "b" * 40
          for local, tool in product((False, True), ("claude", "printf")):
              for consumer in ("sh", "cat"):
                  with TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      workflows = root / ".github" / "workflows"
                      workflows.mkdir(parents=True)
                      source = f"""on: workflow_dispatch
          permissions: {{contents: read}}
          jobs:
            build:
              runs-on: ubuntu-24.04
              steps:
                - run: $TOOL -p review
                  env: {{TOOL: {tool}}}
                - uses: actions/upload-artifact@{pin}
                  with: {{name: report, path: report.txt}}
            reader:
              needs: build
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/download-artifact@{pin}
                  with: {{name: report, path: result}}
                - name: inspect
                  run: {consumer} result/report.txt
          """
                      if local:
                          action = root / "tools" / "review"
                          action.mkdir(parents=True)
                          (action / "action.yml").write_text(
                              "name: Review\ndescription: Read the review settings\nruns:\n"
                              "  using: composite\n  steps:\n    - shell: bash\n      run: $TOOL -p review\n",
                              encoding="utf-8",
                          )
                          source = source.replace(
                              "    steps:\n      - run: $TOOL -p review\n        env: {TOOL: " + tool + "}",
                              "    env: {TOOL: " + tool + "}\n    steps:\n      - uses: ./tools/review",
                          )
                          assert "uses: ./tools/review" in source
                      (workflows / "pipeline.yml").write_text(source, encoding="utf-8")
                      result = checker.check(root, config=checker.Config.from_data({}, "obaaf.yml"), catalog=checker.load())
                      producer = any(f.rule == "OBAAF-GHA-020" and f.job == "build" for f in result.findings)
                      consuming = [(f.job, f.step) for f in result.findings if f.rule == "OBAAF-GHA-027"]
                      print("static fixture", local, tool, consumer, producer, consuming)
                      assert producer == (tool == "claude")
                      assert consuming == ([("reader", "inspect")] if tool == "claude" and consumer == "sh" else [])
                      cli = subprocess.run(
                          ["obaaf", "check", ".", "--format", "json", "--fail-on", "never"],
                          cwd=root, capture_output=True, text=True, check=True,
                      )
                      findings = json.loads(cli.stdout)["findings"]
                      cli_producer = any(f["rule"] == "OBAAF-GHA-020" and f["job"] == "build" for f in findings)
                      cli_consumer = [(f["job"], f["step"]) for f in findings if f["rule"] == "OBAAF-GHA-027"]
                      assert (cli_producer, cli_consumer) == (producer, consuming), findings
                      print("CLI fixture", local, tool, consumer, cli_producer, cli_consumer)
          PY
      - name: Verify packaging, catalog, generated docs, site and medium gate
        if: matrix.test == 'suite'
        run: |
          set -euo pipefail
          python -m pip install --constraint actions/setup-obaaf/constraints.txt setuptools
          python -c 'from setuptools.build_meta import build_sdist; import os; build_sdist(os.environ["TMPDIR"])'
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$TMPDIR" "$TMPDIR"/obaaf-*.tar.gz
          python -m venv "$TMPDIR/package"
          "$TMPDIR/package/bin/python" -m pip install --constraint actions/setup-obaaf/constraints.txt "$TMPDIR"/obaaf-*.whl
          (cd "$TMPDIR" && "$TMPDIR/package/bin/obaaf" catalog > /dev/null)
          obaaf catalog > /dev/null
          obaaf docs build --check
          python site/build.py --output "$RUNNER_TEMP/resource-site"
          obaaf check . --baseline .github/obaaf-baseline.json --fail-on medium > /dev/null
      - name: Compare text, JSON, SARIF and summary on both repositories
        if: matrix.test == 'comparisons'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/base-src"
          git archive f5e8f417cd9316b7bd29916c9185fdf682f203ae src | tar -x -C "$RUNNER_TEMP/base-src"
          git init -q "$RUNNER_TEMP/expectrail"
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout set --no-cone '/*' '!/bugs/' '!/fresh-*/'
          git -C "$RUNNER_TEMP/expectrail" fetch -q --filter=blob:none --depth=1 https://github.com/Expectrail/Expectrail.git de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          git -C "$RUNNER_TEMP/expectrail" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/expectrail" rev-parse HEAD)" = de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import difflib
          import hashlib
          import json
          from collections import Counter
          import os
          import subprocess
          import sys
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          candidate = Path(os.environ["GITHUB_WORKSPACE"])
          sources = [temp / "base-src/src", candidate / "src"]
          reports = temp / "comparison-evidence"
          reports.mkdir()
          for path, level, expected in [(candidate, "medium", 0), (temp / "expectrail", "low", 1)]:
              extra = ["--no-fixes"] if level == "low" else []
              for mode in [["--format", "text"], ["--format", "json"], ["--format", "sarif"], ["--summary"]]:
                  observations = []
                  for src in sources:
                      env = {**os.environ, "PYTHONPATH": str(src), "PYTHONDONTWRITEBYTECODE": "1"}
                      module = subprocess.check_output(
                          [sys.executable, "-c", "import obaaf.cli; print(obaaf.cli.__file__)"],
                          env=env, text=True,
                      ).strip()
                      assert Path(module).resolve().is_relative_to(src.resolve())
                      argv = ["obaaf", "check", str(path), "--baseline", str(path / ".github/obaaf-baseline.json"),
                              "--fail-on", level, *extra, *mode]
                      run = subprocess.run(argv, env=env, capture_output=True)
                      observations.append((run.returncode, run.stdout, run.stderr))
                  before, after = observations
                  label = f"{path.name}-{mode[-1].strip('-')}"
                  for side, (code, out, err) in zip(("base", "candidate"), observations):
                      (reports / f"{label}-{side}.stdout").write_bytes(out)
                      (reports / f"{label}-{side}.stderr").write_bytes(err)
                      (reports / f"{label}-{side}.exit").write_text(str(code))
                  assert before == after, f"Comparison differs for {label}"
                  assert before[0] == expected, f"Unexpected exit for {label}"
                  print(f"Matched {label} exit={expected}", flush=True)
          PY

  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1c82c0c79e6bb4f603d0f18313895f5c297dff38
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Inspect text and JSON on static workflows
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1c82c0c79e6bb4f603d0f18313895f5c297dff38
          export TMPDIR="$(mktemp -d "$RUNNER_TEMP/obaaf-output.XXXXXX")"
          if git -C "$TMPDIR" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          python -m pip install -q --constraint actions/setup-obaaf/constraints.txt .
          PYTHONPATH=tests python - <<'PY'
          from itertools import product
          from pathlib import Path
          import json
          import subprocess
          import tempfile
          from test_egress_recognised import CHECKOUT, FIREWALL, REVIEWED_PIN, SHA, keyed, workflow
          from test_egress_artifact_producers import upload

          routes = {
              "action": ("ubuntu-24.04", CHECKOUT + "\n" + keyed(ref=REVIEWED_PIN)),
              "firewall": ("ubuntu-24.04-firewall", "      - run: $TOOL -p review\n        env: {TOOL: claude}"),
          }
          limits = ("This verdict covers the producing job", "other repositories", "caches and job outputs")
          for route, (runner, steps) in routes.items():
              for reader_runner, command in product(("ubuntu-24.04", "ubuntu-24.04-firewall"), ("sh", "cat")):
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      gh = root / ".github"
                      (gh / "workflows").mkdir(parents=True)
                      (gh / "CODEOWNERS").write_text("* @example/maintainers\n")
                      (gh / "egress-firewall.yaml").write_text(FIREWALL)
                      producer = workflow(steps + "\n" + upload(), runs_on=runner).replace("  agent:\n", "  build:\n", 1)
                      consumer = (f"  reader:\n    needs: build\n    runs-on: {reader_runner}\n    steps:\n"
                                  f"      - uses: actions/download-artifact@{SHA}\n"
                                  "        with: {name: report, path: result}\n"
                                  f"      - name: inspect\n        run: {command} result/report.txt\n")
                      (gh / "workflows/pipeline.yml").write_text(producer + consumer)
                      args = ["obaaf", "check", ".", "--fail-on", "never", "--format"]
                      data = json.loads(subprocess.check_output(args + ["json"], cwd=root, text=True))
                      output = subprocess.check_output(args + ["text"], cwd=root, text=True)
                      lines = [line for line in output.splitlines() if "fixed: OBAAF-GHA-020 " in line and "[job build]" in line]
                      fixed = [f for f in data.get("fixed", []) if f["rule"] == "OBAAF-GHA-020" and f["job"] == "build"]
                      found = [(f["job"], f["step"], f["severity"], f["state"]) for f in data["findings"] if f["rule"] == "OBAAF-GHA-027"]
                      wanted = [("reader", "inspect", "medium", "new")] if command == "sh" else []
                      print(route, reader_runner, command, "producer rows text/json", len(lines), len(fixed), "consumer", found, flush=True)
                      assert len(lines) == len(fixed) == 1
                      control, = fixed[0]["controls"]
                      assert all(x in lines[0] and x in control["detail"] for x in limits)
                      assert found == wanted
                      print("Scope and detection limits present in text row and JSON control detail.", flush=True)
          PY
