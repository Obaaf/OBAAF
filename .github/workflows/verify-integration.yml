name: Replay installed-wheel gate patches on macOS and Windows

on:
  push:
    branches: [lead/validate-patch-73ce746]

permissions:
  contents: read

jobs:
  portable-patch:
    name: Apply exported patch on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f2e3082017ca6f9017922185481d38627c2b7459
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Set up temporary storage outside Git
        shell: python
        run: |
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == "f2e3082017ca6f9017922185481d38627c2b7459"
          work = tempfile.mkdtemp(prefix="portable-patch-", dir=os.environ["RUNNER_TEMP"])
          assert subprocess.run(["git", "-C", work, "rev-parse", "--git-dir"], capture_output=True).returncode
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key in ["TMPDIR", "TEMP", "TMP"]:
                  env.write(f"{key}={work}\n")
      - name: Build a wheel from the sdist and install it in a clean environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          work = Path(os.environ["TMPDIR"])
          lock = Path("actions/setup-obaaf/constraints.txt").resolve()
          subprocess.run([sys.executable, "-m", "pip", "install", "-c", str(lock), "setuptools"], check=True)
          from setuptools.build_meta import build_sdist
          archive = work / build_sdist(str(work))
          subprocess.run([sys.executable, "-m", "pip", "wheel", "--no-deps", "--no-build-isolation",
                          "--wheel-dir", str(work), str(archive)], check=True)
          subprocess.run([sys.executable, "-m", "venv", str(work / "venv")], check=True)
          python = work / "venv" / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          wheel, = work.glob("obaaf-*.whl")
          subprocess.run([str(python), "-m", "pip", "install", "-c", str(lock), str(wheel)], check=True)
      - name: Apply the new gate to bundled workflow generations
        shell: python
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          work = Path(os.environ["TMPDIR"])
          bindir = work / "venv" / ("Scripts" if os.name == "nt" else "bin")
          python = bindir / ("python.exe" if os.name == "nt" else "python")
          cli = bindir / ("obaaf.exe" if os.name == "nt" else "obaaf")
          read_resource = """
          import sys
          from pathlib import Path
          from importlib.resources import files
          import obaaf
          assert Path(obaaf.__file__).resolve().is_relative_to(Path(sys.prefix))
          sys.stdout.buffer.write(files('obaaf.data').joinpath(sys.argv[1]).read_bytes())
          """
          from textwrap import dedent
          key = b'obaaf check source "${config[@]}" --fail-on never'
          replacement = b'gate_check .github/obaaf-baseline.json --fail-on medium'
          rel = Path(".github/workflows/obaaf-pipeline-check.yml")
          for name in ("init-gate-27b15c9.yaml", "init-gate-settings-8caddd6.yaml", "init-workflow.yaml"):
              bundled = subprocess.check_output([str(python), "-I", "-c", dedent(read_resource), name], cwd=work)
              normalized = bundled.replace(b"\r\n", b"\n")
              assert normalized.count(key + b"\n") == 1, name
              for ending in (b"\n", b"\r\n"):
                  with tempfile.TemporaryDirectory(dir=work) as tmp:
                      root = Path(tmp) / "example repo"
                      target = root / rel
                      target.parent.mkdir(parents=True)
                      before = normalized.replace(b"\n", ending)
                      target.write_bytes(before)
                      def run(*args):
                          return subprocess.check_output(args, cwd=root)
                      run("git", "init", "-q")
                      run("git", "config", "core.autocrlf", "false")
                      run("git", "add", ".")
                      patch = str(Path(tmp) / "review.patch")
                      run(str(cli), "fix", ".", "--gate", "medium", "--patch", patch)
                      assert target.read_bytes() == before
                      run("git", "apply", "--check", patch)
                      run("git", "apply", patch)
                      after = target.read_bytes()
                      assert after == before.replace(key + ending, replacement + ending)
                      pin = rb"setup-obaaf@[0-9a-f]{40}"
                      assert re.findall(pin, after) == re.findall(pin, before) != []
                      assert run("git", "diff", "--name-only", "-z") == rel.as_posix().encode() + b"\x00"
                      print(name, "CRLF" if ending == b"\r\n" else "LF", "installed CLI: Git applied exact bytes, original pin preserved")
