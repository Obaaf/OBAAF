# Escape tests for the OBAAF egress control (actions/egress, slice 2c.2).
#
# Every attempt is made twice: outside the sandbox, where it must get out (the
# control), then inside it, where it must not. The judge is a packet capture on
# the runner's external interface, taken outside the sandbox; the confined
# command's own exit statuses decide nothing. See docs/egress-control.md.
name: Egress escape tests

on:
  pull_request:
    paths:
      - actions/egress/**
      - tests/egress/**
      - .github/workflows/egress-escape-tests.yml
  push:
    branches: [main]
    paths:
      - actions/egress/**
      - tests/egress/**
      - .github/workflows/egress-escape-tests.yml
  schedule:
    # Weekly, so a change on GitHub's runners shows up without a change here.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  escape:
    name: Escape attempts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the judge
        id: prep
        run: |
          set -euo pipefail
          if ! command -v tcpdump >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq tcpdump; fi
          if ! command -v dig >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils; fi
          iface="$(ip route show default | awk '{print $5; exit}')"
          {
            echo "iface=$iface"
            echo "pfx_out=obaafctl$(openssl rand -hex 6)"
            echo "pfx_in=obaafin$(openssl rand -hex 6)"
            echo "pfx_rec=obaafrec$(openssl rand -hex 6)"
          } >> "$GITHUB_OUTPUT"
          python3 -I -c '
          import json, socket
          out = {}
          for host in ("example.org", "example.net", "example.com", "cloudflare-dns.com"):
              out[host] = sorted({info[4][0] for info in socket.getaddrinfo(host, 443)})
          print(json.dumps(out, indent=1))
          ' > "$RUNNER_TEMP/resolved.json"
          cat "$RUNNER_TEMP/resolved.json"
          python3 -I tests/egress/judge.py snapshot "$RUNNER_TEMP/before.json"
          echo "--- the runner, outside the sandbox"
          echo "interface: $iface"
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          ip -4 route
          ip -6 route || true
          grep -E '^nameserver' /etc/resolv.conf || true
          echo "PATH=$PATH"

      - name: Controls, outside the sandbox (each must get out)
        env:
          IFACE: ${{ steps.prep.outputs.iface }}
          PFX_OUT: ${{ steps.prep.outputs.pfx_out }}
        run: |
          set -euo pipefail
          sudo tcpdump -i "$IFACE" -U -w "$RUNNER_TEMP/outside.pcap" >/dev/null 2>&1 &
          sleep 3
          bash tests/egress/attempts.sh outside "$PFX_OUT" "$RUNNER_TEMP/outside-results.txt"
          sleep 3
          sudo pkill -INT -x tcpdump
          sleep 2

      - name: Start the judge's capture
        env:
          IFACE: ${{ steps.prep.outputs.iface }}
        run: |
          sudo tcpdump -i "$IFACE" -U -w "$RUNNER_TEMP/inside.pcap" >/dev/null 2>&1 &
          sleep 3

      - name: Escape attempts, inside the sandbox
        id: inside
        uses: ./actions/egress
        env:
          PFX_IN: ${{ steps.prep.outputs.pfx_in }}
          PFX_REC: ${{ steps.prep.outputs.pfx_rec }}
          REAL_WORKSPACE: ${{ github.workspace }}
          # On purpose: with this set, the runner obeys ::set-env and ::add-path from a
          # step's output. The command prints both; the action must keep them from
          # taking effect, and the judge checks that they did not. It is not passed
          # to the command.
          ACTIONS_ALLOW_UNSECURE_COMMANDS: "true"
        with:
          allow: api.github.com
          env: PFX_IN PFX_REC REAL_WORKSPACE
          run: bash tests/egress/attempts.sh inside "$PFX_IN" "$PFX_REC" egress-results-inside.txt "$REAL_WORKSPACE"

      - name: Stop the capture and judge
        if: always()
        env:
          PFX_OUT: ${{ steps.prep.outputs.pfx_out }}
          PFX_IN: ${{ steps.prep.outputs.pfx_in }}
          PFX_REC: ${{ steps.prep.outputs.pfx_rec }}
          ACTION_EXIT: ${{ steps.inside.outputs.exit-code }}
          ACTION_CONFINED: ${{ steps.inside.outputs.confined }}
          INSIDE_WORKSPACE: ${{ steps.inside.outputs.workspace }}
          LOG_DIR: ${{ steps.inside.outputs.log-dir }}
          DNS_LOG: ${{ steps.inside.outputs.dns-log }}
          DNS_REFUSED: ${{ steps.inside.outputs.dns-refused }}
        run: |
          set -euo pipefail
          # The background attempt fires 20 seconds after it starts; keep listening past that.
          sleep 35
          sudo pkill -INT -x tcpdump || true
          sleep 2
          mkdir -p "$RUNNER_TEMP/egress-results"
          cp "$RUNNER_TEMP/outside-results.txt" "$RUNNER_TEMP/egress-results/" || true
          cp "$INSIDE_WORKSPACE/egress-results-inside.txt" "$RUNNER_TEMP/egress-results/" || true
          if [ -n "$LOG_DIR" ] && [ -d "$LOG_DIR" ]; then sudo cp -r "$LOG_DIR" "$RUNNER_TEMP/egress-results/proxy-logs" && sudo chown -R "$(id -u)" "$RUNNER_TEMP/egress-results"; fi
          if [ -n "$DNS_LOG" ] && [ -f "$DNS_LOG" ]; then cp "$DNS_LOG" "$RUNNER_TEMP/egress-results/dns.log"; fi
          python3 -I tests/egress/judge.py judge \
            --outside-pcap "$RUNNER_TEMP/outside.pcap" \
            --inside-pcap "$RUNNER_TEMP/inside.pcap" \
            --resolved "$RUNNER_TEMP/resolved.json" \
            --outside-prefix "$PFX_OUT" --inside-prefix "$PFX_IN" --record-prefix "$PFX_REC" \
            --outside-results "$RUNNER_TEMP/outside-results.txt" \
            --inside-results "$INSIDE_WORKSPACE/egress-results-inside.txt" \
            --snapshot "$RUNNER_TEMP/before.json" \
            --action-exit "$ACTION_EXIT" \
            --action-confined "$ACTION_CONFINED" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --dns-refused "$DNS_REFUSED" \
            --json-out "$RUNNER_TEMP/egress-results/verdict.json"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egress-escape-results
          path: ${{ runner.temp }}/egress-results
          if-no-files-found: warn
          retention-days: 14

  behaviour:
    name: Exit status, output, environment and refusals
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A command that fails, writes a file and reads a named variable
        id: fails
        continue-on-error: true
        uses: ./actions/egress
        env:
          PASSED: passed-value
          NOT_PASSED: not-passed-value
        with:
          allow: api.github.com
          env: PASSED
          run: |
            test "$PASSED" = passed-value
            touch "$HOME/written-in-home" "$TMPDIR/written-in-tmp"
            # AWF mounts these from its own directories and moves them at cleanup.
            for d in "$HOME/.copilot/logs" "$HOME/.copilot/session-state"; do
              touch "$d/planted-in-copilot"
            done
            test -z "${NOT_PASSED:-}"
            test -z "${GITHUB_TOKEN:-}"
            test -z "${ACTIONS_RUNTIME_TOKEN:-}"
            echo from-inside > written.txt
            exit 7

      - name: A wildcard in the allow-list is refused before anything runs
        id: wildcard
        continue-on-error: true
        uses: ./actions/egress
        with:
          allow: "*.github.com"
          run: "true"

      - name: An address in the allow-list is refused
        id: address
        continue-on-error: true
        uses: ./actions/egress
        with:
          allow: "1.1.1.1"
          run: "true"

      - name: A variable the action withholds cannot be passed
        id: reserved
        continue-on-error: true
        uses: ./actions/egress
        env:
          HTTPS_PROXY: http://example.invalid:3128
        with:
          allow: api.github.com
          env: HTTPS_PROXY
          run: "true"

      - name: A model key name is refused, not silently dropped
        id: modelkey
        continue-on-error: true
        uses: ./actions/egress
        env:
          ANTHROPIC_API_KEY: not-a-key
        with:
          allow: api.anthropic.com
          env: ANTHROPIC_API_KEY
          run: "true"

      - name: A model key the action has not tested is refused in model-keys
        id: untestedkey
        continue-on-error: true
        uses: ./actions/egress
        env:
          GEMINI_API_KEY: not-a-key
        with:
          allow: api.github.com
          model-keys: GEMINI_API_KEY
          run: "true"

      - name: Made-up model keys (not secrets; each provider refuses them)
        id: dummy
        run: |
          set -euo pipefail
          mark="obaafdummy$(openssl rand -hex 8)"
          {
            echo "mark=$mark"
            echo "anthropic=sk-ant-api03-$mark-$(openssl rand -hex 16)"
            echo "openai=sk-proj-$mark-$(openssl rand -hex 16)"
          } >> "$GITHUB_OUTPUT"

      - name: Model keys reach AWF's API proxy, never the command, and each provider answers
        id: keys
        continue-on-error: true
        uses: ./actions/egress
        env:
          ANTHROPIC_API_KEY: ${{ steps.dummy.outputs.anthropic }}
          OPENAI_API_KEY: ${{ steps.dummy.outputs.openai }}
          KEY_MARK: ${{ steps.dummy.outputs.mark }}
        with:
          # Neither provider is listed: the API proxy reaches them whatever allow says.
          allow: api.github.com
          model-keys: ANTHROPIC_API_KEY OPENAI_API_KEY
          env: KEY_MARK
          run: bash tests/egress/model-keys.sh model-keys-results.txt

      - name: Check the model keys
        env:
          KEYS_OUTCOME: ${{ steps.keys.outcome }}
          KEYS_CONFINED: ${{ steps.keys.outputs.confined }}
          KEYS_WORKSPACE: ${{ steps.keys.outputs.workspace }}
          KEYS_LOG_DIR: ${{ steps.keys.outputs.log-dir }}
          KEYS_DNS_LOG: ${{ steps.keys.outputs.dns-log }}
          KEY_MARK: ${{ steps.dummy.outputs.mark }}
          UNTESTED_OUTCOME: ${{ steps.untestedkey.outcome }}
        run: |
          set -euo pipefail
          fail=0
          ok() { echo "ok: $1"; }
          bad() { echo "FAILED: $1"; fail=1; }
          results="$KEYS_WORKSPACE/model-keys-results.txt"
          cat "$results" || true
          line() { grep -m1 "^$1 " "$results" | sed "s/^$1 //" || true; }
          if [ "$UNTESTED_OUTCOME" = failure ]; then ok "an untested model key is refused"; else bad "an untested model key was accepted"; fi
          if [ "$KEYS_OUTCOME" = success ] && [ "$KEYS_CONFINED" = true ]; then ok "the step ran the command in a sandbox that held"; else bad "outcome $KEYS_OUTCOME, confined '$KEYS_CONFINED'"; fi
          if grep -q "holds-the-key" "$results"; then bad "a variable the command sees holds a key: $(grep holds-the-key "$results")"; else ok "no variable the command sees holds either key"; fi
          if [ "$(line MARK_IN_ENV)" = 0 ]; then ok "neither key is in the command's environment"; else bad "a key is in the command's environment ($(line MARK_IN_ENV))"; fi
          if [ "$(line MARK_IN_FILES)" = none ]; then ok "neither key is in a file the command could read (home, TMPDIR, the copy, /tmp, /home, /run, /etc, /var)"; else bad "a key is in: $(line MARK_IN_FILES)"; fi
          case "$(line 'VAR ANTHROPIC_BASE_URL')" in "= http://"*) ok "the command was given ANTHROPIC_BASE_URL, the API proxy";; *) bad "ANTHROPIC_BASE_URL: $(line 'VAR ANTHROPIC_BASE_URL')";; esac
          case "$(line 'VAR OPENAI_BASE_URL')" in "= http://"*) ok "the command was given OPENAI_BASE_URL, the API proxy";; *) bad "OPENAI_BASE_URL: $(line 'VAR OPENAI_BASE_URL')";; esac
          anthropic="$(line ANTHROPIC)"
          case "$anthropic" in "0 401 "*authentication_error*) ok "Anthropic refused the made-up key itself: $anthropic";; *) bad "Anthropic through the API proxy: $anthropic";; esac
          openai="$(line OPENAI)"
          case "$openai" in "0 401 "*invalid_api_key*) ok "OpenAI refused the made-up key itself: $openai";; *) bad "OpenAI through the API proxy: $openai";; esac
          hosted="$(line ANTHROPIC_HOSTED_WEB)"
          case "$hosted" in "0 40"[03]" "*hosted_web*) ok "the API proxy refused a hosted web tool before the provider: $hosted";; *) bad "a hosted web tool: $hosted";; esac
          direct="$(line DIRECT_ANTHROPIC)"
          if [ -n "$direct" ] && [ "$direct" != 0 ]; then ok "the command could not reach api.anthropic.com itself (curl status $direct)"; else bad "the command reached api.anthropic.com directly (curl status '$direct')"; fi
          tunnels="$(sudo grep -rh -e 'api.anthropic.com' -e 'api.openai.com' "$KEYS_LOG_DIR" 2>/dev/null | grep -c CONNECT || true)"
          if [ "$tunnels" -ge 2 ]; then ok "the proxy's log shows the API proxy's CONNECT to both providers ($tunnels lines)"; else bad "the proxy's log shows $tunnels CONNECT lines to the providers"; fi
          if sudo grep -rq -- "$KEY_MARK" "$KEYS_LOG_DIR" "$KEYS_DNS_LOG" 2>/dev/null; then bad "a key is in the proxy's or the resolver's log"; else ok "neither key is in the proxy's or the resolver's log"; fi
          if grep -q "^allowed 1 api.anthropic.com" "$KEYS_DNS_LOG" && grep -q "^allowed 1 api.openai.com" "$KEYS_DNS_LOG"; then ok "the action's resolver answered both providers' hosts"; else bad "the resolver did not answer both providers: $(grep -c . "$KEYS_DNS_LOG") lines"; fi
          exit "$fail"

      - name: Check what happened
        env:
          FAILS_OUTCOME: ${{ steps.fails.outcome }}
          FAILS_EXIT: ${{ steps.fails.outputs.exit-code }}
          FAILS_WORKSPACE: ${{ steps.fails.outputs.workspace }}
          FAILS_LOG_DIR: ${{ steps.fails.outputs.log-dir }}
          FAILS_CONFINED: ${{ steps.fails.outputs.confined }}
          WILDCARD_OUTCOME: ${{ steps.wildcard.outcome }}
          ADDRESS_OUTCOME: ${{ steps.address.outcome }}
          RESERVED_OUTCOME: ${{ steps.reserved.outcome }}
          MODELKEY_OUTCOME: ${{ steps.modelkey.outcome }}
        run: |
          set -euo pipefail
          fail=0
          ok() { echo "ok: $1"; }
          bad() { echo "FAILED: $1"; fail=1; }
          run_dir="$(dirname "$FAILS_LOG_DIR")"
          if [ "$FAILS_EXIT" = 7 ]; then ok "the command's exit status 7 is the action's exit-code output (so the named variable arrived and nothing else did)"; else bad "exit-code output is '$FAILS_EXIT', not 7"; fi
          if [ "$FAILS_OUTCOME" = failure ]; then ok "the step failed with the command"; else bad "the step did not fail"; fi
          if [ "$FAILS_CONFINED" = true ]; then ok "the status is the command's own, not the action's"; else bad "confined output is '$FAILS_CONFINED'"; fi
          if [ -f "$FAILS_WORKSPACE/written.txt" ]; then ok "the file the command wrote is in the copy"; else bad "the file the command wrote is not in the copy"; fi
          if [ ! -e written.txt ]; then ok "the real workspace is unchanged"; else bad "the command wrote into the real workspace"; fi
          if [ "$WILDCARD_OUTCOME" = failure ]; then ok "a wildcard is refused"; else bad "a wildcard was accepted"; fi
          if [ "$ADDRESS_OUTCOME" = failure ]; then ok "an address is refused"; else bad "an address was accepted"; fi
          if [ "$RESERVED_OUTCOME" = failure ]; then ok "a withheld variable is refused"; else bad "a withheld variable was accepted"; fi
          if [ "$MODELKEY_OUTCOME" = failure ]; then ok "a model key name is refused"; else bad "a model key name was accepted"; fi
          if ! compgen -G "$RUNNER_TEMP/obaaf-egress/*/work*" >/dev/null; then ok "AWF's directories (work, work-chroot-home) are gone"; else bad "AWF's directories are left: $(compgen -G "$RUNNER_TEMP/obaaf-egress/*/work*" | tr '\n' ' ')"; fi
          if [ -d "$FAILS_LOG_DIR" ] && [ "$(find "$run_dir" -mindepth 1 -maxdepth 1 ! -name proxy-logs | wc -l)" = 0 ]; then ok "only the proxy's log is left of the run's private directory"; else bad "the run's private directory holds more than the proxy's log"; fi
          found="$(sudo find "$RUNNER_TEMP" /tmp \( -name written-in-home -o -name planted-in-copilot \) 2>/dev/null || true)"
          if [ -z "$found" ]; then ok "what the command wrote to its home and to AWF's log and session directories is nowhere under RUNNER_TEMP or /tmp"; else bad "left behind: $found"; fi
          exit "$fail"
