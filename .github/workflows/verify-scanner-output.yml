name: Validate scanner output and existing gates

on:
  push:
    branches: [lead/validate-scanner-output-340]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test: [suite, comparisons]
    steps:
      - name: Check out the plan update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ff446aab0a4c5279cce437d301a5e54919a56b1b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Prepare the checker and Git-free temporary storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ff446aab0a4c5279cce437d301a5e54919a56b1b
          worktemp="$(mktemp -d "$RUNNER_TEMP/obaaf-validation.XXXXXX")"
          if git -C "$worktemp" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          echo "TMPDIR=$worktemp" >> "$GITHUB_ENV"
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e '.[keys]'
      - name: Run the full acceptance suite and repository checks
        if: matrix.test == 'suite'
        run: |
          set -euo pipefail
          python -m unittest discover -s tests > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -100 "$RUNNER_TEMP/tests.log"; exit 1; }
          grep -E '^(Ran [0-9]+ tests|OK)' "$RUNNER_TEMP/tests.log"
          obaaf catalog > /dev/null
          obaaf docs build --check
          obaaf check . --baseline .github/obaaf-baseline.json --fail-on medium > /dev/null
      - name: Compare text, JSON, SARIF and summary on both repositories
        if: matrix.test == 'comparisons'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/base-src"
          git archive 13db62483c674613669de68a485e59f4aa30855f src | tar -x -C "$RUNNER_TEMP/base-src"
          git init -q "$RUNNER_TEMP/expectrail"
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout set --no-cone '/*' '!/bugs/' '!/fresh-*/'
          git -C "$RUNNER_TEMP/expectrail" fetch -q --filter=blob:none --depth=1 https://github.com/Expectrail/Expectrail.git 7d86d92725a3258f6c681bc87a10288d507daea1
          git -C "$RUNNER_TEMP/expectrail" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/expectrail" rev-parse HEAD)" = 7d86d92725a3258f6c681bc87a10288d507daea1
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          candidate = Path(os.environ["GITHUB_WORKSPACE"])
          from importlib.resources import files
          from itertools import combinations
          from obaaf import init_scanners
          from obaaf.fix_gate import _candidate, BASELINE, REPORT

          sources = [temp / "base-src/src", candidate / "src"]
          template = files("obaaf.data").joinpath("init-workflow.yaml").read_bytes()
          scanner_names = tuple(init_scanners.SCANNERS)
          assert len(scanner_names) == 3
          for count in range(4):
              for selected in combinations(scanner_names, count):
                  old = subprocess.check_output(
                      [sys.executable, "-c", "from obaaf.init_scanners import steps; import sys; "
                       "sys.stdout.buffer.write(steps(sys.argv[1:]))", *selected],
                      env={**os.environ, "PYTHONPATH": str(sources[0])},
                  )
                  new = init_scanners.steps(selected)
                  assert new.count(b"exec 2>&1") == len(selected)
                  for suffix in [old, new]:
                      for sep in [b"\n", b"\r\n"]:
                          before = (template + suffix).replace(b"\n", sep)
                          expected_cmd = b"gate_check .github/obaaf-baseline.json --fail-on medium\n"
                          expected = (template.replace(REPORT, expected_cmd) + suffix).replace(b"\n", sep)
                          assert _candidate(before, BASELINE, "medium") == expected
                  if selected:
                      assert _candidate(template + old + b"    # local edit\n", BASELINE, "medium") is None
          print("Verified old and new scanner suffixes for all eight subsets, LF and CRLF", flush=True)
          for path, level, expected in [(candidate, "medium", 0), (temp / "expectrail", "low", 1)]:
              extra = ["--no-fixes"] if level == "low" else []
              for mode in [["--format", "text"], ["--format", "json"], ["--format", "sarif"], ["--summary"]]:
                  observations = []
                  for src in sources:
                      env = {**os.environ, "PYTHONPATH": str(src), "PYTHONDONTWRITEBYTECODE": "1"}
                      module = subprocess.check_output(
                          [sys.executable, "-c", "import obaaf.cli; print(obaaf.cli.__file__)"],
                          env=env, text=True,
                      ).strip()
                      assert Path(module).resolve().is_relative_to(src.resolve())
                      argv = ["obaaf", "check", str(path), "--baseline", str(path / ".github/obaaf-baseline.json"),
                              "--fail-on", level, *extra, *mode]
                      run = subprocess.run(argv, env=env, capture_output=True)
                      observations.append((run.returncode, run.stdout, run.stderr))
                  assert observations[0] == observations[1], (level, mode, "outputs differ")
                  assert observations[0][0] == expected, (level, mode, observations[0][0])
                  print(f"Matched {path.name} {' '.join(mode)} exit={expected}", flush=True)
          PY
