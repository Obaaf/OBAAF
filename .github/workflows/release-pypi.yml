name: Release to PyPI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository-url:
        description: "Index (blank = PyPI; https://test.pypi.org/legacy/ for TestPyPI)"
        required: false
        default: ""
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: --requirement actions/setup-obaaf/requirements.txt
          rm -rf dist && mkdir -p dist
          python -c "import setuptools.build_meta as b; print(b.build_sdist('dist'))"
          python -c "import setuptools.build_meta as b; print(b.build_wheel('dist'))"
      - name: Smoke-test the wheel, check the empty manifest, write the build record
        # The build record is written here (no signing identity). The attest job only
        # signs downloaded artifacts and this predicate — it never installs the
        # candidate wheel (FR11).
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --require-hashes --only-binary=:all: --requirement actions/setup-obaaf/requirements.txt
          "$RUNNER_TEMP/clean/bin/python" -m pip install --no-deps dist/obaaf-*.whl
          "$RUNNER_TEMP/clean/bin/python" -m pip check
          "$RUNNER_TEMP/clean/bin/obaaf" --version
          "$RUNNER_TEMP/clean/bin/obaaf" catalog
          "$RUNNER_TEMP/clean/bin/obaaf" manifest check --manifest obaaf-manifest.json --sources obaaf-sources.yaml
          "$RUNNER_TEMP/clean/bin/obaaf" attest build-record --artifact dist \
            --source-revision "$GITHUB_SHA" --source-ref "$GITHUB_REF" --repository "$GITHUB_REPOSITORY" \
            --asset-revision "$GITHUB_SHA" --asset-system git --manifest obaaf-manifest.json \
            --builder-id "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-pypi.yml" \
            --workflow-file .github/workflows/release-pypi.yml --build-job build \
            --actor "$GITHUB_ACTOR" --out "$RUNNER_TEMP/build-record.json"
          mkdir -p "$RUNNER_TEMP/obaaf-attest"
          cp "$RUNNER_TEMP/build-record.json" "$RUNNER_TEMP/obaaf-attest/build-record.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: obaaf-dist, path: dist, if-no-files-found: error, retention-days: 7 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obaaf-build-record
          path: ${{ runner.temp }}/obaaf-attest/build-record.json
          if-no-files-found: error
          retention-days: 7
  attest:
    # Signs SLSA provenance and the OBAAF build record written by the build job.
    # This job runs no package code and holds no PyPI identity (G7.1, FR11).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write       # sign through GitHub's Sigstore; no long-lived signing key
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: obaaf-dist, path: dist }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: obaaf-build-record, path: attest }
      - name: Sign SLSA provenance for the release files (G7.1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Sign the build record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          predicate-type: https://www.obaaf.com/attestation/build-record/v0.1
          predicate-path: attest/build-record.json
  publish:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/obaaf/
    permissions:
      id-token: write   # OIDC identity for trusted publishing; no stored token
      attestations: read  # read the provenance and build record the attest job signed
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: obaaf-dist, path: dist }
      - name: Verify provenance and build-record signatures before uploading (G7.1)
        # Uploads nothing unless every file has SLSA provenance and an OBAAF build-record
        # attestation signed by this workflow, for this ref, on a GitHub-hosted runner.
        # This checks signature, subject, signer, and predicate type — not the predicate
        # body. Full `obaaf verify release` remains a later dogfood step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow="$GITHUB_REPOSITORY/.github/workflows/release-pypi.yml"
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$workflow" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$workflow" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --predicate-type https://www.obaaf.com/attestation/build-record/v0.1
          done
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          repository-url: ${{ github.event.inputs.repository-url }}
          print-hash: true
