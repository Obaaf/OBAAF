name: Release to PyPI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository-url:
        description: "Index (blank = PyPI; https://test.pypi.org/legacy/ for TestPyPI)"
        required: false
        default: ""
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: --requirement actions/setup-obaaf/requirements.txt
          rm -rf dist && mkdir -p dist
          python -c "import setuptools.build_meta as b; print(b.build_sdist('dist'))"
          python -c "import setuptools.build_meta as b; print(b.build_wheel('dist'))"
      - name: Smoke-test the wheel, check the empty manifest, write the build record
        # The build record is written here (no signing identity). The attest job only
        # signs downloaded artifacts and this predicate — it never installs the
        # candidate wheel (FR11).
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --require-hashes --only-binary=:all: --requirement actions/setup-obaaf/requirements.txt
          "$RUNNER_TEMP/clean/bin/python" -m pip install --no-deps dist/obaaf-*.whl
          "$RUNNER_TEMP/clean/bin/python" -m pip check
          "$RUNNER_TEMP/clean/bin/obaaf" --version
          "$RUNNER_TEMP/clean/bin/obaaf" catalog
          "$RUNNER_TEMP/clean/bin/obaaf" manifest check --manifest obaaf-manifest.json --sources obaaf-sources.yaml
          "$RUNNER_TEMP/clean/bin/obaaf" attest build-record --artifact dist \
            --source-revision "$GITHUB_SHA" --source-ref "$GITHUB_REF" --repository "$GITHUB_REPOSITORY" \
            --asset-revision "$GITHUB_SHA" --asset-system git --manifest obaaf-manifest.json \
            --builder-id "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-pypi.yml" \
            --workflow-file .github/workflows/release-pypi.yml --build-job build \
            --actor "$GITHUB_ACTOR" --out "$RUNNER_TEMP/build-record.json"
          mkdir -p "$RUNNER_TEMP/obaaf-attest"
          cp "$RUNNER_TEMP/build-record.json" "$RUNNER_TEMP/obaaf-attest/build-record.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: obaaf-dist, path: dist, if-no-files-found: error, retention-days: 7 }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obaaf-build-record
          path: ${{ runner.temp }}/obaaf-attest/build-record.json
          if-no-files-found: error
          retention-days: 7
  attest:
    # Signs SLSA provenance and the OBAAF build record written by the build job.
    # This job runs no package code and holds no PyPI identity (G7.1, FR11).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write       # sign through GitHub's Sigstore; no long-lived signing key
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: obaaf-dist, path: dist }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: obaaf-build-record, path: attest }
      - name: Sign SLSA provenance for the release files (G7.1)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Sign the build record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          predicate-type: https://www.obaaf.com/attestation/build-record/v0.1
          predicate-path: attest/build-record.json
  publish:
    # Dogfood FR6: after the pypi environment is approved, verify provenance body,
    # build record, approvals and agent history with `obaaf verify release`, then
    # upload. Policy and the verifier come from the default branch tip, not the tag
    # tree. Residual vs the template lane: no workflow_run split and no pre-approval
    # summary job — the upload gate is still fail-closed.
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/obaaf/
    permissions:
      contents: read        # default-branch policy, history, setup-obaaf sources
      actions: read         # approvals API for this run
      attestations: read    # Sigstore attestations for verify
      id-token: write       # OIDC identity for trusted publishing; no stored token
    steps:
      - name: Check out the protected default branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up OBAAF from the default branch (FR11)
        # Reviewed tools verify the candidate. Never install dist/obaaf-*.whl here.
        uses: ./actions/setup-obaaf
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: obaaf-dist, path: dist }
      - name: Read who approved this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > "$RUNNER_TEMP/approvals.json"
      - name: Verify the release before uploading (FR6)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          obaaf verify release --policy .github/obaaf-policy.yaml --artifacts dist \
            --approvals "$RUNNER_TEMP/approvals.json" \
            --actor "$GITHUB_ACTOR" --actor "$GITHUB_TRIGGERING_ACTOR" \
            --repo-dir . --source-revision "$GITHUB_SHA"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          repository-url: ${{ github.event.inputs.repository-url }}
          print-hash: true
