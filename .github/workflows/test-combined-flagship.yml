name: Test combined flagship candidates

on:
  push:
    branches: [lead/check-integration-3565c5-fde021-24b407-7de1ab-ce27cf-60ba95]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b963f57e96785c452150f02bca6a01db57f4638
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Prepare the checker and Git-free temporary storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4b963f57e96785c452150f02bca6a01db57f4638
          worktemp="$(mktemp -d "$RUNNER_TEMP/obaaf-validation.XXXXXX")"
          if git -C "$worktemp" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          echo "TMPDIR=$worktemp" >> "$GITHUB_ENV"
          git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit 3565c51d50a8ce61f3ba7c49c0688536fa049b68 # PR 362
          git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit fde021a8d7b59308d782d6c660f7b3d991ebab21 # PR 363
          git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit 24b4070738eb7216d4898ecf6a116a2b8683c32c # PR 364
          git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit 7de1abdaf8dc6247f986e33d481a497001afe92b # PR 365
          git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit ce27cf220475d6f7d14bf5cc8caa3f29e3e95f3f # PR 366
          git -c user.name='OBAAF validation' -c user.email='validation@users.noreply.github.com' merge --no-ff --no-edit 60ba958709925ccd24c5bd23fa62b9fce34bc43c # PR 367
          git rev-parse HEAD^{tree}
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e '.[keys]'
      - name: Run the full acceptance suite and repository checks
        run: |
          set -euo pipefail

          obaaf docs build --check
          python -m unittest discover -s tests > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -100 "$RUNNER_TEMP/tests.log"; exit 1; }
          grep -E '^(Ran [0-9]+ tests|OK)' "$RUNNER_TEMP/tests.log"
          obaaf catalog > /dev/null
          obaaf docs build --check
          python site/build.py --output "$RUNNER_TEMP/resource-site"
          obaaf check . --baseline .github/obaaf-baseline.json --fail-on medium > /dev/null
