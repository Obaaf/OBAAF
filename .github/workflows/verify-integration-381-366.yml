name: Verify draft 366 with draft 381

on:
  push:
    branches: [lead/verify-381-366-59b6e3c]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: [suite, comparisons]
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d0e32ca5ff8b79068a778984a80e03ce20097f2a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Prepare the checker and Git-free temporary storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d0e32ca5ff8b79068a778984a80e03ce20097f2a
          git -c user.name='Verification Runner' -c user.email='verification@localhost' merge --no-ff --no-edit 59b6e3c24657a580050b468d7057e635d34a1d9b
          test "$(git show -s --format=%P)" = "d0e32ca5ff8b79068a778984a80e03ce20097f2a 59b6e3c24657a580050b468d7057e635d34a1d9b"
          git show --no-patch --format='Native merge %H parents %P tree %T'
          git merge-base --is-ancestor 59b6e3c24657a580050b468d7057e635d34a1d9b HEAD
          echo "Integrated review tree $(git rev-parse HEAD^{tree})"
          git diff --check 59b6e3c24657a580050b468d7057e635d34a1d9b HEAD
          worktemp="$(mktemp -d "$RUNNER_TEMP/obaaf-validation.XXXXXX")"
          if git -C "$worktemp" rev-parse --git-dir >/dev/null 2>&1; then exit 1; fi
          export TMPDIR="$worktemp"
          echo "TMPDIR=$worktemp" >> "$GITHUB_ENV"
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e '.[keys]'
      - name: Check attribution on ordinary static workflow inputs
        if: matrix.test == 'suite'
        run: |
          obaaf docs build --check
          python - <<'PY'
          from itertools import product
          from pathlib import Path
          import json
          import subprocess
          from tempfile import TemporaryDirectory
          from obaaf import checker

          pin = "b" * 40
          for local, tool in product((False, True), ("claude", "printf")):
              for consumer in ("sh", "cat"):
                  with TemporaryDirectory() as tmp:
                      root = Path(tmp)
                      workflows = root / ".github" / "workflows"
                      workflows.mkdir(parents=True)
                      source = f"""on: workflow_dispatch
          permissions: {{contents: read}}
          jobs:
            build:
              runs-on: ubuntu-24.04
              steps:
                - run: $TOOL -p review
                  env: {{TOOL: {tool}}}
                - uses: actions/upload-artifact@{pin}
                  with: {{name: report, path: report.txt}}
            reader:
              needs: build
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/download-artifact@{pin}
                  with: {{name: report, path: result}}
                - name: inspect
                  run: {consumer} result/report.txt
          """
                      if local:
                          action = root / "tools" / "review"
                          action.mkdir(parents=True)
                          (action / "action.yml").write_text(
                              "name: Review\ndescription: Read the review settings\nruns:\n"
                              "  using: composite\n  steps:\n    - shell: bash\n      run: $TOOL -p review\n",
                              encoding="utf-8",
                          )
                          source = source.replace(
                              "    steps:\n      - run: $TOOL -p review\n        env: {TOOL: " + tool + "}",
                              "    env: {TOOL: " + tool + "}\n    steps:\n      - uses: ./tools/review",
                          )
                          assert "uses: ./tools/review" in source
                      (workflows / "pipeline.yml").write_text(source, encoding="utf-8")
                      result = checker.check(root, config=checker.Config.from_data({}, "obaaf.yml"), catalog=checker.load())
                      producer = any(f.rule == "OBAAF-GHA-020" and f.job == "build" for f in result.findings)
                      consuming = [(f.job, f.step) for f in result.findings if f.rule == "OBAAF-GHA-027"]
                      print("static fixture", local, tool, consumer, producer, consuming)
                      assert producer == (tool == "claude")
                      assert consuming == ([("reader", "inspect")] if tool == "claude" and consumer == "sh" else [])
                      cli = subprocess.run(
                          ["obaaf", "check", ".", "--format", "json", "--fail-on", "never"],
                          cwd=root, capture_output=True, text=True, check=True,
                      )
                      findings = json.loads(cli.stdout)["findings"]
                      cli_producer = any(f["rule"] == "OBAAF-GHA-020" and f["job"] == "build" for f in findings)
                      cli_consumer = [(f["job"], f["step"]) for f in findings if f["rule"] == "OBAAF-GHA-027"]
                      assert (cli_producer, cli_consumer) == (producer, consuming), findings
                      print("CLI fixture", local, tool, consumer, cli_producer, cli_consumer)
          PY
      - name: Compare ordinary multi-tool reports with the previous integrated checker
        if: matrix.test == 'suite'
        shell: bash
        run: |
          set -euo pipefail
          previous_tree=$(git merge-tree --write-tree d0e32ca5ff8b79068a778984a80e03ce20097f2a e19aee58bc4e1236f050663dbcd75e9407453698)
          test "$previous_tree" = 29671b6ff917ab1ddde7853e410b8ffc070b6ff4
          mkdir -p "$TMPDIR/previous" "$TMPDIR/multitool/.github/workflows"
          git archive "$previous_tree" src | tar -x -C "$TMPDIR/previous"
          cd "$TMPDIR/multitool"
          cat > .github/workflows/check.yml <<'YAML'
          on: workflow_dispatch
          permissions: {contents: read}
          jobs:
            versions:
              runs-on: ubuntu-24.04
              env: {FIRST: claude, SECOND: codex}
              steps:
                - run: |
                    $FIRST --version
                    $SECOND --version
            help:
              runs-on: ubuntu-24.04
              env: {FIRST: printf, SECOND: gemini}
              steps:
                - run: |
                    $FIRST --help
                    $SECOND --help
          YAML
          for source in "$TMPDIR/previous/src" "$GITHUB_WORKSPACE/src"; do
            case "$source" in
              "$TMPDIR/previous/src") tag=before ;;
              *) tag=after ;;
            esac
            Src="$source" PYTHONPATH="$source" python -c 'import os, obaaf.cli; from pathlib import Path; assert Path(obaaf.cli.__file__).resolve().is_relative_to(Path(os.environ["Src"]).resolve())'
            PYTHONPATH="$source" obaaf check . --format json --fail-on never > "$TMPDIR/$tag.json" 2> "$TMPDIR/$tag.stderr"
          done
          cat > "$TMPDIR/count_calls.py" <<'PY'
          from pathlib import Path
          from unittest.mock import patch
          from obaaf import checker
          from obaaf.checker import agent_flags

          with patch.object(agent_flags, "put_in_cheaply", wraps=agent_flags.put_in_cheaply) as expansion:
              checker.check(Path.cwd(), config=checker.Config.from_data({}, "obaaf.yml"), catalog=checker.load())
          for mark in ("--version", "--help"):
              print(sum(mark in call.args[0] and "$FIRST" in call.args[0] for call in expansion.call_args_list))
          PY
          PYTHONPATH="$TMPDIR/previous/src" python "$TMPDIR/count_calls.py" > "$TMPDIR/counts-before"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python "$TMPDIR/count_calls.py" > "$TMPDIR/counts-after"
          python - <<'PY'
          from pathlib import Path
          import os
          work = Path(os.environ["TMPDIR"])
          before = list(map(int, (work / "counts-before").read_text().splitlines()))
          after = list(map(int, (work / "counts-after").read_text().splitlines()))
          print("Expansion calls for version and help jobs:", before, after)
          assert len(before) == len(after) == 2
          assert all(0 < new < old for old, new in zip(before, after))
          PY
          cmp "$TMPDIR/before.json" "$TMPDIR/after.json"
          cmp "$TMPDIR/before.stderr" "$TMPDIR/after.stderr"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["TMPDIR"]) / "after.json").read_text())
          assert any(path.endswith(".github/workflows/check.yml") for path in report["files"]), report["files"]
          assert not report["errors"], report["errors"]
          print("Two-job multi-tool reports and errors matched")
          PY
      - name: Verify packaging, catalog, generated docs, site and medium gate
        if: matrix.test == 'suite'
        run: |
          set -euo pipefail
          python -m pip install --constraint actions/setup-obaaf/constraints.txt setuptools
          python -c 'from setuptools.build_meta import build_sdist; import os; build_sdist(os.environ["TMPDIR"])'
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$TMPDIR" "$TMPDIR"/obaaf-*.tar.gz
          python -m venv "$TMPDIR/package"
          "$TMPDIR/package/bin/python" -m pip install --constraint actions/setup-obaaf/constraints.txt "$TMPDIR"/obaaf-*.whl
          (cd "$TMPDIR" && "$TMPDIR/package/bin/obaaf" catalog > /dev/null)
          obaaf catalog > /dev/null
          obaaf docs build --check
          python site/build.py --output "$RUNNER_TEMP/resource-site"
          obaaf check . --baseline .github/obaaf-baseline.json --fail-on medium > /dev/null
      - name: Compare text, JSON, SARIF and summary on both repositories
        if: matrix.test == 'comparisons'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/base-src"
          git archive d0e32ca5ff8b79068a778984a80e03ce20097f2a src | tar -x -C "$RUNNER_TEMP/base-src"
          git init -q "$RUNNER_TEMP/expectrail"
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout init --no-cone
          git -C "$RUNNER_TEMP/expectrail" sparse-checkout set --no-cone '/*' '!/bugs/' '!/fresh-*/'
          git -C "$RUNNER_TEMP/expectrail" fetch -q --filter=blob:none --depth=1 https://github.com/Expectrail/Expectrail.git de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          git -C "$RUNNER_TEMP/expectrail" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/expectrail" rev-parse HEAD)" = de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import difflib
          import hashlib
          import json
          from collections import Counter
          import os
          import subprocess
          import sys
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          candidate = Path(os.environ["GITHUB_WORKSPACE"])
          sources = [temp / "base-src/src", candidate / "src"]
          reports = temp / "comparison-evidence"
          reports.mkdir()
          for path, level, expected in [(candidate, "medium", 0), (temp / "expectrail", "low", 1)]:
              extra = ["--no-fixes"] if level == "low" else []
              for mode in [["--format", "text"], ["--format", "json"], ["--format", "sarif"], ["--summary"]]:
                  observations = []
                  for src in sources:
                      env = {**os.environ, "PYTHONPATH": str(src), "PYTHONDONTWRITEBYTECODE": "1"}
                      module = subprocess.check_output(
                          [sys.executable, "-c", "import obaaf.cli; print(obaaf.cli.__file__)"],
                          env=env, text=True,
                      ).strip()
                      assert Path(module).resolve().is_relative_to(src.resolve())
                      argv = ["obaaf", "check", str(path), "--baseline", str(path / ".github/obaaf-baseline.json"),
                              "--fail-on", level, *extra, *mode]
                      run = subprocess.run(argv, env=env, capture_output=True)
                      observations.append((run.returncode, run.stdout, run.stderr))
                  before, after = observations
                  label = f"{path.name}-{mode[-1].strip('-')}"
                  for side, (code, out, err) in zip(("base", "candidate"), observations):
                      (reports / f"{label}-{side}.stdout").write_bytes(out)
                      (reports / f"{label}-{side}.stderr").write_bytes(err)
                      (reports / f"{label}-{side}.exit").write_text(str(code))
                  assert before == after, f"Comparison differs for {label}"
                  assert before[0] == expected, f"Unexpected exit for {label}"
                  print(f"Matched {label} exit={expected}", flush=True)
          PY
