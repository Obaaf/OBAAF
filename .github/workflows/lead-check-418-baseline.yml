name: Check integration of the runner-file rule and adoption drafts
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  merge-trees:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          fetch-depth: 0
          persist-credentials: false
      - name: Check the three-file guide and locate conflicts with the adoption build
        env:
          CORE_HEAD: b27fee9a07c7d5f6525c026fb510980972d55e20
          GUIDE_HEAD: 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          ADOPTION_HEAD: e49616ec3b1abe58e73273c852f2073e3dcb9f30
        run: |
          export TMPDIR="$RUNNER_TEMP"
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git config user.name 'OBAAF integration check'
          git config user.email 'integration@localhost'
          python - <<'PY'
          import os
          import subprocess

          def merge(label, left, right):
              result = subprocess.run(
                  ["git", "merge-tree", "--write-tree", "--name-only", left, right],
                  capture_output=True, text=True,
              )
              if result.returncode not in (0, 1):
                  raise RuntimeError(result.stderr)
              entries = result.stdout.splitlines()
              print(label, "CLEAN" if result.returncode == 0 else "CONFLICT", entries[0], flush=True)
              for name in entries[1:]:
                  if not name:
                      break
                  print(label, "requires resolution:", name, flush=True)
              if result.returncode == 0:
                  commit = subprocess.check_output(
                      ["git", "commit-tree", entries[0], "-p", left, "-p", right, "-m", label],
                      text=True,
                  )
                  return commit.strip()

          core = os.environ["CORE_HEAD"]
          guide = os.environ["GUIDE_HEAD"]
          adoption = os.environ["ADOPTION_HEAD"]
          merged = merge("#423 + #422", core, guide)
          merge("#423 + #366/#297", core, adoption)
          if merged:
              merge("#423/#422 + #366/#297", merged, adoption)
          PY
