name: Measure lane inference within composite-action expansion
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 169af18424247a21656e41f18d9f72be97c25965
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Measure the existing fixture on one runner
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          cat > "$TMPDIR/measure.py" <<'PY'
          import ast
          import inspect
          import sys
          import textwrap
          import time
          import unittest
          from collections import Counter
          from contextlib import ExitStack
          from pathlib import Path
          from unittest.mock import patch

          root = Path.cwd()
          sys.path[:0] = [str(root / "src"), str(root / "tests")]
          from obaaf.checker import rules
          from test_local_composite_actions import TheReviewersSixthPassTest

          mode = sys.argv[1]
          elapsed = Counter()
          counts = Counter()

          def timed(name, original):
              def measure(*args, **kwargs):
                  phase = "second" if name in {"_through_view", "through_job", "_inferred_lanes"} or getattr(args[0], "_through", False) else "first"
                  group = (phase, name)
                  start = time.perf_counter()
                  try:
                      return original(*args, **kwargs)
                  finally:
                      elapsed[group] += time.perf_counter() - start
                      counts[group] += 1
              return measure

          class Case(TheReviewersSixthPassTest):
              def assertLess(self, first, second, msg=None):
                  print(f"FIXTURE {mode} {first:.3f} limit={second}", flush=True)
                  super().assertLess(first, second, msg)

          with ExitStack() as patches:
              if mode != "baseline":
                  tree = ast.parse(textwrap.dedent(inspect.getsource(rules.WorkflowRules.run)))
                  methods = {node.func.attr for node in ast.walk(tree)
                             if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
                             and isinstance(node.func.value, ast.Name) and node.func.value.id == "self"}
                  # The outer through_local_actions call includes the entire second pass.
                  # Keep it out of the groups so a nested call does not count twice.
                  for name in sorted(methods - {"through_local_actions"}):
                      original = getattr(rules.WorkflowRules, name)
                      patches.enter_context(patch.object(rules.WorkflowRules, name, timed(name, original)))
                  # These nested timers measure parts of _through_view; do not add the times together.
                  for name in ("_through_view", "through_job", "_inferred_lanes"):
                      original = getattr(rules, name)
                      patches.enter_context(patch.object(rules, name, timed(name, original)))
              case = Case("test_a_large_repository_with_realistic_actions_passes")
              result = unittest.TextTestRunner(verbosity=2).run(case)
          for (phase, name), seconds in elapsed.most_common():
              print(f"GROUP {mode} {phase} {name} {seconds:.3f} {counts[(phase, name)]}")
          sys.exit(int(not result.wasSuccessful()))
          PY
          failed=0
          for mode in measured-1 baseline measured-2; do
            python "$TMPDIR/measure.py" "$mode" || failed=1
          done
          exit "$failed"
