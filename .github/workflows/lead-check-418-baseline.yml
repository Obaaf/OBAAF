name: Measure the existing local-action performance test for issue 227
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d297c7bbdf43e8e9e7459c835586d761b66381ba
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Compare the same test and its local-action pass on one runner
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          git worktree add -q --detach "$TMPDIR/prior" 55661337e24248ac7d2346e6ab9cb0069261dffa
          git worktree add -q --detach "$TMPDIR/draft" 6fe8cd177220a1d1d2e6dfabbb78e89162f3a78e
          git diff --exit-code 55661337e24248ac7d2346e6ab9cb0069261dffa d297c7bbdf43e8e9e7459c835586d761b66381ba -- src tests
          cat > "$TMPDIR/measure.py" <<'PY'
          import sys
          import time
          import unittest
          from pathlib import Path
          from unittest.mock import patch

          root = Path.cwd()
          sys.path[:0] = [str(root / "src"), str(root / "tests")]
          from obaaf.checker.rules import WorkflowRules
          from test_local_composite_actions import TheReviewersSixthPassTest

          second_pass = 0.0
          original_pass = WorkflowRules.through_local_actions
          def timed_pass(self):
              global second_pass
              start = time.monotonic()
              try:
                  return original_pass(self)
              finally:
                  second_pass += time.monotonic() - start

          class MeasuredCase(TheReviewersSixthPassTest):
              def assertLess(self, first, second, msg=None):
                  print(f"MEASURE {sys.argv[1]} total={first:.3f} local_action_pass={second_pass:.3f} limit={second}", flush=True)
                  super().assertLess(first, second, msg)

          with patch.object(WorkflowRules, "through_local_actions", timed_pass):
              case = MeasuredCase("test_a_large_repository_with_realistic_actions_passes")
              result = unittest.TextTestRunner(verbosity=2).run(case)
          sys.exit(int(not result.wasSuccessful()))
          PY
          failed=0
          for source in "$TMPDIR/prior" "$GITHUB_WORKSPACE" "$TMPDIR/draft" "$TMPDIR/draft" "$GITHUB_WORKSPACE" "$TMPDIR/prior"; do
            (cd "$source" && python "$TMPDIR/measure.py" "$(git rev-parse --short HEAD)") || failed=1
          done
          exit "$failed"
