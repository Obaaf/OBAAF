name: Compare the elapsed-time head check on one runner
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  compare-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Alternate flagship and draft on the existing 400-job performance test
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git worktree add --detach "$RUNNER_TEMP/flagship" b4985c76b8305b9463a61177a6a8904e62f1a486
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          case = """
          import sys
          import unittest
          from test_local_composite_actions import TheReviewersSixthPassTest
          class Measured(TheReviewersSixthPassTest):
              def assertLess(self, actual, limit, *args, **kwargs):
                  print(f"Observed {actual:.3f} seconds against {limit} seconds", flush=True)
                  super().assertLess(actual, limit, *args, **kwargs)
          suite = unittest.TestSuite([Measured("test_a_large_repository_with_realistic_actions_passes")])
          sys.exit(0 if unittest.TextTestRunner().run(suite).wasSuccessful() else 1)
          """
          import textwrap
          base = Path(os.environ["RUNNER_TEMP"]) / "flagship"
          head = Path.cwd()
          failures = []
          for index, tree in enumerate([base, head, head, base, base, head], 1):
              label = "flagship" if tree == base else "draft #366"
              print(f"Trial {index} on {label}", flush=True)
              env = dict(os.environ, PYTHONPATH=os.pathsep.join(map(str, [tree / "src", tree / "tests"])))
              result = subprocess.run([sys.executable, "-c", textwrap.dedent(case)], env=env, cwd=tree)
              if result.returncode:
                  failures.append((index, label))
          if failures:
              sys.exit(f"Outside the existing test limit or execution failed: {failures}")
          PY
