name: Verify the shell release notes and the launch walkthrough together
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6fe8cd177220a1d1d2e6dfabbb78e89162f3a78e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Merge the three pinned heads in the checkout
        id: integrate
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          export TMPDIR="$RUNNER_TEMP"
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git config user.name "OBAAF integration check"
          git config user.email "integration@localhost"
          if git merge --no-ff --no-commit f13262d4805b280bb4cc9ba61a2614affbfdb2b2; then exit 1; fi
          test "$(git diff --name-only --diff-filter=U)" = src/obaaf/checker/rules.py
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("src/obaaf/checker/rules.py")
          source = path.read_text(encoding="utf-8")
          conflict = (r"^<<<<<<< [^\n]+\nfrom obaaf.checker import agent_flags, artifact_consumers\n"
                      r"=======\nfrom obaaf.checker import agent_code\nfrom obaaf.checker import agent_flags\n"
                      r">>>>>>> [^\n]+\n")
          replacement = "from obaaf.checker import agent_code\nfrom obaaf.checker import agent_flags, artifact_consumers\n"
          result, count = re.subn(conflict, replacement, source, flags=re.MULTILINE)
          assert count == 1 and "<<<<<<<" not in result and ">>>>>>>" not in result
          assert "return agent_code.cmd_carets_out(text)" in result
          path.write_text(result, encoding="utf-8")
          PY
          git add -- src/obaaf/checker/rules.py
          git diff --cached --check
          git commit --no-edit
          git worktree add -q --detach "$RUNNER_TEMP/before-tests" HEAD
          git merge --no-ff --no-edit 5554d5cb1d16ad98c8d66c02ed373fa04e559e37
          git diff --check 6fe8cd177220a1d1d2e6dfabbb78e89162f3a78e HEAD
          test "$(git diff --name-only HEAD^1 HEAD)" = tests/test_fix_patch.py
          echo "Integration tree $(git rev-parse HEAD^{tree})"
          git merge-base --is-ancestor d884604e00e7ef660a0e13667581dc8430d33a38 e49616ec3b1abe58e73273c852f2073e3dcb9f30
          git worktree add -q --detach "$RUNNER_TEMP/earlier" e49616ec3b1abe58e73273c852f2073e3dcb9f30
          git -C "$RUNNER_TEMP/earlier" merge --no-ff --no-commit b4985c76b8305b9463a61177a6a8904e62f1a486
          test "$(git -C "$RUNNER_TEMP/earlier" write-tree)" = c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f
          git diff --quiet 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2 c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f -- . ':(exclude)docs/from-report-to-gate.md' ':(exclude)docs/upgrading.md'
          git diff --binary 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2 c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f -- docs/from-report-to-gate.md docs/upgrading.md > "$RUNNER_TEMP/walkthrough.patch"
          git apply --3way --index "$RUNNER_TEMP/walkthrough.patch"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$(printf '%s\n' docs/from-report-to-gate.md docs/upgrading.md)"
          git diff --binary 8812166c33f8dd274e002ff98c83af5280c8a7c3 f13262d4805b280bb4cc9ba61a2614affbfdb2b2 -- CHANGELOG.md DECISIONS.md docs/bypass-attempts.md docs/upgrading.md > "$RUNNER_TEMP/reviewed-docs.patch"
          git apply --reverse --check "$RUNNER_TEMP/reviewed-docs.patch"
          git apply --reverse --check "$RUNNER_TEMP/walkthrough.patch"
          echo "Combined walkthrough tree $(git write-tree)"
          git worktree add -q --detach "$RUNNER_TEMP/flagship" 67f84e5231146b2ff312b64f0c8021d7e2f544ec
          git worktree add -q --detach "$RUNNER_TEMP/adoption" 6fe8cd177220a1d1d2e6dfabbb78e89162f3a78e
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
      - name: Check both lanes and native patch replay together
        run: |
          export PYTHONPATH="$PWD/src:$PWD/tests"
          python -m unittest -v test_adoption_path test_docs test_todo_upgrade test_templates_install_docs test_shell_lanes test_env_shell test_artifact_consumer_index test_egress_artifact_producers test_fix_patch
          python -m obaaf docs build --check
      - name: Check the review contribution and the shell change on both adopters
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        run: |
          git clone --quiet --no-checkout https://github.com/Expectrail/Expectrail.git "$RUNNER_TEMP/expectrail"
          git -C "$RUNNER_TEMP/expectrail" checkout --quiet --detach de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          scratch = Path(os.environ["RUNNER_TEMP"])
          settings = scratch / "flagship"
          adopters = [
              ("OBAAF", settings, settings / ".github/obaaf-settings.json", "medium"),
              ("Expectrail", scratch / "expectrail", settings / "tests/fixtures/settings/live-expectrail-2026-11-13/snapshot.json", "low"),
          ]
          for name, site, snapshot, threshold in adopters:
              for mode in ("text", "json", "sarif", "summary"):
                  command = [sys.executable, "-m", "obaaf", "check", ".", "--settings", str(snapshot),
                             "--baseline", ".github/obaaf-baseline.json", "--fail-on", threshold]
                  command.extend(["--summary"] if mode == "summary" else ["--format", mode])
                  if name == "Expectrail":
                      command.append("--no-fixes")
                  outputs = []
                  for src in (scratch / "adoption", scratch / "before-tests", Path.cwd()):
                      env = dict(os.environ, PYTHONPATH=str(src / "src"))
                      result = subprocess.run(command, cwd=site, env=env, capture_output=True)
                      assert result.returncode in (0, 1), (name, mode, result.stderr[-500:])
                      assert b"git did not list the tracked files" not in result.stdout
                      outputs.append((result.returncode, result.stdout, result.stderr))
                  assert outputs[1] == outputs[2], (name, mode, "fixture-only change affected public output")
                  print("ADOPTER", name, mode, "fixture identical", "shell delta" if outputs[0] != outputs[1] else "shell identical",
                        "exit", outputs[0][0], outputs[2][0], flush=True)
          PY
      - name: Run the full combined suite
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        run: |
          export PYTHONPATH="$PWD/src:$PWD/tests"
          python -m unittest discover -s tests -v
