name: Integrate merged runner-file checks into the item 7 draft
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  merge-trees:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 55661337e24248ac7d2346e6ab9cb0069261dffa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Resolve the draft against the flagship handover
        id: resolve
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git config user.name 'OBAAF integration check'
          git config user.email 'integration@localhost'
          echo "Ready guide on actual flagship"
          git merge-tree --write-tree 55661337e24248ac7d2346e6ab9cb0069261dffa 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          if git merge --no-ff --no-commit 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2; then exit 1; fi
          python - <<'PY'
          import subprocess
          from pathlib import Path
          profile = "src/obaaf/data/profile.yaml"
          spec = "spec/profile.md"
          tests = "tests/test_todo_catalog.py"
          unmerged = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True)
          assert set(unmerged.splitlines()) == {profile, spec, tests}, unmerged
          subprocess.run(["git", "checkout", "--ours", "--", profile, spec, tests], check=True)
          for file, anchor, updated in [
              (profile, "OBAAF-GHA-022, OBAAF-JEN-001", "OBAAF-GHA-022, OBAAF-GHA-027, OBAAF-JEN-001"),
              (tests, '    "OBAAF-GHA-028": {""},', '    "OBAAF-GHA-027": {""},\n    "OBAAF-GHA-028": {""},'),
          ]:
              path = Path(file)
              content = path.read_text(encoding="utf-8")
              assert content.count(anchor) == 1, file
              path.write_text(content.replace(anchor, updated), encoding="utf-8")
          PY
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python -m obaaf docs build
          git add -- spec/profile.md src/obaaf/data/profile.yaml tests/test_todo_catalog.py
          git diff --exit-code
          git diff --cached --check
          git write-tree
          python -m obaaf catalog
          python -m obaaf docs build --check
          python - <<'PY'
          import difflib
          import json
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args])

          def files(tree):
              entries = {}
              for line in git("ls-tree", "-r", tree).decode().splitlines():
                  info, path = line.split("\t", 1)
                  mode, kind, oid = info.split()
                  entries[path] = (mode, oid)
              return entries

          draft = files("41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2")
          flagship = files("55661337e24248ac7d2346e6ab9cb0069261dffa")
          tree = git("write-tree").decode().strip()
          merged = files(tree)
          print("ACTUAL_TREE", tree)
          for path in sorted(set(draft) | set(merged)):
              if draft.get(path) == merged.get(path):
                  continue
              mode, sha = merged[path]
              entry = dict(path=path, mode=mode, sha=sha, type="blob")
              if merged[path] != flagship.get(path):
                  choices = []
                  result = git("cat-file", "blob", sha).decode().splitlines(keepends=True)
                  for parent in (draft, flagship):
                      if path not in parent:
                          continue
                      reference = parent[path][1]
                      original = git("cat-file", "blob", reference).decode().splitlines(keepends=True)
                      matcher = difflib.SequenceMatcher(None, original, result, autojunk=False)
                      changes = [[a, b, "".join(result[c:d])] for op, a, b, c, d in matcher.get_opcodes() if op != "equal"]
                      choices.append((len(json.dumps(changes)), reference, changes))
                  _, entry["reference"], entry["changes"] = min(choices, key=lambda c:c[0])
              print("MERGED_ENTRY", json.dumps(entry, ensure_ascii=True))
          PY
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 55661337e24248ac7d2346e6ab9cb0069261dffa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Resolve the draft against the flagship handover
        id: resolve
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git config user.name 'OBAAF integration check'
          git config user.email 'integration@localhost'
          echo "Ready guide on actual flagship"
          git merge-tree --write-tree 55661337e24248ac7d2346e6ab9cb0069261dffa 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          if git merge --no-ff --no-commit 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2; then exit 1; fi
          python - <<'PY'
          import subprocess
          from pathlib import Path
          profile = "src/obaaf/data/profile.yaml"
          spec = "spec/profile.md"
          tests = "tests/test_todo_catalog.py"
          unmerged = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True)
          assert set(unmerged.splitlines()) == {profile, spec, tests}, unmerged
          subprocess.run(["git", "checkout", "--ours", "--", profile, spec, tests], check=True)
          for file, anchor, updated in [
              (profile, "OBAAF-GHA-022, OBAAF-JEN-001", "OBAAF-GHA-022, OBAAF-GHA-027, OBAAF-JEN-001"),
              (tests, '    "OBAAF-GHA-028": {""},', '    "OBAAF-GHA-027": {""},\n    "OBAAF-GHA-028": {""},'),
          ]:
              path = Path(file)
              content = path.read_text(encoding="utf-8")
              assert content.count(anchor) == 1, file
              path.write_text(content.replace(anchor, updated), encoding="utf-8")
          PY
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python -m obaaf docs build
          git add -- spec/profile.md src/obaaf/data/profile.yaml tests/test_todo_catalog.py
          git diff --exit-code
          git diff --cached --check
          git write-tree
          python -m obaaf catalog
          python -m obaaf docs build --check
          git commit --no-edit
          git diff --quiet 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2 e49616ec3b1abe58e73273c852f2073e3dcb9f30 -- . ':(exclude)docs/from-report-to-gate.md' ':(exclude)docs/upgrading.md'
          git diff --binary 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2 e49616ec3b1abe58e73273c852f2073e3dcb9f30 -- docs/from-report-to-gate.md docs/upgrading.md > "$RUNNER_TEMP/walkthrough.patch"
          git apply --3way --index "$RUNNER_TEMP/walkthrough.patch"
          git diff --cached --check
          echo "Actual draft plus walkthrough"
          git write-tree
      - name: Compare four report formats on both adopters
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git worktree add -q --detach "$RUNNER_TEMP/flagship" 55661337e24248ac7d2346e6ab9cb0069261dffa
          git worktree add -q --detach "$RUNNER_TEMP/previous-adoption" e49616ec3b1abe58e73273c852f2073e3dcb9f30
          git clone --quiet --no-checkout https://github.com/Expectrail/Expectrail.git "$RUNNER_TEMP/expectrail"
          git -C "$RUNNER_TEMP/expectrail" checkout --quiet --detach de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          settings = root / "flagship"
          sites = [
              ("OBAAF", settings, settings / ".github/obaaf-settings.json", "medium", 0),
              ("Expectrail", root / "expectrail", settings / "tests/fixtures/settings/live-expectrail-2026-11-13/snapshot.json", "low", 1),
          ]
          for label, before, after in [("Combined checker", root / "previous-adoption", Path.cwd())]:
              for name, site, snapshot, threshold, expected in sites:
                  for mode in ("text", "json", "sarif", "summary"):
                      command = [sys.executable, "-m", "obaaf", "check", ".", "--settings", str(snapshot),
                                 "--baseline", ".github/obaaf-baseline.json", "--fail-on", threshold]
                      command.extend(["--summary"] if mode=="summary" else ["--format", mode])
                      if name=="Expectrail":
                          command.append("--no-fixes")
                      outputs = []
                      for source in (before, after):
                          env = dict(os.environ, PYTHONPATH=str(source/"src"), PYTHONDONTWRITEBYTECODE="1")
                          result = subprocess.run(command, cwd=site, env=env, capture_output=True)
                          assert result.returncode==expected, (name, mode, result.stderr[-300:])
                          assert b"git did not list the tracked files" not in result.stdout
                          outputs.append((result.stdout, result.stderr, result.returncode))
                      assert outputs[0]==outputs[1], (label,name,mode)
                      print(label, name, mode, "matched", expected, flush=True)
          PY
      - name: Run the full combined acceptance suite
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          python -m unittest discover -s tests -v
