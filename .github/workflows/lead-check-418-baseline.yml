name: Check integration of the runner-file rule and adoption drafts
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  merge-trees:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          fetch-depth: 0
          persist-credentials: false
      - name: Check the three-file guide and locate conflicts with the adoption build
        env:
          CORE_HEAD: f21d6638f0e2bc57976769f3d1d748054d56563b
          GUIDE_HEAD: 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          ADOPTION_HEAD: e49616ec3b1abe58e73273c852f2073e3dcb9f30
        run: |
          export TMPDIR="$RUNNER_TEMP"
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git config user.name 'OBAAF integration check'
          git config user.email 'integration@localhost'
          python - <<'PY'
          import os
          import subprocess

          def merge(label, left, right):
              result = subprocess.run(
                  ["git", "merge-tree", "--write-tree", "--name-only", left, right],
                  capture_output=True, text=True,
              )
              if result.returncode not in (0, 1):
                  raise RuntimeError(result.stderr)
              entries = result.stdout.splitlines()
              print(label, "CLEAN" if result.returncode == 0 else "CONFLICT", entries[0], flush=True)
              for name in entries[1:]:
                  if not name:
                      break
                  print(label, "requires resolution:", name, flush=True)
              if result.returncode == 0:
                  commit = subprocess.check_output(
                      ["git", "commit-tree", entries[0], "-p", left, "-p", right, "-m", label],
                      text=True,
                  )
                  return commit.strip()

          core = os.environ["CORE_HEAD"]
          guide = os.environ["GUIDE_HEAD"]
          adoption = os.environ["ADOPTION_HEAD"]
          merged = merge("#423 + #422", core, guide)
          merge("#423 + #366/#297", core, adoption)
          if merged:
              merge("#423/#422 + #366/#297", merged, adoption)
          PY
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Rehearse the catalogue resolution in the runner checkout
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          git checkout -q --detach f21d6638f0e2bc57976769f3d1d748054d56563b
          git merge --no-ff -m 'Temporary guide integration' 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          if git merge --no-ff --no-commit e49616ec3b1abe58e73273c852f2073e3dcb9f30; then exit 1; fi
          python - <<'PY'
          import subprocess
          from pathlib import Path
          profile = "src/obaaf/data/profile.yaml"
          spec = "spec/profile.md"
          tests = "tests/test_todo_catalog.py"
          unmerged = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True)
          assert set(unmerged.splitlines()) == {profile, spec, tests}, unmerged
          subprocess.run(["git", "checkout", "--ours", "--", profile, spec, tests], check=True)
          for file, anchor, updated in [
              (profile, "OBAAF-GHA-022, OBAAF-JEN-001", "OBAAF-GHA-022, OBAAF-GHA-027, OBAAF-JEN-001"),
              (tests, '    "OBAAF-GHA-028": {""},', '    "OBAAF-GHA-027": {""},\n    "OBAAF-GHA-028": {""},'),
          ]:
              path = Path(file)
              content = path.read_text(encoding="utf-8")
              assert content.count(anchor) == 1, file
              path.write_text(content.replace(anchor, updated), encoding="utf-8")
          PY
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python -m obaaf docs build
          git add -- spec/profile.md src/obaaf/data/profile.yaml tests/test_todo_catalog.py
          git diff --exit-code
          git write-tree
          python -m obaaf catalog
          python -m obaaf docs build --check
          python -m unittest -v test_todo_catalog test_docs test_site_claims test_first_run test_templates_install_docs test_todo_upgrade
  plain-folder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install the submitted checker
        run: python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
      - name: Export in an ordinary folder without Git and replay with native Git
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from datetime import date, timedelta
          from pathlib import Path

          git = shutil.which("git")
          assert git
          temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          outside = subprocess.run([git, "-C", str(temp), "rev-parse", "--git-dir"], capture_output=True)
          assert outside.returncode != 0
          with tempfile.TemporaryDirectory(dir=temp) as tmp:
              root = Path(tmp) / "ordinary folder"
              flows = root / ".github" / "workflows"
              flows.mkdir(parents=True)
              workflow = flows / "build.yml"
              workflow.write_bytes(b"on: push\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n")
              config = root / ".github" / "policy.yml"
              until = (date.today() + timedelta(days=28)).isoformat()
              before = ("ignore:\n  - rule: OBAAF-GHA-008\n    path: .github/workflows/build.yml\n"
                        f"    reason: reviewed for adoption\n    until: {until}\n").encode()
              config.write_bytes(before)
              expected = before.replace(b"- rule:", b'- owner: "@team"\n    rule:')
              patch = Path(tmp) / "review.patch"
              empty_bin = Path(tmp) / "empty-bin"
              empty_bin.mkdir()
              assert shutil.which("git", path=str(empty_bin)) is None
              env = dict(os.environ, TMPDIR=str(temp), TMP=str(temp), TEMP=str(temp), PATH=str(empty_bin))
              cmd = [sys.executable, "-m", "obaaf", "fix", ".", "--config", str(config),
                     "--owner", "@team", "--patch", str(patch)]
              result = subprocess.run(cmd, cwd=root, env=env, capture_output=True, text=True)
              assert result.returncode == 0, (result.returncode, result.stdout, result.stderr)
              assert "You are accepting risk (1 finding)" in result.stdout
              assert patch.is_file() and config.read_bytes() == before
              for opts in (["--check"], []):
                  subprocess.run([git, "-c", "core.autocrlf=false", "apply", *opts, str(patch)], cwd=root, check=True)
              assert config.read_bytes() == expected
              print("Export with no Git on PATH preserved the source; native Git checked and applied the reviewed owner edit byte-for-byte.")
