name: Compare the reported shell timing on adjacent flagship heads
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1115f2096a0d761312334f79301e427ead5cc18d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Run the existing scaling test on one runner
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git worktree add -q --detach "$TMPDIR/before" d6410ceb8f9ed7d1782c0bb1e4204a5f4c3308a3
          git diff --exit-code d6410ceb8f9ed7d1782c0bb1e4204a5f4c3308a3 HEAD -- tests/test_shell_lanes.py src/obaaf/checker/agent_code.py
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          cat > "$TMPDIR/measure.py" <<'PY'
          import sys
          import unittest
          from pathlib import Path

          root = Path.cwd()
          sys.path[:0] = [str(root / "src"), str(root / "tests")]
          from test_shell_lanes import TheProgramLinesTest

          class MeasuredFixture(TheProgramLinesTest):
              def assertLess(self, actual, limit, msg=None):
                  shape = self._subtest.params["shape"]
                  if shape == "pwsh-continued-lines":
                      print(f"SCALING {sys.argv[1]} small={msg[0]:.6f} large={msg[1]:.6f} limit={limit:.6f} ratio={msg[1]/msg[0]:.2f}", flush=True)
                  super().assertLess(actual, limit, msg)

          result = unittest.TextTestRunner(verbosity=2).run(MeasuredFixture("test_linear"))
          sys.exit(int(not result.wasSuccessful()))
          PY
          failed=0
          for checkout in "$TMPDIR/before" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$TMPDIR/before" "$TMPDIR/before" "$GITHUB_WORKSPACE"; do
            (cd "$checkout" && python "$TMPDIR/measure.py" "$(git rev-parse --short HEAD)") || failed=1
          done
          exit "$failed"
