name: Measure shell scaling inside the full Python 3.10 suite
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1115f2096a0d761312334f79301e427ead5cc18d
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Measure each existing size in the scaling test during normal suite discovery
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          cat > "$TMPDIR/suite_timing.py" <<'PY'
          import gc
          import resource
          import time
          import unittest
          from unittest.mock import patch
          from test_shell_lanes import TheProgramLinesTest, agent_code

          original_test = TheProgramLinesTest.test_linear
          original_reader = agent_code.program_lines

          def measured_test(case):
              def measure(*args, **kwargs):
                  collections = []
                  def sample(phase, info):
                      collections.append((phase, info["generation"], time.perf_counter()))
                  before = resource.getrusage(resource.RUSAGE_SELF)
                  gc.callbacks.append(sample)
                  wall = time.perf_counter()
                  cpu = time.process_time()
                  try:
                      return original_reader(*args, **kwargs)
                  finally:
                      cpu = time.process_time() - cpu
                      wall = time.perf_counter() - wall
                      gc.callbacks.remove(sample)
                      after = resource.getrusage(resource.RUSAGE_SELF)
                      intervals = {0: [], 1: [], 2: []}
                      starts = {}
                      for phase, generation, stamp in collections:
                          if phase == "start":
                              starts[generation] = stamp
                          elif generation in starts:
                              intervals[generation].append(stamp - starts.pop(generation))
                      shape = case._subtest.params["shape"]
                      gc_ms = [round(1000 * sum(intervals[g]), 2) for g in range(3)]
                      counts = [len(intervals[g]) for g in range(3)]
                      print(f"TIMING {shape} wall={wall:.6f} cpu={cpu:.6f} gc_ms={gc_ms} gc_counts={counts} involuntary_switches={after.ru_nivcsw - before.ru_nivcsw}", flush=True)

              with patch.object(agent_code, "program_lines", measure):
                  original_test(case)

          suite = unittest.defaultTestLoader.discover("tests")
          with patch.object(TheProgramLinesTest, "test_linear", measured_test):
              result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(int(not result.wasSuccessful()))
          PY
          python "$TMPDIR/suite_timing.py"
