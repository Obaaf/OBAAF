name: Check the revised patch guide and walkthrough
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b56dcae60163aaf5e5f038a91cf44423452eed8a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Check the reviewer’s wording with both lead drafts
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git config user.name 'OBAAF integration check'
          git config user.email 'integration@localhost'
          git worktree add -q --detach "$RUNNER_TEMP/previous" e49616ec3b1abe58e73273c852f2073e3dcb9f30
          git -C "$RUNNER_TEMP/previous" merge --no-ff --no-commit b4985c76b8305b9463a61177a6a8904e62f1a486
          test "$(git -C "$RUNNER_TEMP/previous" write-tree)" = c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f
          git diff --binary 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2 c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f -- docs/from-report-to-gate.md docs/upgrading.md > "$TMPDIR/walkthrough.patch"
          git apply --3way --index "$TMPDIR/walkthrough.patch"
          test "$(git write-tree)" = 2d766aa46b44c20df3fd0d321361db1891ba7301
          git commit -qm 'Temporary walkthrough integration'
          git merge --no-ff --no-commit ec854b1c8e948fd6fcf52fb5279aa0eb95d0dec1
          git write-tree
          git diff --cached --check
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python -m obaaf docs build --check
          python -m unittest -v test_docs test_first_run test_templates_install_docs test_todo_upgrade
  checked-folder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ec854b1c8e948fd6fcf52fb5279aa0eb95d0dec1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install the submitted checker
        run: python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
      - name: Export from a sibling directory and replay at the checked work-tree root
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from datetime import date, timedelta
          from pathlib import Path

          git = shutil.which("git")
          assert git
          temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          outside = subprocess.run([git, "-C", str(temp), "rev-parse", "--git-dir"], capture_output=True)
          assert outside.returncode != 0
          with tempfile.TemporaryDirectory(dir=temp) as tmp:
              root = Path(tmp) / "ordinary folder"
              flows = root / ".github" / "workflows"
              flows.mkdir(parents=True)
              workflow = flows / "build.yml"
              workflow.write_bytes(b"on: push\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n")
              config = root / ".github" / "policy.yml"
              until = (date.today() + timedelta(days=28)).isoformat()
              before = ("ignore:\n  - rule: OBAAF-GHA-008\n    path: .github/workflows/build.yml\n"
                        f"    reason: reviewed for adoption\n    until: {until}\n").encode()
              config.write_bytes(before)
              expected = before.replace(b"- rule:", b'- owner: "@team"\n    rule:')
              patch = Path(tmp) / "review.patch"
              caller = Path(tmp) / "separate working directory"
              caller.mkdir()
              subprocess.run([git, "init", "-q"], cwd=root, check=True)
              subprocess.run([git, "config", "core.autocrlf", "false"], cwd=root, check=True)
              subprocess.run([git, "add", "."], cwd=root, check=True)
              env = dict(os.environ, TMPDIR=str(temp), TMP=str(temp), TEMP=str(temp))
              cmd = [sys.executable, "-m", "obaaf", "fix", str(root), "--config", str(config),
                     "--owner", "@team", "--patch", str(patch)]
              result = subprocess.run(cmd, cwd=caller, env=env, capture_output=True, text=True)
              assert result.returncode == 0, (result.returncode, result.stdout, result.stderr)
              assert "You are accepting risk (1 finding)" in result.stdout
              assert patch.is_file() and config.read_bytes() == before
              for opts in (["--check"], []):
                  subprocess.run([git, "-c", "core.autocrlf=false", "apply", *opts, str(patch)], cwd=root, check=True)
              assert config.read_bytes() == expected
              assert list(caller.iterdir()) == []
              print("The named work tree was checked from its sibling. Git checked and applied the exact reviewed edit at the target root.")
