name: Exercise the walkthrough's Windows junction test
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  junction:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: e49616ec3b1abe58e73273c852f2073e3dcb9f30
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Reproduce the integrated tree and exercise its native junction boundary
        run: |
          git config user.name 'Sean Keluo-Udeke'
          git config user.email '55066947+seanudeke@users.noreply.github.com'
          git merge --no-ff --no-commit 155a0020bfd8ce1c0580692887c0fb393f7c2cbd
          test "$(git write-tree)" = 463a7c65a5af741e4ce20f5673113cca803a8640
          export TMPDIR="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          cd tests
          python -m unittest -v test_fix_patch.FixPatchTest.test_windows_refuses_reparse_before_creating_patch
