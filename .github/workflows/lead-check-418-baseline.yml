name: Full adoption integration and report comparison
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  merge-trees:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          fetch-depth: 0
          persist-credentials: false
      - name: Check the three-file guide and locate conflicts with the adoption build
        env:
          CORE_HEAD: d33c1982ad3a02c03819166a675d64af744e5a3d
          GUIDE_HEAD: 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          ADOPTION_HEAD: e49616ec3b1abe58e73273c852f2073e3dcb9f30
        run: |
          export TMPDIR="$RUNNER_TEMP"
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git config user.name 'OBAAF integration check'
          git config user.email 'integration@localhost'
          python - <<'PY'
          import os
          import subprocess

          def merge(label, left, right):
              result = subprocess.run(
                  ["git", "merge-tree", "--write-tree", "--name-only", left, right],
                  capture_output=True, text=True,
              )
              if result.returncode not in (0, 1):
                  raise RuntimeError(result.stderr)
              entries = result.stdout.splitlines()
              print(label, "CLEAN" if result.returncode == 0 else "CONFLICT", entries[0], flush=True)
              for name in entries[1:]:
                  if not name:
                      break
                  print(label, "requires resolution:", name, flush=True)
              if result.returncode == 0:
                  commit = subprocess.check_output(
                      ["git", "commit-tree", entries[0], "-p", left, "-p", right, "-m", label],
                      text=True,
                  )
                  return commit.strip()

          core = os.environ["CORE_HEAD"]
          guide = os.environ["GUIDE_HEAD"]
          adoption = os.environ["ADOPTION_HEAD"]
          merged = merge("#423 + #422", core, guide)
          merge("#423 + #366/#297", core, adoption)
          if merged:
              merge("#423/#422 + #366/#297", merged, adoption)
          PY
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Rehearse the catalogue resolution in the runner checkout
        id: resolve
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          git checkout -q --detach d33c1982ad3a02c03819166a675d64af744e5a3d
          git merge --no-ff -m 'Temporary guide integration' 6b8f81bc1a1c1913224f0fb1a381707de8d5ce88
          if git merge --no-ff --no-commit e49616ec3b1abe58e73273c852f2073e3dcb9f30; then exit 1; fi
          python - <<'PY'
          import subprocess
          from pathlib import Path
          profile = "src/obaaf/data/profile.yaml"
          spec = "spec/profile.md"
          tests = "tests/test_todo_catalog.py"
          unmerged = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True)
          assert set(unmerged.splitlines()) == {profile, spec, tests}, unmerged
          subprocess.run(["git", "checkout", "--ours", "--", profile, spec, tests], check=True)
          for file, anchor, updated in [
              (profile, "OBAAF-GHA-022, OBAAF-JEN-001", "OBAAF-GHA-022, OBAAF-GHA-027, OBAAF-JEN-001"),
              (tests, '    "OBAAF-GHA-028": {""},', '    "OBAAF-GHA-027": {""},\n    "OBAAF-GHA-028": {""},'),
          ]:
              path = Path(file)
              content = path.read_text(encoding="utf-8")
              assert content.count(anchor) == 1, file
              path.write_text(content.replace(anchor, updated), encoding="utf-8")
          PY
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python -m obaaf docs build
          git add -- spec/profile.md src/obaaf/data/profile.yaml tests/test_todo_catalog.py
          git diff --exit-code
          git write-tree
          python -m obaaf catalog
          python -m obaaf docs build --check
          git commit --no-edit
          git rev-parse HEAD^{tree}
      - name: Compare four report formats on both adopters
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git worktree add -q --detach "$RUNNER_TEMP/flagship" b4985c76b8305b9463a61177a6a8904e62f1a486
          git worktree add -q --detach "$RUNNER_TEMP/previous-adoption" e49616ec3b1abe58e73273c852f2073e3dcb9f30
          git clone --quiet --no-checkout https://github.com/Expectrail/Expectrail.git "$RUNNER_TEMP/expectrail"
          git -C "$RUNNER_TEMP/expectrail" checkout --quiet --detach de1ddd65cbad237d2ca32eed4c62b13ba645a6d3
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          settings = root / "flagship"
          sites = [
              ("OBAAF", settings, settings / ".github/obaaf-settings.json", "medium", 0),
              ("Expectrail", root / "expectrail", settings / "tests/fixtures/settings/live-expectrail-2026-11-13/snapshot.json", "low", 1),
          ]
          for label, before, after in [("Combined checker", root / "previous-adoption", Path.cwd())]:
              for name, site, snapshot, threshold, expected in sites:
                  for mode in ("text", "json", "sarif", "summary"):
                      command = [sys.executable, "-m", "obaaf", "check", ".", "--settings", str(snapshot),
                                 "--baseline", ".github/obaaf-baseline.json", "--fail-on", threshold]
                      command.extend(["--summary"] if mode=="summary" else ["--format", mode])
                      if name=="Expectrail":
                          command.append("--no-fixes")
                      outputs = []
                      for source in (before, after):
                          env = dict(os.environ, PYTHONPATH=str(source/"src"), PYTHONDONTWRITEBYTECODE="1")
                          result = subprocess.run(command, cwd=site, env=env, capture_output=True)
                          assert result.returncode==expected, (name, mode, result.stderr[-300:])
                          assert b"git did not list the tracked files" not in result.stdout
                          outputs.append((result.stdout, result.stderr, result.returncode))
                      assert outputs[0]==outputs[1], (label,name,mode)
                      print(label, name, mode, "matched", expected, flush=True)
          PY
      - name: Run the full four-draft acceptance suite
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          python -m unittest discover -s tests -v
