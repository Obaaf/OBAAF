name: Compare launch walkthrough timing with draft 428 on Python 3.10
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 21d730dba5ac5fbe83199b1f444ad4eb4bdb250e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.10'
      - name: Combine the two draft heads with the verified walkthrough
        id: resolve
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git config user.name 'OBAAF integration check'
          git config user.email 'integration@localhost'
          git worktree add -q --detach "$RUNNER_TEMP/earlier" e49616ec3b1abe58e73273c852f2073e3dcb9f30
          git -C "$RUNNER_TEMP/earlier" merge --no-ff --no-commit b4985c76b8305b9463a61177a6a8904e62f1a486
          test "$(git -C "$RUNNER_TEMP/earlier" write-tree)" = c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f
          git diff --quiet 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2 c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f -- . ':(exclude)docs/from-report-to-gate.md' ':(exclude)docs/upgrading.md'
          git diff --binary 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2 c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f -- docs/from-report-to-gate.md docs/upgrading.md > "$RUNNER_TEMP/walkthrough.patch"
          git worktree add -q --detach "$RUNNER_TEMP/previous-adoption" 21d730dba5ac5fbe83199b1f444ad4eb4bdb250e
          git -C "$RUNNER_TEMP/previous-adoption" apply --3way --index "$RUNNER_TEMP/walkthrough.patch"
          test "$(git -C "$RUNNER_TEMP/previous-adoption" write-tree)" = 97829a0dd3fbf9c66c50c928b58efe2482c11c96
          git merge --no-ff --no-commit a85ed7d17802c4971cdd148581419428b2599a6c
          git diff --cached --check
          echo "Adoption tree $(git write-tree)"
          git commit --no-edit
          git apply --3way --index "$RUNNER_TEMP/walkthrough.patch"
          git diff --cached --check
          echo "Combined tree $(git write-tree)"
      - name: Compare the two walkthrough trees on the 400-job fixture
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          cmp tests/test_local_composite_actions.py "$RUNNER_TEMP/previous-adoption/tests/test_local_composite_actions.py"
          cat > "$TMPDIR/measure_launch.py" <<'PY'
          import sys
          import unittest
          from pathlib import Path

          root = Path.cwd()
          sys.path[:0] = [str(root / "src"), str(root / "tests")]
          from test_local_composite_actions import TheReviewersSixthPassTest

          class MeasuredFixture(TheReviewersSixthPassTest):
              def assertLess(self, actual, limit, msg=None):
                  print(f"WALKTHROUGH {sys.argv[1]} {actual:.3f}s (limit {limit}s)", flush=True)
                  super().assertLess(actual, limit, msg)

          result = unittest.TextTestRunner(verbosity=2).run(
              MeasuredFixture("test_a_large_repository_with_realistic_actions_passes")
          )
          sys.exit(int(not result.wasSuccessful()))
          PY
          failed=0
          for checkout in "$RUNNER_TEMP/previous-adoption" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/previous-adoption"; do
            (cd "$checkout" && python "$TMPDIR/measure_launch.py" "$(git write-tree)") || failed=1
          done
          exit "$failed"
