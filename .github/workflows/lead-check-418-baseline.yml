name: Verify the reviewed cost test on the combined launch tree
on:
  push:
    branches: [lead/recheck-418-aa2a4a5]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 21d730dba5ac5fbe83199b1f444ad4eb4bdb250e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Combine the two draft heads with the verified walkthrough
        id: resolve
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git config user.name 'OBAAF integration check'
          git config user.email 'integration@localhost'
          git worktree add -q --detach "$RUNNER_TEMP/earlier" e49616ec3b1abe58e73273c852f2073e3dcb9f30
          git -C "$RUNNER_TEMP/earlier" merge --no-ff --no-commit b4985c76b8305b9463a61177a6a8904e62f1a486
          test "$(git -C "$RUNNER_TEMP/earlier" write-tree)" = c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f
          git diff --quiet 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2 c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f -- . ':(exclude)docs/from-report-to-gate.md' ':(exclude)docs/upgrading.md'
          git diff --binary 41eb870457a1b2b2bae46d3eb6453f8d0ab3fdb2 c26bdd0826bfd2a1d153fe7f1e729326aadb9e3f -- docs/from-report-to-gate.md docs/upgrading.md > "$RUNNER_TEMP/walkthrough.patch"
          git worktree add -q --detach "$RUNNER_TEMP/previous-adoption" 21d730dba5ac5fbe83199b1f444ad4eb4bdb250e
          git -C "$RUNNER_TEMP/previous-adoption" apply --3way --index "$RUNNER_TEMP/walkthrough.patch"
          test "$(git -C "$RUNNER_TEMP/previous-adoption" write-tree)" = 97829a0dd3fbf9c66c50c928b58efe2482c11c96
          git merge --no-ff --no-commit 403b2dd13ae308b7655c5e7349a262e1ba203173
          git diff --cached --check
          echo "Adoption tree $(git write-tree)"
          git commit --no-edit
          git apply --3way --index "$RUNNER_TEMP/walkthrough.patch"
          git diff --cached --check
          echo "Combined tree $(git write-tree)"
      - name: Compare the complete combined trees and run the changed test module
        run: |
          export TMPDIR="$RUNNER_TEMP" PYTHONPATH="$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1
          if git -C "$TMPDIR" rev-parse --git-dir 2>/dev/null; then exit 1; fi
          git worktree add -q --detach "$RUNNER_TEMP/previous-review" 21d730dba5ac5fbe83199b1f444ad4eb4bdb250e
          git -C "$RUNNER_TEMP/previous-review" merge --no-ff --no-commit 8ce906ba9138c9f2162b5cf9adac08b36d86de85
          git -C "$RUNNER_TEMP/previous-review" commit --no-edit
          git -C "$RUNNER_TEMP/previous-review" apply --3way --index "$TMPDIR/walkthrough.patch"
          old_tree=$(git -C "$RUNNER_TEMP/previous-review" write-tree)
          new_tree=$(git write-tree)
          echo "Prior combined tree $old_tree"
          test "$(git diff --name-only "$old_tree" "$new_tree")" = tests/test_check_cost.py
          git diff --exit-code 403b2dd13ae308b7655c5e7349a262e1ba203173 "$new_tree" -- tests/test_check_cost.py
          python -m pip install --constraint actions/setup-obaaf/constraints.txt -e ".[keys]"
          python -m unittest discover -s tests -p test_check_cost.py -v
