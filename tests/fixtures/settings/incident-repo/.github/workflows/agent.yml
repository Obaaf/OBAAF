name: Agent
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    environment: main-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the agent
        run: python tools/agent.py
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
