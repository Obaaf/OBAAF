# Flagship slice 2d.25 (#411): agents named only through `env` in PowerShell and cmd steps. Each job is one case;
# tests/test_env_shell.py says what each must give. Nothing here is run: the checker reads it.
on: workflow_dispatch
permissions: {}
env:
  WF_AGENT: claude
jobs:
  pwsh-step-env:
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        run: '& $env:AGENT --dangerously-skip-permissions -p x'
        env: {AGENT: claude}
  pwsh-windows-job-env-other-case:
    runs-on: windows-latest
    env: {AGENT: claude}
    steps:
      - run: '& ${env:agent} --dangerously-skip-permissions -p x'
  pwsh-workflow-env-job-defaults:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - run: '& $env:WF_AGENT --dangerously-skip-permissions -p x'
  pwsh-option-from-env:
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        run: 'claude $env:FLAGS -p x'
        env: {FLAGS: --dangerously-skip-permissions}
  pwsh-double-quoted:
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        run: '& "$env:AGENT" --dangerously-skip-permissions -p x'
        env: {AGENT: claude}
  pwsh-start-process:
    runs-on: windows-latest
    env: {AGENT: claude}
    steps:
      - run: "Start-Process -FilePath $env:AGENT -ArgumentList '--dangerously-skip-permissions', '-p', 'x'"
  pwsh-continue:
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        run: '& $env:AGENT --auto -p x'
        env: {AGENT: cn}
  cmd-step-env:
    runs-on: windows-latest
    steps:
      - shell: cmd
        run: '%AGENT% --dangerously-skip-permissions -p x'
        env: {AGENT: claude}
  cmd-other-case-and-caret:
    runs-on: windows-latest
    env: {AGENT: claude}
    steps:
      - shell: cmd
        run: '%agent% ^--dangerously-skip-permissions -p x'
  pwsh-set-by-the-script:
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        run: |
          & $env:AGENT --dangerously-skip-permissions -p x
          $env:AGENT = 'echo'
        env: {AGENT: claude}
  cmd-set-by-the-script:
    runs-on: windows-latest
    steps:
      - shell: cmd
        run: |
          set AGENT=echo
          %AGENT% --dangerously-skip-permissions -p x
        env: {AGENT: claude}
  pwsh-self-hosted-other-case:
    runs-on: [self-hosted]
    env: {AGENT: claude}
    steps:
      - shell: pwsh
        run: '& $env:agent --dangerously-skip-permissions -p x'
  pwsh-after-github-env:
    runs-on: ubuntu-latest
    env: {AGENT: claude}
    steps:
      - shell: pwsh
        run: 'Add-Content $env:GITHUB_ENV "AGENT=echo"'
      - shell: pwsh
        run: '& $env:AGENT --dangerously-skip-permissions -p x'
