# obaaf-expect: OBAAF-GHA-027
# obaaf-models: A second job downloads an agent job's artifact and invokes its file with a shell.
name: Artifact handoff fixture
on: workflow_dispatch
permissions: {}
jobs:
  producer:
    runs-on: ubuntu-24.04
    env:
      OBAAF_LANE: agent
    steps:
      - run: echo ':' > report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: report
          path: report.txt
  consumer:
    needs: producer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: report
          path: downloaded
      - run: sh downloaded/report.txt
