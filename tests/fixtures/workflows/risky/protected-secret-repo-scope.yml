# obaaf-models: A private evaluation set's read token kept as a repository secret; any branch's workflow could check the set out and print it.
# obaaf-config: {"protected_secrets": {"PRIVATE_SET_TOKEN": "private-set"}}
# obaaf-expect: OBAAF-GHA-024
name: Private benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: example-studio/private-set
          token: ${{ secrets.PRIVATE_SET_TOKEN }}
          path: private-set
          persist-credentials: false
      - run: python -m bench --set private-set
