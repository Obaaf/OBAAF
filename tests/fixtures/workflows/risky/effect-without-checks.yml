# obaaf-models: An effect job that applies an agent's output with write access, without verifying it or waiting for approval.
# obaaf-expect: OBAAF-GHA-021 OBAAF-GHA-022
name: Apply agent patch
on:
  workflow_run:
    workflows: [Agent]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - run: git apply patch.diff && git push origin HEAD:agent-fix
