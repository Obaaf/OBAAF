<text x="292" y="128" text-anchor="middle" font-weight="700" font-size="15" fill="#111111">Snapshot step</text>
<text x="292" y="145" text-anchor="middle" font-size="14" fill="#111111">Captures inputs</text>
<text x="292" y="162" text-anchor="middle" font-size="14" fill="#111111">Records digests</text>
<text x="292" y="179" text-anchor="middle" font-size="14" fill="#111111">and integrity level</text>
