<text x="468" y="128" text-anchor="middle" font-weight="700" font-size="15" fill="#111111">Agent run</text>
<text x="468" y="145" text-anchor="middle" font-size="14" fill="#111111">Read-only token</text>
<text x="468" y="162" text-anchor="middle" font-size="14" fill="#111111">No secrets or OIDC</text>
<text x="468" y="179" text-anchor="middle" font-size="14" fill="#111111">Egress to proxy only</text>
<rect x="568" y="104" width="152" height="88" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1.25"/>
<text x="644" y="128" text-anchor="middle" font-weight="700" font-size="15" fill="#111111">Proposal bundle</text>
<text x="644" y="145" text-anchor="middle" font-size="14" fill="#111111">Patch, comment,</text>
<text x="644" y="162" text-anchor="middle" font-size="14" fill="#111111">or label changes</text>
<rect x="568" y="272" width="152" height="88" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1.25"/>
<text x="644" y="296" text-anchor="middle" font-weight="700" font-size="15" fill="#111111">Attestation step</text>
<text x="644" y="313" text-anchor="middle" font-size="14" fill="#111111">Signs digests of</text>
