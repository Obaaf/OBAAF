<text x="292" y="296" text-anchor="middle" font-weight="700" font-size="15" fill="#111111">Effect job</text>
<text x="292" y="313" text-anchor="middle" font-size="14" fill="#111111">Verifies and checks,</text>
<text x="292" y="330" text-anchor="middle" font-size="14" fill="#111111">then applies under</text>
<text x="292" y="347" text-anchor="middle" font-size="14" fill="#111111">its own identity</text>
