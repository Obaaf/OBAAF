<text x="468" y="296" text-anchor="middle" font-weight="700" font-size="15" fill="#111111">Required review</text>
<text x="468" y="313" text-anchor="middle" font-size="14" fill="#111111">A maintainer other</text>
<text x="468" y="330" text-anchor="middle" font-size="14" fill="#111111">than the requester</text>
