<text x="116" y="296" text-anchor="middle" font-weight="700" font-size="15" fill="#111111">Protected branch</text>
<text x="116" y="313" text-anchor="middle" font-size="14" fill="#111111">Changed only by</text>
<text x="116" y="330" text-anchor="middle" font-size="14" fill="#111111">the effect job</text>
<rect x="40" y="440" width="152" height="88" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1.25"/>
<text x="116" y="464" text-anchor="middle" font-weight="700" font-size="15" fill="#111111">Release job</text>
<text x="116" y="481" text-anchor="middle" font-size="14" fill="#111111">Checks each agent</text>
<text x="116" y="498" text-anchor="middle" font-size="14" fill="#111111">change is attested</text>
<text x="116" y="515" text-anchor="middle" font-size="14" fill="#111111">and approved</text>
<rect x="216" y="440" width="152" height="88" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1.25"/>
<text x="292" y="464" text-anchor="middle" font-weight="700" font-size="15" fill="#111111">Signed release</text>
<text x="292" y="481" text-anchor="middle" font-size="14" fill="#111111">Provenance records</text>
<text x="292" y="498" text-anchor="middle" font-size="14" fill="#111111">the agent runs</text>
