[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obaaf"
dynamic = ["version"]
description = "Open Build and Agent Assurance Framework: build-pipeline and AI-agent assurance tools for GitHub Actions and Jenkins"
readme = "README.md"
requires-python = ">=3.10"
# Code is Apache-2.0; the specification data under src/obaaf/data/ is also
# CC BY 4.0 (see LICENSING.md). The package ships both, so its combined SPDX
# expression is "Apache-2.0 AND CC-BY-4.0".
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-docs"]
authors = [
  { name = "Ofonna Nweze" },
  { name = "Osita Sean Keluo-Udeke" },
]
maintainers = [
  { name = "Ofonna Nweze" },
  { name = "Osita Sean Keluo-Udeke" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "PyYAML>=6.0.3",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
# Verifying DSSE envelopes signed with a key held in a key service or hardware module.
keys = ["cryptography>=42"]

[project.scripts]
obaaf = "obaaf.cli:main"

[tool.setuptools.dynamic]
version = { attr = "obaaf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obaaf = ["form_template.html"]
"obaaf.data" = ["*.yaml", "schemas/*.json"]
