# OBAAF binary manifest sources (G2.1).
#
# Option A — you vendor binaries, SDKs, engine builds or plugins. List every one,
# create the manifest, and commit both files:
#   obaaf manifest create --components obaaf-sources.yaml --out obaaf-manifest.json
# Builds then fail on any unrecorded change:
#   obaaf manifest check --manifest obaaf-manifest.json
#
# Option B — you vendor no binaries (for example a pure source/Python project).
# Declare that instead of listing components. The claim is written into the
# manifest as vendoredBinaries: none; check does not scan the tree for binaries.
# When you later add a vendored component, replace this with Option A in the same
# reviewed change. Set build_record.require_sdks: false in .github/obaaf-policy.yaml
# so `obaaf verify release` accepts an empty SDK list.
#
# vendored_binaries: none
#
components:
  - id: example-engine-plugin
    name: Example engine plugin
    version: "2.4.1"
    source: Vendor portal, downloaded by the build owner
    kind: plugin
    paths: ["Plugins/ExamplePlugin/**"]
  - id: example-analytics-sdk
    name: Example analytics SDK
    version: "5.0.0"
    source: Vendor release archive
    kind: sdk
    paths: ["ThirdParty/ExampleAnalytics/**"]
