# OBAAF self-assessment for studios without security staff.
#
# Source: Paper 2, section 6 and Tables 6 and 8. The `question`, `evidence`,
# `effort` and `profile` fields reproduce Table 6. `na_when`, `fix` and
# `short` are new in this repository (see DECISIONS.md, D-005 and D-006).
#
# Scoring (Paper 2, DR6): a studio reaches a tier when every item at that tier
# and below is answered yes. An item may be marked not applicable only when its
# condition is absent, and then counts as satisfied.

id: obaaf-self-assessment
version: 0.1.0
status: draft
source: "Paper 2, Table 6"

effort:
  L: {label: "Hours", rank: 1}
  M: {label: "Days", rank: 2}
  H: {label: "Weeks", rank: 3}

tiers:
  - id: 1
    name: Accounted
    summary: "Establishes who and what can publish or sign."
  - id: 2
    name: Controlled
    summary: "Separates release builds from untrusted work and removes standing credentials."
  - id: 3
    name: Verified
    summary: "Produces and checks provenance and isolates builds."
  - id: 4
    name: Assured
    summary: "Adds two-person control and independent verification."

items:
  # ---------------------------------------------------------------- Tier 1
  - id: "1.1"
    tier: 1
    short: MFA on publishing accounts
    question: "Does every account that can publish builds to a store require multi-factor authentication?"
    evidence: "Security settings of each publishing account"
    effort: L
    profile: [G6.3]
    fix: ["docs/guides/F6-distribution.md#item-1-1"]

  - id: "1.2"
    tier: 1
    short: Dedicated upload account
    question: "Do automated uploads use a dedicated build account that has only publishing permissions?"
    evidence: "The account's permissions in the store's partner portal"
    effort: L
    profile: [G6.1]
    fix: ["docs/guides/F6-distribution.md#item-1-2"]

  - id: "1.3"
    tier: 1
    short: A person sets builds live
    question: "Does setting a build live on a public channel require a person rather than an automated step?"
    evidence: "Release procedure and store release settings"
    effort: L
    profile: [G6.2]
    fix: ["docs/guides/F6-distribution.md#item-1-3"]

  - id: "1.4"
    tier: 1
    short: List of build and signing machines
    question: "Do you keep a list of every machine that builds or signs release builds, with an owner for each?"
    evidence: "The list, updated within the last 90 days"
    effort: L
    profile: [G3.1]
    fix: ["docs/guides/F3-build-execution.md#item-1-4"]

  - id: "1.5"
    tier: 1
    short: Key inventory
    question: "Do you know where every signing key and store upload credential is kept, and who can use it?"
    evidence: "A key inventory naming location and authorized users"
    effort: L
    profile: [G5.1, G5.3]
    fix: ["docs/guides/F5-signing.md#item-1-5"]

  - id: "1.6"
    tier: 1
    short: Protected release branches
    question: "Are release branches or streams protected so that changes need review?"
    evidence: "Branch or stream protection settings"
    effort: L
    profile: [G1.1]
    fix: ["docs/guides/F1-source-and-assets.md#item-1-6", "docs/github-settings.md#protect-release-branches"]

  - id: "1.7"
    tier: 1
    short: Individual accounts
    question: "Does every person, including contractors, use an individual source-control account?"
    evidence: "User list with no shared accounts"
    effort: L
    profile: [G1.3, G9.1]
    fix: ["docs/guides/F1-source-and-assets.md#item-1-7"]

  - id: "1.8"
    tier: 1
    short: SDK and plugin list
    question: "Do you keep a list of every third-party SDK and plugin that ships to players, with its version?"
    evidence: "The list, matching the current build"
    effort: L
    profile: [G2.1]
    fix: ["docs/guides/F2-intake.md#item-1-8"]

  # ---------------------------------------------------------------- Tier 2
  - id: "2.1"
    tier: 2
    short: Release-only build machines
    question: "Do release builds run only on machines that never build unreviewed changes?"
    evidence: "Build-agent pool configuration"
    effort: M
    profile: [G3.1]
    fix: ["docs/guides/F3-build-execution.md#item-2-1", "templates/github-actions/workflows/obaaf-release.yml"]

  - id: "2.2"
    tier: 2
    short: Reviewed build-script changes
    question: "Can build scripts, packaging steps, and CI configuration change only through reviewed commits approved by someone other than the author?"
    evidence: "Protection rules on those paths; a sample of recent changes"
    effort: M
    profile: [G1.2]
    fix: ["docs/guides/F1-source-and-assets.md#item-2-2", "templates/github-actions/CODEOWNERS.example"]

  - id: "2.3"
    tier: 2
    short: Keys in hardware or a key service
    question: "Are signing keys held in a hardware device, a cloud key service, or platform-managed signing, rather than as files?"
    evidence: "Key-service configuration; no key files on build hosts"
    effort: M
    profile: [G5.1]
    fix: ["docs/guides/F5-signing.md#item-2-3"]

  - id: "2.4"
    tier: 2
    short: Job-scoped credentials
    question: "Do build jobs receive signing and upload credentials only for the duration of the job?"
    evidence: "Credential configuration; no stored credentials on hosts"
    effort: M
    profile: [G3.4]
    fix: ["docs/guides/F3-build-execution.md#item-2-4"]

  - id: "2.5"
    tier: 2
    short: Asset and plugin quarantine
    question: "Are third-party asset packages and plugins first opened in an isolated environment with automatic script execution turned off?"
    evidence: "Intake procedure and settings of the quarantine machine"
    effort: M
    profile: [G2.2]
    fix: ["docs/guides/F2-intake.md#item-2-5"]

  - id: "2.6"
    tier: 2
    short: Digest checks for vendored files
    question: "Does the build check recorded digests for vendored binaries and SDKs?"
    evidence: "Manifest file and the build step that checks it"
    effort: M
    profile: [G2.1]
    fix: ["docs/guides/F2-intake.md#item-2-6"]

  - id: "2.7"
    tier: 2
    short: Release caches protected from untrusted writers
    question: "Do release builds use caches that untrusted builds and developer workstations cannot write?"
    evidence: "Cache access permissions"
    effort: M
    profile: [G4.1]
    fix: ["docs/guides/F4-caches.md#item-2-7", "templates/github-actions/workflows/obaaf-release.yml"]

  - id: "2.8"
    tier: 2
    short: Scoped partner access
    question: "Do contractors and porting partners have separate, scoped access that expires?"
    evidence: "Access lists with expiry dates"
    effort: L
    profile: [G9.1]
    fix: ["docs/guides/F9-partners.md#item-2-8"]

  - id: "2.9"
    tier: 2
    short: Revocation plan
    question: "Do you have a written plan to revoke signing certificates and rotate upload credentials?"
    evidence: "The plan, with named owners"
    effort: L
    profile: [G5.3]
    fix: ["docs/guides/F5-signing.md#item-2-9"]

  - id: "2.10"
    tier: 2
    short: Updater checks signatures
    question: "If you run your own launcher or patcher, does it verify update signatures with a key that is not stored on the update server?"
    evidence: "Updater code or vendor documentation"
    effort: M
    profile: [G6.5]
    na_when: "You do not run your own launcher or patcher."
    fix: ["docs/guides/F6-distribution.md#item-2-10"]

  - id: "2.11"
    tier: 2
    short: SDK behavior review
    question: "Is each player-facing SDK reviewed for the data it collects and where it sends data, before adoption and on each update?"
    evidence: "Review records for current SDK versions"
    effort: M
    profile: [G2.3]
    fix: ["docs/guides/F2-intake.md#item-2-11"]

  - id: "2.12"
    tier: 2
    short: Set-live and permission alerts
    question: "Are you alerted whenever a build is set live or publishing permissions change?"
    evidence: "Alert configuration and a recent alert"
    effort: L
    profile: [G6.3]
    fix: ["docs/guides/F6-distribution.md#item-2-12"]

  # ---------------------------------------------------------------- Tier 3
  - id: "3.1"
    tier: 3
    short: Signed provenance
    question: "Does every release build produce signed provenance listing source revision, asset revision, manifest digest, SDK versions, and builder?"
    evidence: "Provenance for the latest release"
    effort: H
    profile: [G7.1]
    fix: ["docs/guides/F7-provenance.md#item-3-1", "templates/github-actions/workflows/obaaf-release.yml"]

  - id: "3.2"
    tier: 3
    short: Automatic provenance check before upload
    question: "Is provenance checked automatically, in a separate step, before any upload to a store?"
    evidence: "The pipeline step and its log for the latest release"
    effort: M
    profile: [G7.2, G5.2]
    fix: ["docs/guides/F7-provenance.md#item-3-2", "templates/github-actions/workflows/obaaf-publish.yml"]

  - id: "3.3"
    tier: 3
    short: Fresh environments where possible
    question: "Do release builds for targets that can build in fresh containers or virtual machines always do so?"
    evidence: "Build-agent configuration for each target"
    effort: H
    profile: [G3.2]
    isolation_tier: A
    na_when: "None of your release targets can build in a fresh container or virtual machine."
    fix: ["docs/guides/F3-build-execution.md#item-3-3"]

  - id: "3.4"
    tier: 3
    short: Reimaged persistent hosts
    question: "Are persistent build hosts reimaged from a versioned image on a fixed schedule and after any suspected exposure?"
    evidence: "Reimage log"
    effort: M
    profile: [G3.2]
    isolation_tier: B
    na_when: "You have no persistent build hosts for release builds."
    fix: ["docs/guides/F3-build-execution.md#item-3-4"]

  - id: "3.5"
    tier: 3
    short: Egress allow-list for release hosts
    question: "Is outbound network traffic from release build hosts limited to an approved list?"
    evidence: "Firewall or proxy rules"
    effort: M
    profile: [G3.3]
    fix: ["docs/guides/F3-build-execution.md#item-3-5"]

  - id: "3.6"
    tier: 3
    short: Agents without secrets
    question: "Do AI agents and bots triggered by public, player, or partner content run without secrets or write access to protected branches?"
    evidence: "Workflow permissions for each agent"
    effort: M
    profile: [G8.1]
    na_when: "You use no AI agents."
    fix: ["docs/guides/F8-agents.md#item-3-6", "templates/github-actions/workflows/obaaf-agent-propose.yml"]

  - id: "3.7"
    tier: 3
    short: Code-owner protection of agent files
    question: "Are agent instruction files, and the workflows that invoke agents, protected by code-owner review?"
    evidence: "Protection rules on those paths"
    effort: L
    profile: [G8.2]
    na_when: "You use no AI agents."
    fix: ["docs/guides/F8-agents.md#item-3-7", "templates/github-actions/CODEOWNERS.example"]

  - id: "3.8"
    tier: 3
    short: Staged rollout and tested rollback
    question: "Are live updates rolled out in stages, with a tested rollback?"
    evidence: "Rollout configuration; record of a rollback test"
    effort: M
    profile: [G6.4]
    fix: ["docs/guides/F6-distribution.md#item-3-8"]

  - id: "3.9"
    tier: 3
    short: Read-only release archive
    question: "Are released artifacts, symbols, and provenance archived read-only?"
    evidence: "Archive permissions"
    effort: L
    profile: [G7.3]
    fix: ["docs/guides/F7-provenance.md#item-3-9"]

  # ---------------------------------------------------------------- Tier 4
  - id: "4.1"
    tier: 4
    short: Two approvers for release branches
    question: "Do two people approve every change to release branches?"
    evidence: "Branch rules requiring two approvals"
    effort: M
    profile: [G1.1]
    fix: ["docs/guides/F1-source-and-assets.md#item-4-1", "docs/github-settings.md#protect-release-branches"]

  - id: "4.2"
    tier: 4
    short: Independent rebuild
    question: "Do you rebuild release executables independently and compare them, recording expected differences?"
    evidence: "Comparison report for the latest release"
    effort: H
    profile: [G4.3]
    fix: ["docs/guides/F4-caches.md#item-4-2"]

  - id: "4.3"
    tier: 4
    short: Two-person set-live
    question: "Does setting a build live on a public channel require confirmation by two people?"
    evidence: "Release procedure; approval records"
    effort: M
    profile: [G6.2]
    fix: ["docs/guides/F6-distribution.md#item-4-3"]

  - id: "4.4"
    tier: 4
    short: Release-lane derived data
    question: "Do release builds regenerate derived data, or use only cache entries written by the release lane?"
    evidence: "Cache configuration for release builds"
    effort: H
    profile: [G4.2]
    fix: ["docs/guides/F4-caches.md#item-4-4", "templates/github-actions/workflows/obaaf-release.yml"]

  - id: "4.5"
    tier: 4
    short: Attested and verified agent runs
    question: "Are agent runs attested, with agent-authored changes verified before release?"
    evidence: "Attestations for agent-authored commits in the latest release"
    effort: H
    profile: [G8.3]
    na_when: "You use no AI agents."
    fix: ["docs/guides/F8-agents.md#item-4-5", "templates/github-actions/workflows/obaaf-agent-apply.yml",
          "templates/github-actions/workflows/obaaf-publish.yml"]

# Paper 2, Table 8: which items trace to which framework requirements.
traceability:
  - {framework: SLSA, requirement: "Build L1: provenance exists", ref: build-l1-provenance-exists, items: ["3.1"]}
  - {framework: SLSA, requirement: "Build L2: hosted build platform; signed provenance", ref: build-l2-hosted-signed, items: ["1.4", "2.1", "3.1", "3.2"], as_written: "1.4, 2.1; 3.1, 3.2"}
  - {framework: SLSA, requirement: "Build L3: isolated, ephemeral builds", ref: build-l3-isolated, items: ["3.3", "3.4", "2.1"], as_written: "3.3, with 3.4 as the Tier B compensating control; 2.1"}
  - {framework: SLSA, requirement: "Build L3: cache integrity", ref: build-l3-cache-integrity, items: ["2.7", "4.4"]}
  - {framework: SLSA, requirement: "Build L3: signing material inaccessible to build steps", ref: build-l3-signing-isolated, items: ["2.3", "2.4"]}
  - {framework: SLSA, requirement: "Source L1–L2: version control and change history", ref: source-l1-l2, items: ["1.6", "1.7"]}
  - {framework: SLSA, requirement: "Source L3: continuous technical controls", ref: source-l3, items: ["1.6", "2.2"]}
  - {framework: SLSA, requirement: "Source L4: two-party review", ref: source-l4, items: ["4.1"]}
  - {framework: SSDF, requirement: "PO.2: roles and responsibilities", ref: PO.2, items: ["1.4", "2.8"]}
  - {framework: SSDF, requirement: "PO.3: supporting toolchains", ref: PO.3, items: ["2.6", "3.4"]}
  - {framework: SSDF, requirement: "PO.5: secure environments", ref: PO.5, items: ["2.1", "2.4", "2.7", "3.3", "3.4", "3.5", "3.6"]}
  - {framework: SSDF, requirement: "PS.1: protect all forms of code", ref: PS.1, items: ["1.6", "1.7", "2.2", "3.7", "4.1"]}
  - {framework: SSDF, requirement: "PS.2: release integrity", ref: PS.2, items: ["1.5", "2.3", "2.9", "2.10", "3.2", "4.2"]}
  - {framework: SSDF, requirement: "PS.3: archive and protect releases", ref: PS.3, items: ["3.1", "3.9"]}
  - {framework: SSDF, requirement: "PS.4 (draft 1.2): robust updates", ref: PS.4, items: ["1.3", "2.12", "3.8", "4.3"]}
  - {framework: SSDF, requirement: "PW.4: reuse well-secured software", ref: PW.4, items: ["1.8", "2.5", "2.6", "2.11"]}
  - {framework: SSDF, requirement: "PW.7: review code", ref: PW.7, items: ["2.2", "4.5"]}
