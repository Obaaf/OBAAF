# Patterns the pipeline checker uses to recognize agents, uploads, signing
# keys and instruction files. Agent products change quickly (spec risk
# "Agent products change faster than the controls"), so this list is data,
# reviewed and extended with each new class of flaw.
#
# A workflow can always state a job's lane explicitly with the environment
# variable OBAAF_LANE (untrusted, agent, effect, release or trusted). The
# declared lane is added to the lanes the patterns below put the job in; it
# never takes a job out of one.

version: 0.1.0

# Agent tools, one entry per tool (flagship slice 2d.5b, agent control R6). Agent products change faster
# than the controls, so what the checker knows about each one is data, read from the tool's own
# repository or documentation and dated. Every tool ci-agent-audit recognised at its commit 4a88ee6
# (2026-11-07) has an entry; that list was used to know which tools to look at. Each fact slice 2d.5b
# added was read from a source the entry names, not copied from that list; facts kept from OBAAF's
# lists before the slice that no named source shows are listed under `carried`. The checker reads,
# for each entry:
#
#   id            a short name, used in findings' facts (`agents`) and never changed once released
#   name          the tool's own name for itself
#   read          the date the sources were read
#   sources       where the entry's facts were read: the tool's action file, README or documentation
#   actions       actions that run the agent, matched as a prefix of the `uses:` value before the `@`
#                 (`owner/repo` also matches `owner/repo/path`); each with the inputs that carry a prompt
#   commands      Python regular expressions that find the agent run in a command line (`run:`, an
#                 action's input, a `docker://` step's arguments); options may come before the prompt flag
#   programs      the command-line programs the tool installs
#   prompt_flags  the options that carry a prompt to those programs
#   packages      the packages that install the tool, by registry (npm, pypi); an install without an exact
#                 version runs whatever was published last (OBAAF-GHA-025, OBAAF-JEN-008)
#   installs      of those packages, the ones a step before OBAAF's egress action may install, in the exact
#                 forms docs/checker-configuration.md gives, without being taken for running the agent
#                 (flagship slice 2c.8), with the program each installs
#   install_urls  install scripts, as regular expressions matched anywhere in a script line, however the
#                 script is fetched and run; each installs the version the script chooses
#   settings      the values of an agent action's inputs that the tool's own documentation warns about
#                 (flagship slice 2d.5c1, OBAAF-GHA-026), each with:
#                   id        a short name, unique in the entry; the finding's fact `setting` is `<tool>/<id>`
#                   action    one of the entry's actions (matched as they are, so a path under it too)
#                   input     the input's name, as the action reads it (A to Z in any case)
#                   equals    the values warned about, compared trimmed and in any case (the wider reading:
#                             the actions read some of them exactly); or
#                   set       true: any value that is not empty, a value warned about whatever it is
#                   severity  high, medium or low
#                   read      the date the words were read
#                   says      the documentation's own words, quoted exactly
#                   source    where those words are: a file at a commit, with its lines
#                 Where two settings of an entry name one input, the first that matches is reported. A
#                 value set by an expression is "cannot tell" (OBAAF-GHA-026, case `computed`). Settings
#                 given as command-line options (`claude_args`, `codex-args`, a CLI's own flags) are not
#                 read yet (slice 2d.5c2).
#   carried       facts kept from OBAAF's lists before slice 2d.5b that none of the sources shows (they
#                 were not dropped, so that nothing found before is lost; none is a new finding)
#
# The checker builds its lists from these entries when it loads them (obaaf/agent_tools.py):
# `agent_actions`, `agent_commands`, `agent_packages`, `agent_installs` and `agent_install_urls`, in the
# order the entries give them. A repository's own agents go in `agents.actions` and `agents.commands` of
# its checker configuration, and a job can always be declared an agent job.
agent_tools:
  - id: claude-code
    name: Claude Code
    read: 2026-11-18
    sources:
      - https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml
      - https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/base-action/action.yml
      - https://github.com/anthropics/claude-code-base-action/blob/78702a3c36b5baa51f6fa2e298a962cae8bb55d8/action.yml
      - https://github.com/anthropics/claude-code/blob/154c06539c4309e172b8ce6f2b07388987617d68/README.md
    actions:
      anthropics/claude-code-action: {prompt_inputs: [prompt]}
      anthropics/claude-code-base-action: {prompt_inputs: [prompt, prompt_file]}
    commands:
      - '(^|[\s;&|(/"''`])claude["''`]?\s+([^\n;&|]*\s)?(-p|--print)\b'
      - '@anthropic-ai/claude-code'
    programs: [claude]
    prompt_flags: [-p, --print]
    packages:
      npm: ["@anthropic-ai/claude-code"]
    installs: {"@anthropic-ai/claude-code": claude}
    install_urls:
      - 'claude\.ai/install\.(sh|ps1|cmd)\b'
    settings:
      - id: non-write-users-anyone
        action: anthropics/claude-code-action
        input: allowed_non_write_users
        equals: ["*"]
        severity: high
        read: 2026-11-19
        says: >-
          WARNING: Use with extreme caution - this bypasses security checks and should only be used for
          workflows with very limited permissions (e.g., issue labeling).
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml#L34-L45
      - id: non-write-users
        action: anthropics/claude-code-action
        input: allowed_non_write_users
        set: true
        severity: medium
        read: 2026-11-19
        says: >-
          WARNING: Use with extreme caution - this bypasses security checks and should only be used for
          workflows with very limited permissions (e.g., issue labeling).
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml#L34-L45
      - id: any-bot
        action: anthropics/claude-code-action
        input: allowed_bots
        equals: ["*"]
        severity: medium
        read: 2026-11-19
        says: >-
          WARNING: On public repos with '*', external Apps may be able to invoke this action with prompts
          they control.
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml#L30-L33
      - id: full-output
        action: anthropics/claude-code-action
        input: show_full_output
        equals: ["true"]
        severity: medium
        read: 2026-11-19
        says: >-
          WARNING: This outputs ALL Claude messages including tool execution results which may contain
          secrets, API keys, or other sensitive information. These logs are publicly visible in GitHub
          Actions.
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml#L164-L167
      - id: base-full-output
        action: anthropics/claude-code-base-action
        input: show_full_output
        equals: ["true"]
        severity: medium
        read: 2026-11-19
        says: >-
          WARNING: This outputs ALL Claude messages including tool execution results which may contain
          secrets, API keys, or other sensitive information. These logs are publicly visible in GitHub
          Actions.
        source: https://github.com/anthropics/claude-code-base-action/blob/78702a3c36b5baa51f6fa2e298a962cae8bb55d8/action.yml#L82-L85
    carried: ["claude -p and --print", "the install script claude.ai/install.cmd"]

