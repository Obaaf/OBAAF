  - id: cline
    name: Cline
    read: 2026-11-18
    sources:
      - https://github.com/cline/cline/blob/eff43e19b267e171f597ab03733bfed25090f72d/README.md
      - https://github.com/cline/cline/blob/eff43e19b267e171f597ab03733bfed25090f72d/apps/cli/README.md
      - https://github.com/cline/cline/blob/eff43e19b267e171f597ab03733bfed25090f72d/docs/features/auto-approve.mdx
      - https://github.com/cline/cline/blob/eff43e19b267e171f597ab03733bfed25090f72d/apps/cli/src/commands/program.ts
      - https://github.com/cline/cline/blob/eff43e19b267e171f597ab03733bfed25090f72d/apps/cli/src/utils/helpers.ts
    # The CLI's README gives `cline "<prompt>"` for a headless run, which the pattern below finds; the
    # action was in OBAAF's list before slice 2d.5b, and the repository had no action file when read.
    actions:
      cline/cline: {prompt_inputs: []}
    commands:
      - '(^|[\s;&|(])cline\s'
    programs: [cline]
    prompt_flags: []
    packages:
      npm: [cline]
    installs: {}
    install_urls: []
    settings: []
    # Command-line options (flagship slice 2d.5c2b), read where `cline` is run, from the CLI's own help text
    # (commander). `-z, --zen` runs "with full tool auto-approval (same semantics as `--yolo`)" (README,
    # line 331) and `--auto-approve true` sets the same override as `--yolo` (program.ts, lines 145 to 160),
    # so both are read with the sentence about `--yolo`, the wider reading (decision F-280). Before commander
    # reads them, apps/cli/src/utils/helpers.ts (lines 509 to 526) turns `--autoapprove` into `--auto-approve`
    # and puts `true` after one that is not followed by `true` or `false`, so it counts unless it is `false`. Not reported,
    # because no option says it: a one-shot run (`cline "prompt"`, or a prompt on standard input) is in yolo
    # mode by default unless it is given `--auto-approve false`, `--act` or `--plan` (README, lines 89 and
    # 338).
    flags:
      - id: yolo
        options: [--yolo, -y, --zen, -z]
        severity: high
        read: 2026-11-19
        says: >-
          Auto-approve a limited tool set for unsupervised runs (benchmarks, CI). DANGEROUS: use only in
          sandboxed environments.
        source: https://github.com/cline/cline/blob/eff43e19b267e171f597ab03733bfed25090f72d/apps/cli/src/commands/program.ts#L28-L31
      - id: auto-approve-true
        options: [--auto-approve, --autoapprove]
        unless: ["false"]
        severity: high
        read: 2026-11-19
        says: >-
          Auto-approve a limited tool set for unsupervised runs (benchmarks, CI). DANGEROUS: use only in
          sandboxed environments.
        source: https://github.com/cline/cline/blob/eff43e19b267e171f597ab03733bfed25090f72d/apps/cli/src/commands/program.ts#L28-L31
    carried: ["the action cline/cline"]

