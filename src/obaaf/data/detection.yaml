    carried: ["the action coderabbitai/ai-pr-reviewer"]

  - id: openhands
    name: OpenHands
    read: 2026-11-18
    sources:
      - https://github.com/OpenHands/extensions/blob/1902359eb285eb09bfb488e392831b86883dda3d/plugins/pr-review/action.yml
      - https://github.com/OpenHands/extensions/blob/1902359eb285eb09bfb488e392831b86883dda3d/plugins/qa-changes/action.yml
      - https://github.com/OpenHands/extensions/blob/1902359eb285eb09bfb488e392831b86883dda3d/plugins/release-notes/action.yml
      - https://github.com/OpenHands/extensions/blob/1902359eb285eb09bfb488e392831b86883dda3d/plugins/vulnerability-remediation/action.yml
      - https://github.com/OpenHands/extensions/blob/1902359eb285eb09bfb488e392831b86883dda3d/plugins/issue-duplicate-checker/action.yml
      - https://docs.openhands.dev/openhands/usage/cli/headless
      - https://github.com/OpenHands/docs/blob/e19cd0cd1b5a715abdf2ab94963a16226936d477/openhands/usage/cli/terminal.mdx
      - https://github.com/OpenHands/OpenHands-CLI/blob/283c6ac3610f4299f405f7389f65766dcb83e12a/openhands_cli/argparsers/util.py
      - https://github.com/OpenHands/docs/blob/e19cd0cd1b5a715abdf2ab94963a16226936d477/openhands/usage/cli/headless.mdx
    # All-Hands-AI/OpenHands was in OBAAF's list before slice 2d.5b; its default branch had no action
    # file when read, so it is kept for workflows pinned to an older commit.
    actions:
      All-Hands-AI/OpenHands: {prompt_inputs: []}
      OpenHands/extensions/plugins/pr-review: {prompt_inputs: []}
      OpenHands/extensions/plugins/qa-changes: {prompt_inputs: []}
      OpenHands/extensions/plugins/release-notes: {prompt_inputs: []}
      OpenHands/extensions/plugins/vulnerability-remediation: {prompt_inputs: []}
      OpenHands/extensions/plugins/issue-duplicate-checker: {prompt_inputs: []}
    commands:
      - '(^|[\s;&|(/"''`])openhands["''`]?\s+([^\n;&|]*\s)?--headless\b'
    programs: [openhands]
    prompt_flags: [-t, -f]
    packages: {}
    installs: {}
    install_urls: []
    # The pr-review action hands `enable-uv-cache` to astral-sh/setup-uv@v6 as `enable-cache`, whose
    # default, `auto`, turns the cache on on GitHub-hosted runners (setup-uv's README at d0cc045, line 207),
    # so `auto` is read as `true` (flagship slice 2d.5c2b).
    settings:
      - id: uv-cache
        action: OpenHands/extensions/plugins/pr-review
        input: enable-uv-cache
        equals: ["true", "auto"]
        severity: medium
        read: 2026-11-19
        says: >-
          Default is 'false' for security: shared caches can become a pivot into more privileged workflows
          (prompt-injected reviewer could write a malicious wheel into cache; subsequent higher-privilege
          workflow hits poisoned cache). Only opt in when you control the runner environment (e.g.
          self-hosted, single-tenant) and accept the trade-off.
        source: https://github.com/OpenHands/extensions/blob/1902359eb285eb09bfb488e392831b86883dda3d/plugins/pr-review/action.yml#L105-L113
    # Command-line options (flagship slice 2d.5c2b), read where `openhands` is run. `--yolo` is the same
    # option as `--always-approve` (OpenHands-CLI's openhands_cli/argparsers/util.py, lines 12 to 17), and
    # Python's argparse takes any beginning of either (`--always`, `--yol`). High: nothing in the sentence's
    # page puts the actions in a sandbox. `--headless`, the documented way to run it in CI, always approves
    # every action (headless.mdx, lines 27 to 29), so it is reported too.
    flags:
      - id: always-approve
        options: [--always-approve, --yolo]
        prefixes: true
        severity: high
        read: 2026-11-19
        says: "Auto-approve all actions (use with caution)"
        source: https://github.com/OpenHands/docs/blob/e19cd0cd1b5a715abdf2ab94963a16226936d477/openhands/usage/cli/terminal.mdx#L62
      - id: headless
        options: [--headless]
        prefixes: true
        severity: high
        read: 2026-11-19
        says: >-
          **Headless mode always runs in `always-approve` mode.** The agent will execute all actions without
          any confirmation.
        source: https://github.com/OpenHands/docs/blob/e19cd0cd1b5a715abdf2ab94963a16226936d477/openhands/usage/cli/headless.mdx#L28
    carried: ["the action All-Hands-AI/OpenHands"]

