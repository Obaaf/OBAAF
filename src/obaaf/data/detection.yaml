      - https://github.com/google-gemini/gemini-cli-action/blob/a2b9c0548a45588c2e82fa67fb15e6b050ced328/action.yml
      - https://github.com/google-gemini/gemini-cli/blob/3aa930d6e71c0ddea2610b20c12cdfab2ab9247d/README.md
    actions:
