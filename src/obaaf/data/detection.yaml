# Commits of OBAAF's egress action (actions/egress, slice 2c.2) that OBAAF lists as released: each
# one a commit the escape tests passed on, listed by a maintainer. OBAAF-GHA-020 credits the action
# only at one of these. None is listed yet, so the action is "cannot tell" at best.
#
# Only a commit at or after `egress_action_floor` may be listed. The floor was the merge of slice 2c.4
# (#128): the checker reads the action's `model-keys` and `env` inputs as the action reads them from
# there, and the text beside a cleared finding describes the action's own resolver, which exists from
# there (slice 2c.5, decision D-052). Since slice 2c.6 it is the last commit of that slice's change to
# the action: before it, a command in the sandbox could reach the runner's own programs through their
# sockets in /tmp, and a link it left in the copy reached a later step (decision D-054). Since slice
# 2c.10a it is slice 2c.9's last change to the action: before it, the job's env, GITHUB_ENV and
# GITHUB_PATH could make the action's own steps, which hold the step's env outside the sandbox, run
# or load other code (bash, BASH_ENV, LD_PRELOAD, a program first on the PATH), or succeed without
# running (LD_TRACE_LOADED_OBJECTS) (decision D-069). Since slice 2c.11b it is slice 2c.11a's change to
# the action: before it, an OPENSSL_ variable the job set (OPENSSL_CONF, or Ubuntu's FIPS pair beside
# OPENSSL_MODULES) made libcrypto load a module the job named into those steps' Python, where the key
# is held; from it, egress.py removes every OPENSSL_ variable before the import that initialises
# libcrypto, which the escape tests' openssl-modules job showed on a GitHub-hosted runner (run
# 43817685428; decision D-071), so the checker no longer counts those names (decision D-072). Since
# slice 2c.12b it is that slice's last change to the action: before it, those steps started in the locale
# and with the time-zone file the job named, and their one download used the proxy and the CA file
# the job named; from it, each step's env fixes LC_ALL and TZ and egress.py empties its environment
# before it imports anything but os, which the escape tests' own-steps-environment job showed on a
# GitHub-hosted runner (run 43986589031), so no further variable counts (decision D-075). A test
# refuses a listed commit that does not have the floor as an ancestor in this repository's history, or
# whose action's own steps differ from the floor's where the checker's verdicts rest on them. A later
# commit that reads its inputs another way must not be listed until the checker reads it that way too.
egress_action_floor: f3b50d418f421ea5dd17b277310fa11fe3541635
egress_action_releases: []
