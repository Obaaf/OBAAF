      - '@google/gemini-cli'
    programs: [gemini]
    prompt_flags: [-p, --prompt]
    packages:
      npm: ["@google/gemini-cli"]
    installs: {"@google/gemini-cli": gemini}
    install_urls: []
    settings: []

  - id: codex
    name: Codex
    read: 2026-11-18
    sources:
      - https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/action.yml
      - https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/docs/security.md
      - https://github.com/openai/codex/blob/333ea3194740c2e19edb215e7c8867170e013e13/README.md
    actions:
      openai/codex-action: {prompt_inputs: [prompt, prompt-file]}
    commands:
      - '(^|[\s;&|(/"''`])codex["''`]?\s+([^\n;&|]*\s)?exec\b'
      - '@openai/codex'
    programs: [codex]
    prompt_flags: []
    packages:
      npm: ["@openai/codex"]
    installs: {"@openai/codex": codex}
    install_urls:
      - 'chatgpt\.com/codex/install\.(sh|ps1)\b'
    settings:
      - id: safety-unsafe
        action: openai/codex-action
        input: safety-strategy
        equals: [unsafe]
        severity: high
        read: 2026-11-19
        says: >-
          `unsafe` (NOT RECOMMENDED) Do not try to restrict Codex's privileges at all. This is extremely
          dangerous, as the default user for this Action likely has sudo privileges, which means it can
          read secrets stored in memory (such as the value of `openai-api-key`) and print them to the output
          of the GitHub Action or exfiltrate them in other ways.
        source: https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/action.yml#L100-L104
      - id: safety-read-only
        action: openai/codex-action
        input: safety-strategy
        equals: [read-only]
        severity: medium
        read: 2026-11-19
        says: >-
          Note Codex will still run as the default user for this Action, which likely has sudo privileges,
          so it could read `openai-api-key` from memory and reveal it by printing it to the output of the
          GitHub Action.
        source: https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/action.yml#L95-L99
      - id: anyone
        action: openai/codex-action
        input: allow-users
        equals: ["*"]
        severity: high
        read: 2026-11-19
        says: >-
          If you have effectively opened up your use of `openai/codex-action` to the world by configuring
          `allow-users: "*"`, you might find yourself the target of API key abuse.
        source: https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/docs/security.md#L66

