  - id: copilot-cli
    name: GitHub Copilot CLI
    read: 2026-11-18
    sources:
      - https://github.com/github/copilot-cli/blob/020bbc0a39e97deaf58327cb880167f845461690/README.md
      - https://github.com/github/docs/blob/39c1e014c75e972ab1fe531a81bc5bd42b543b07/content/copilot/how-tos/copilot-cli/use-copilot-cli/allowing-tools.md
      - https://github.com/github/docs/blob/39c1e014c75e972ab1fe531a81bc5bd42b543b07/content/copilot/reference/copilot-cli-reference/cli-command-reference.md
      - https://github.com/github/docs/blob/39c1e014c75e972ab1fe531a81bc5bd42b543b07/content/copilot/reference/copilot-cli-reference/cli-programmatic-reference.md
    actions: {}
    commands:
      - '(^|[\s;&|(/"''`])copilot["''`]?\s+([^\n;&|]*\s)?(-p|--prompt)\b'
      - '@github/copilot(?![\w-])'
    programs: [copilot]
    prompt_flags: [-p, --prompt]
    packages:
      npm: ["@github/copilot"]
    installs: {"@github/copilot": copilot}
    install_urls:
      - 'gh\.io/copilot-install\b'
    settings: []
    shared_program: >-
      AWS's Copilot CLI for containers on Amazon ECS is also `copilot` (`copilot svc deploy`). A `copilot`
      command the checker cannot read is not "cannot tell" where every place the step names `copilot` is
      followed by one of AWS Copilot's own commands.
    # AWS Copilot's commands that GitHub Copilot CLI does not also have (`app`, `init`, `version` and
    # `completion` are both tools'; GitHub's are listed in cli-command-reference.md, lines 22 to 37).
    other_program: '\s+(env|svc|job|pipeline|task|storage|secret|deploy|run|docs)(?![\w-])'
    # Command-line options (flagship slice 2d.5c2b), read where `copilot` is run. The CLI's documentation is
    # GitHub's, in github/docs. "These options" are `--allow-all-tools`, `--allow-all` and `--yolo` (lines 98
    # and 100). Not read: `--allow-all-paths` and `--allow-all-urls` alone (no sentence of warning names
    # them), the variable `COPILOT_ALLOW_ALL`, and spellings such as
    # `--allowAllTools` or a beginning of an option: the CLI's parser is not in its public files.
    flags:
      - id: allow-all
        options: [--allow-all-tools, --allow-all, --yolo]
        severity: high
        read: 2026-11-19
        says: It is strongly recommended that you only use these options in an isolated environment.
        source: https://github.com/github/docs/blob/39c1e014c75e972ab1fe531a81bc5bd42b543b07/content/copilot/how-tos/copilot-cli/use-copilot-cli/allowing-tools.md#L104-L105
      - id: show-secrets
        options: [--show-secrets]
        severity: medium
        read: 2026-11-19
        says: >-
          `--show-secrets` can print sensitive environment variable and header values to your terminal or
          logs. Only use this option in trusted environments, and avoid copying, pasting, or otherwise
          capturing the output in shared logs or history.
        source: https://github.com/github/docs/blob/39c1e014c75e972ab1fe531a81bc5bd42b543b07/content/copilot/reference/copilot-cli-reference/cli-command-reference.md#L1083-L1084
      - id: trust-folder
        options: [--trust-folder]
        severity: medium
        read: 2026-11-19
        says: Only use this for configuration you have reviewed.
        source: https://github.com/github/docs/blob/39c1e014c75e972ab1fe531a81bc5bd42b543b07/content/copilot/reference/copilot-cli-reference/cli-programmatic-reference.md#L53
      - id: share-gist
        options: [--share-gist]
        severity: medium
        read: 2026-11-19
        says: >-
          Publish the session transcript as a secret GitHub gist after completion. Convenient for sharing
          results from CI. Note that session transcripts may contain sensitive information.
        source: https://github.com/github/docs/blob/39c1e014c75e972ab1fe531a81bc5bd42b543b07/content/copilot/reference/copilot-cli-reference/cli-programmatic-reference.md#L55
      - id: share
        options: [--share]
        severity: medium
        read: 2026-11-19
        says: >-
          Export the session transcript to a markdown file after non-interactive completion (defaults to
          `./copilot-session-<ID>.md`). Useful for auditing or archiving what the agent did. Note that session
          transcripts may contain sensitive information.
        source: https://github.com/github/docs/blob/39c1e014c75e972ab1fe531a81bc5bd42b543b07/content/copilot/reference/copilot-cli-reference/cli-programmatic-reference.md#L54
    carried: ["copilot -p and --prompt"]

