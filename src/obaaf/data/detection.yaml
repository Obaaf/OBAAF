# Commits of OBAAF's egress action (actions/egress, slice 2c.2) that OBAAF lists as released: each
# one a commit the escape tests passed on, listed by a maintainer. OBAAF-GHA-020 credits the action
# only at one of these. None is listed yet, so the action is "cannot tell" at best.
#
# Only a commit at or after `egress_action_floor` may be listed. The floor was the merge of slice 2c.4
# (#128): the checker reads the action's `model-keys` and `env` inputs as the action reads them from
# there, and the text beside a cleared finding describes the action's own resolver, which exists from
# there (slice 2c.5, decision D-052). Since slice 2c.6 it is the last commit of that slice's change to
# the action: before it, a command in the sandbox could reach the runner's own programs through their
# sockets in /tmp, and a link it left in the copy reached a later step (decision D-054). A test refuses
# a listed commit that does not have the floor as an ancestor in this repository's history. A later
# commit that reads its inputs another way must not be listed until the checker reads it that way too.
egress_action_floor: 7c1bded84f32a86135f89dde30396a32f44de9e0
egress_action_releases: []
