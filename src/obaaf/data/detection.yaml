# Patterns the pipeline checker uses to recognize agents, uploads, signing
# keys and instruction files. Agent products change quickly (spec risk
# "Agent products change faster than the controls"), so this list is data,
# reviewed and extended with each new class of flaw.
#
# A workflow can always state a job's lane explicitly with the environment
# variable OBAAF_LANE (untrusted, agent, effect, release or trusted). The
# declared lane is added to the lanes the patterns below put the job in; it
# never takes a job out of one.

version: 0.1.0

# Agent tools, one entry per tool (flagship slice 2d.5b, agent control R6). Agent products change faster
# than the controls, so what the checker knows about each one is data, read from the tool's own
# repository or documentation and dated. Every tool ci-agent-audit recognised at its commit 4a88ee6
# (2026-11-07) has an entry; that list was used to know which tools to look at. Each fact slice 2d.5b
# added was read from a source the entry names, not copied from that list; facts kept from OBAAF's
# lists before the slice that no named source shows are listed under `carried`. The checker reads,
# for each entry:
#
#   id            a short name, used in findings' facts (`agents`) and never changed once released
#   name          the tool's own name for itself
#   read          the date the sources were read
#   sources       where the entry's facts were read: the tool's action file, README or documentation
#   actions       actions that run the agent, matched as a prefix of the `uses:` value before the `@`
#                 (`owner/repo` also matches `owner/repo/path`, and a called workflow
#                 `owner/repo/.github/workflows/x.yml`, but not `owner/repo-docs`); each with the inputs
#                 that carry a prompt
#   not_agents    actions in a folder under one of those that run no agent (flagship slice 2d.11), each
#                 with `action` (owner/repo/path; the folder exactly as written, owner and repository in
#                 any case), `says` (the action's own words for what it does), `source` (where they are:
#                 a file at a commit in that repository, with its lines), `checked` (what was read to know
#                 it runs no agent) and `read` (the date). Any other path under an action is the agent.
#   commands      Python regular expressions that find the agent run in a command line (`run:`, an
#                 action's input, a `docker://` step's arguments); options may come before the prompt flag
#   programs      the command-line programs the tool installs
#   prompt_flags  the options that carry a prompt to those programs
#   packages      the packages that install the tool, by registry (npm, pypi); an install without an exact
#                 version runs whatever was published last (OBAAF-GHA-025, OBAAF-JEN-008)
#   installs      of those packages, the ones a step before OBAAF's egress action may install, in the exact
#                 forms docs/checker-configuration.md gives, without being taken for running the agent
#                 (flagship slice 2c.8), with the program each installs
#   install_urls  install scripts, as regular expressions matched anywhere in a script line, however the
#                 script is fetched and run; each installs the version the script chooses
#   settings      the values of an agent action's inputs that the tool's own documentation warns about
#                 (flagship slice 2d.5c1, OBAAF-GHA-026), each with:
#                   id        a short name, unique in the entry; the finding's fact `setting` is `<tool>/<id>`
#                   action    one of the entry's actions (matched as they are, so a path under it too)
#                   input     the input's name, as the action reads it (A to Z in any case)
#                   equals    the values warned about, compared trimmed and in any case (the wider reading:
#                             the actions read some of them exactly); or
#                   set       true: any value that is not empty, a value warned about whatever it is
#                   severity  high, medium or low
#                   read      the date the words were read
#                   says      the documentation's own words, quoted exactly
#                   source    where those words are: a file at a commit, with its lines
#                 Where two settings of an entry name one input, the first that matches is reported. A
#                 value set by an expression is "cannot tell" (OBAAF-GHA-026, case `computed`). Settings
#                 given as command-line options (`claude_args`, `codex-args`, a CLI's own flags) are not
#                 read yet (slice 2d.5c2).
#   carried       facts kept from OBAAF's lists before slice 2d.5b that none of the sources shows (they
#                 were not dropped, so that nothing found before is lost; none is a new finding)
#
# The checker builds its lists from these entries when it loads them (obaaf/agent_tools.py):
# `agent_actions`, `agent_commands`, `agent_packages`, `agent_installs` and `agent_install_urls`, in the
# order the entries give them. A repository's own agents go in `agents.actions` and `agents.commands` of
# its checker configuration, and a job can always be declared an agent job.
agent_tools:
  - id: claude-code
    name: Claude Code
    read: 2026-11-18
    sources:
      - https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml
      - https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/base-action/action.yml
      - https://github.com/anthropics/claude-code-base-action/blob/78702a3c36b5baa51f6fa2e298a962cae8bb55d8/action.yml
      - https://github.com/anthropics/claude-code/blob/154c06539c4309e172b8ce6f2b07388987617d68/README.md
      - https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/src/github/validation/untrusted-pr.ts
      - https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/docs/security.md
    actions:
      anthropics/claude-code-action: {prompt_inputs: [prompt], args_inputs: [claude_args]}
      anthropics/claude-code-base-action: {prompt_inputs: [prompt, prompt_file], args_inputs: [claude_args]}
    commands:
      - '(^|[\s;&|(/"''`])claude["''`]?\s+([^\n;&|]*\s)?(-p|--print)\b'
      - '@anthropic-ai/claude-code'
    programs: [claude]
    prompt_flags: [-p, --print]
    packages:
      npm: ["@anthropic-ai/claude-code"]
    installs: {"@anthropic-ai/claude-code": claude}
    install_urls:
      - 'claude\.ai/install\.(sh|ps1|cmd)\b'
    settings:
      - id: non-write-users-anyone
        action: anthropics/claude-code-action
        input: allowed_non_write_users
        equals: ["*"]
        severity: high
        read: 2026-11-19
        says: >-
          WARNING: Use with extreme caution - this bypasses security checks and should only be used for
          workflows with very limited permissions (e.g., issue labeling).
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml#L34-L45
      - id: non-write-users
        action: anthropics/claude-code-action
        input: allowed_non_write_users
        set: true
        severity: medium
        read: 2026-11-19
        says: >-
          WARNING: Use with extreme caution - this bypasses security checks and should only be used for
          workflows with very limited permissions (e.g., issue labeling).
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml#L34-L45
      - id: any-bot
        action: anthropics/claude-code-action
        input: allowed_bots
        equals: ["*"]
        severity: medium
        read: 2026-11-19
        says: >-
          WARNING: On public repos with '*', external Apps may be able to invoke this action with prompts
          they control.
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml#L30-L33
      - id: full-output
        action: anthropics/claude-code-action
        input: show_full_output
        equals: ["true"]
        severity: medium
        read: 2026-11-19
        says: >-
          WARNING: This outputs ALL Claude messages including tool execution results which may contain
          secrets, API keys, or other sensitive information. These logs are publicly visible in GitHub
          Actions.
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/action.yml#L164-L167
      - id: base-full-output
        action: anthropics/claude-code-base-action
        input: show_full_output
        equals: ["true"]
        severity: medium
        read: 2026-11-19
        says: >-
          WARNING: This outputs ALL Claude messages including tool execution results which may contain
          secrets, API keys, or other sensitive information. These logs are publicly visible in GitHub
          Actions.
        source: https://github.com/anthropics/claude-code-base-action/blob/78702a3c36b5baa51f6fa2e298a962cae8bb55d8/action.yml#L82-L85
    # Command-line options (flagship slice 2d.5c2a), read where `claude` is run and in `claude_args`. The
    # action's own test for "turns off permission checks" is SKIPS_PERMISSION_CHECKS, lines 80 and 81 of the
    # same file: `--(allow-)?dangerously-skip-permissions` or `--permission-mode bypassPermissions`.
    flags:
      - id: skip-permissions
        options: [--dangerously-skip-permissions, --allow-dangerously-skip-permissions]
        severity: high
        read: 2026-11-19
        says: >-
          claude_args turns off permission checks, so commands that are not on the deny list run without
          approval.
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/src/github/validation/untrusted-pr.ts#L214-L218
      - id: bypass-permissions-mode
        options: [--permission-mode]
        equals: [bypassPermissions]
        severity: high
        read: 2026-11-19
        says: >-
          If `claude_args` turns off permission checks, for example with `bypassPermissions`, commands outside
          the list run without approval, and the action logs a warning.
        source: https://github.com/anthropics/claude-code-action/blob/5a856893345e332afa621934082d8c660c26d689/docs/security.md#L102
    not_agents:
      - action: anthropics/claude-code-action/agent-approval-check
        read: 2026-11-19
        says: >-
          Require N human approvals on PRs that contain agent-authored commits (Claude, Claude Code, or any
          configured bot identity). Posts an `agent-approval-check` commit status — mark it as a required
          check on protected branches to gate merges.
        checked: >-
          Its composite steps (lines 49 to 72) set up Python, install httpx, PyYAML and tenacity at exact
          versions and run its own agent_approval_check.py, which imports no model's library, starts no
          other program and sends its requests only to api.github.com.
        source: https://github.com/anthropics/claude-code-action/blob/f431adaf77e0fecf918431e75a2b5b45b85af002/agent-approval-check/action.yml#L1-L6
    carried: ["claude -p and --print", "the install script claude.ai/install.cmd"]

  - id: gemini-cli
    name: Gemini CLI
    read: 2026-11-18
    sources:
      - https://github.com/google-github-actions/run-gemini-cli/blob/387c8ddb7a72078825da941758b811b9153c71e8/action.yml
      - https://github.com/google-gemini/gemini-cli-action/blob/a2b9c0548a45588c2e82fa67fb15e6b050ced328/action.yml
      - https://github.com/google-gemini/gemini-cli/blob/3aa930d6e71c0ddea2610b20c12cdfab2ab9247d/README.md
      - https://github.com/google-gemini/gemini-cli/blob/3aa930d6e71c0ddea2610b20c12cdfab2ab9247d/docs/reference/policy-engine.md
    actions:
      google-github-actions/run-gemini-cli: {prompt_inputs: [prompt]}
      google-gemini/gemini-cli-action: {prompt_inputs: [prompt]}
    commands:
      - '(^|[\s;&|(/"''`])gemini["''`]?\s+([^\n;&|]*\s)?(-p|--prompt)\b'
      - '@google/gemini-cli'
    programs: [gemini]
    prompt_flags: [-p, --prompt]
    packages:
      npm: ["@google/gemini-cli"]
    installs: {"@google/gemini-cli": gemini}
    install_urls: []
    # Both actions run `gemini --yolo` themselves, whatever their inputs say (run-gemini-cli's action.yml,
    # lines 309 and 316; gemini-cli-action's, line 85), so no input turns it on or off and none is reported
    # for it (flagship slice 2d.5c2b). The action passes `gemini_debug` through `fromJSON` (line 417) and
    # compares the result with `true` (line 306), so the JSON string `"true"` turns debugging on too.
    settings:
      - id: debug
        action: google-github-actions/run-gemini-cli
        input: gemini_debug
        equals: ["true"]
        json: true
        severity: medium
        read: 2026-11-19
        says: >-
          Gemini CLI debug logging is enabled. This will stream responses, which could reveal sensitive
          information if processed with untrusted inputs.
        source: https://github.com/google-github-actions/run-gemini-cli/blob/387c8ddb7a72078825da941758b811b9153c71e8/action.yml#L307
    # Command-line options (flagship slice 2d.5c2a), read where `gemini` is run. The same documentation says
    # the sandbox is turned on by default with `--yolo` (docs/reference/configuration.md, line 3095), which is
    # why these are medium. Gemini CLI reads its options with yargs, which also takes `--y` for `-y` and the
    # camel-case `--approvalMode`.
    flags:
      - id: yolo
        options: [--yolo, -y, --y]
        severity: medium
        read: 2026-11-19
        says: "`yolo`: A mode where all tools are auto-approved (use with extreme caution)."
        source: https://github.com/google-gemini/gemini-cli/blob/3aa930d6e71c0ddea2610b20c12cdfab2ab9247d/docs/reference/policy-engine.md#L212
      - id: approval-mode-yolo
        options: [--approval-mode, --approvalMode]
        equals: [yolo]
        severity: medium
        read: 2026-11-19
        says: "`yolo`: A mode where all tools are auto-approved (use with extreme caution)."
        source: https://github.com/google-gemini/gemini-cli/blob/3aa930d6e71c0ddea2610b20c12cdfab2ab9247d/docs/reference/policy-engine.md#L212

  - id: codex
    name: Codex
    read: 2026-11-18
    sources:
      - https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/action.yml
      - https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/docs/security.md
      - https://github.com/openai/codex/blob/333ea3194740c2e19edb215e7c8867170e013e13/README.md
      - https://github.com/openai/codex/blob/333ea3194740c2e19edb215e7c8867170e013e13/codex-rs/utils/cli/src/shared_options.rs
    actions:
      openai/codex-action: {prompt_inputs: [prompt, prompt-file], args_inputs: [codex-args]}
    commands:
      - '(^|[\s;&|(/"''`])codex["''`]?\s+([^\n;&|]*\s)?exec\b'
      - '@openai/codex'
    programs: [codex]
    prompt_flags: []
    packages:
      npm: ["@openai/codex"]
    installs: {"@openai/codex": codex}
    install_urls:
      - 'chatgpt\.com/codex/install\.(sh|ps1)\b'
    settings:
      - id: safety-unsafe
        action: openai/codex-action
        input: safety-strategy
        equals: [unsafe]
        severity: high
        read: 2026-11-19
        says: >-
          `unsafe` (NOT RECOMMENDED) Do not try to restrict Codex's privileges at all. This is extremely
          dangerous, as the default user for this Action likely has sudo privileges, which means it can
          read secrets stored in memory (such as the value of `openai-api-key`) and print them to the output
          of the GitHub Action or exfiltrate them in other ways.
        source: https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/action.yml#L100-L104
      - id: safety-read-only
        action: openai/codex-action
        input: safety-strategy
        equals: [read-only]
        severity: medium
        read: 2026-11-19
        says: >-
          Note Codex will still run as the default user for this Action, which likely has sudo privileges,
          so it could read `openai-api-key` from memory and reveal it by printing it to the output of the
          GitHub Action.
        source: https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/action.yml#L95-L99
      - id: anyone
        action: openai/codex-action
        input: allow-users
        equals: ["*"]
        severity: high
        read: 2026-11-19
        says: >-
          If you have effectively opened up your use of `openai/codex-action` to the world by configuring
          `allow-users: "*"`, you might find yourself the target of API key abuse.
        source: https://github.com/openai/codex-action/blob/4aac6da4b686168e147798ca841cf64ff0f027b8/docs/security.md#L66
    # Command-line options (flagship slice 2d.5c2a), read where `codex` is run and in `codex-args`, from the
    # CLI's own help text. `--sandbox danger-full-access` is not here: neither the CLI's files nor the
    # action's give a sentence of warning for it (as for the action's `sandbox` input, F-267).
    flags:
      - id: bypass-approvals-and-sandbox
        options: [--dangerously-bypass-approvals-and-sandbox, --yolo]
        severity: high
        read: 2026-11-19
        says: >-
          Skip all confirmation prompts and execute commands without sandboxing. EXTREMELY DANGEROUS. Intended
          solely for running in environments that are externally sandboxed.
        source: https://github.com/openai/codex/blob/333ea3194740c2e19edb215e7c8867170e013e13/codex-rs/utils/cli/src/shared_options.rs#L52-L59
      - id: bypass-hook-trust
        options: [--dangerously-bypass-hook-trust]
        severity: medium
        read: 2026-11-19
        says: >-
          Run enabled hooks without requiring persisted hook trust for this invocation. DANGEROUS. Intended only
          for automation that already vets hook sources.
        source: https://github.com/openai/codex/blob/333ea3194740c2e19edb215e7c8867170e013e13/codex-rs/utils/cli/src/shared_options.rs#L61-L64

  - id: github-models
    name: GitHub Models AI Inference
    read: 2026-11-18
    sources:
      - https://github.com/actions/ai-inference/blob/41caef41a74eb26f6d0c6b1e9941d691588e0b2b/action.yml
    actions:
      actions/ai-inference: {prompt_inputs: [prompt, prompt-file, system-prompt, system-prompt-file, input, file_input]}
    commands: []
    programs: []
    prompt_flags: []
    packages: {}
    installs: {}
    install_urls: []
    settings: []
    no_warnings: >-
      Read on 2026-11-19: actions/ai-inference's action.yml, README.md, SECURITY.md and src/copilot.ts at
      41caef4. None of them warns about an input's value. The action runs GitHub Copilot CLI itself with
      `-p`, `-s`, `--no-ask-user`, `--model` and `--allow-tool=` built from its inputs (src/copilot.ts,
      lines 93 to 102); those inputs are not read as Copilot's options.

  - id: pr-agent
    name: PR-Agent
    read: 2026-11-18
    sources:
      - https://github.com/qodo-ai/pr-agent/blob/c601521779a2b34d559291faa7fe16f8c6c96d34/action.yaml
      - https://github.com/qodo-ai/pr-agent/blob/c601521779a2b34d559291faa7fe16f8c6c96d34/README.md
      - https://github.com/qodo-ai/pr-agent/blob/c601521779a2b34d559291faa7fe16f8c6c96d34/docs/docs/usage-guide/configuration_options.md
    # The-PR-Agent/pr-agent and qodo-ai/pr-agent served the same repository (the same commit) when read.
    actions:
      qodo-ai/pr-agent: {prompt_inputs: [artifact_instructions]}
      Codium-ai/pr-agent: {prompt_inputs: [artifact_instructions]}
      The-PR-Agent/pr-agent: {prompt_inputs: [artifact_instructions]}
    commands:
      - '(^|[\s;&|(/"''`])pr-agent["''`]?\s+([^\n;&|]*\s)?--(pr_url|issue_url)\b'
    programs: [pr-agent]
    prompt_flags: []
    packages:
      pypi: [pr-agent]
    installs: {}
    install_urls: []
    settings: []
    # Command-line options (flagship slice 2d.5c2b), read where `pr-agent` is run. The warning is about a
    # `--config-branch` taken from a pull request: `$GITHUB_HEAD_REF`, the spelling it names that a script
    # holds as text, is its `equals`; a value the checker cannot read (another variable, an expression such
    # as the `${{ github.head_ref }}` it also names) is "cannot tell", and a branch written out
    # (`--config-branch=main`) is not reported. `PR_AGENT_CONFIG_BRANCH`, a variable, is not read. Its other
    # warning, about running the action on `pull_request_target` (docs/docs/installation/github.md, line
    # 106), is about an event, which the event rules read.
    flags:
      - id: config-branch
        options: [--config-branch]
        equals: ["$GITHUB_HEAD_REF"]
        severity: high
        read: 2026-11-19
        says: >-
          **Never set the config branch from untrusted or PR-derived input** (e.g.
          `--config-branch=$GITHUB_HEAD_REF` / `${{ github.head_ref }}` in CI).
        source: https://github.com/qodo-ai/pr-agent/blob/c601521779a2b34d559291faa7fe16f8c6c96d34/docs/docs/usage-guide/configuration_options.md#L70
    carried: ["the action Codium-ai/pr-agent"]

  - id: coderabbit
    name: CodeRabbit AI PR Reviewer
    read: 2026-11-18
    # In OBAAF's list before slice 2d.5b. Its repository could not be read on 2026-11-18 (git asked
    # for a sign-in, as it does for a repository that is private or gone), so nothing was added.
    sources: []
    actions:
      coderabbitai/ai-pr-reviewer: {prompt_inputs: []}
    commands: []
    programs: []
    prompt_flags: []
    packages: {}
    installs: {}
    install_urls: []
    settings: []
    no_warnings: >-
      coderabbitai/ai-pr-reviewer could not be read on 2026-11-19: GitHub refused an anonymous read of the
