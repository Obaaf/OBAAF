      - https://github.com/QwenLM/qwen-code-action/blob/05f81718976f3b7da657422e6e8e4d372b8621d7/action.yml
      - https://github.com/QwenLM/qwen-code/blob/d9ac287c9fd5fe46382aa28d6222f0c7d058f51f/README.md
      - https://github.com/QwenLM/qwen-code/blob/d9ac287c9fd5fe46382aa28d6222f0c7d058f51f/docs/users/features/headless.md
      - https://github.com/QwenLM/qwen-code/blob/d9ac287c9fd5fe46382aa28d6222f0c7d058f51f/packages/cli/src/config/top-level-options.ts
    actions:
      QwenLM/qwen-code-action: {prompt_inputs: [prompt]}
    commands:
      - '(^|[\s;&|(/"''`])qwen["''`]?\s+([^\n;&|]*\s)?(-p|--prompt)\b'
      - '@qwen-code/qwen-code(?![\w-])'
    programs: [qwen]
    prompt_flags: [-p, --prompt]
    packages:
      npm: ["@qwen-code/qwen-code"]
    installs: {"@qwen-code/qwen-code": qwen}
    install_urls:
      - 'qwen-code-assets\.oss-cn-hangzhou\.aliyuncs\.com/installation/install-qwen-standalone\.(sh|ps1)\b'
    # The action runs `qwen --yolo` itself, whatever its inputs say (action.yml, line 232), so no input turns
    # it on or off and none is reported for it (flagship slice 2d.5c2b). It passes `qwen_debug` through
    # `fromJSON` (line 315), so the JSON string `"true"` turns debugging on too.
    settings:
      - id: debug
        action: QwenLM/qwen-code-action
        input: qwen_debug
        equals: ["true"]
        json: true
        severity: medium
        read: 2026-11-19
        says: >-
          Qwen Code debug logging is enabled. This will stream responses, which could reveal sensitive
          information if processed with untrusted inputs.
        source: https://github.com/QwenLM/qwen-code-action/blob/05f81718976f3b7da657422e6e8e4d372b8621d7/action.yml#L228
    # Command-line options (flagship slice 2d.5c2b), read where `qwen` is run. High: the same sentence says
    # `--yolo` turns on no sandbox, so every tool runs at the runner's privilege (Gemini CLI's is medium
    # because its sandbox comes on with it). Qwen Code reads its options with yargs (`-y` is `--yolo`'s
    # alias in packages/cli/src/config/top-level-options.ts, lines 250 to 256), which also takes `--y` and
    # the camel-case `--approvalMode`. Its other approval modes are not here: `auto` is the CLI's default
    # (packages/cli/src/config/config.ts, line 2009) and `auto-edit` allows less than it.
    flags:
      - id: yolo
        options: [--yolo, -y, --y]
        severity: high
        read: 2026-11-19
        says: >-
          Headless / CI runs combined with `--yolo` (or `--approval-mode=yolo`) auto-approve every tool call,
          including `shell`, `write`, and `edit`. **`--yolo` does not enable a sandbox** — those tools run at
          the host process's privilege level.
        source: https://github.com/QwenLM/qwen-code/blob/d9ac287c9fd5fe46382aa28d6222f0c7d058f51f/docs/users/features/headless.md#L338
      - id: insecure
        options: [--insecure]
        severity: medium
        read: 2026-11-19
        says: "WARNING: removes protection against man-in-the-middle attacks."
        source: https://github.com/QwenLM/qwen-code/blob/d9ac287c9fd5fe46382aa28d6222f0c7d058f51f/packages/cli/src/config/top-level-options.ts#L145-L150
      - id: approval-mode-yolo
        options: [--approval-mode, --approvalMode]
        equals: [yolo]
        severity: high
        read: 2026-11-19
        says: >-
          Headless / CI runs combined with `--yolo` (or `--approval-mode=yolo`) auto-approve every tool call,
          including `shell`, `write`, and `edit`. **`--yolo` does not enable a sandbox** — those tools run at
          the host process's privilege level.
        source: https://github.com/QwenLM/qwen-code/blob/d9ac287c9fd5fe46382aa28d6222f0c7d058f51f/docs/users/features/headless.md#L338

  - id: swe-agent
    name: SWE-agent
    read: 2026-11-18
    sources:
