# Patterns the pipeline checker uses to recognize agents, uploads, signing
# keys and instruction files. Agent products change quickly (spec risk
# "Agent products change faster than the controls"), so this list is data,
# reviewed and extended with each new class of flaw.
#
# A workflow can always state a job's lane explicitly with the environment
# variable OBAAF_LANE (untrusted, agent, effect, release or trusted). The
# declared lane is added to the lanes the patterns below put the job in; it
# never takes a job out of one.

version: 0.1.0

# Actions that run an AI agent or model with tools. Matched as a prefix of the
# `uses:` value, before the `@`.
agent_actions:
  - anthropics/claude-code-action
  - anthropics/claude-code-base-action
  - google-github-actions/run-gemini-cli
  - openai/codex-action
  - actions/ai-inference
  - qodo-ai/pr-agent
  - Codium-ai/pr-agent
  - coderabbitai/ai-pr-reviewer
  - All-Hands-AI/OpenHands
  - sst/opencode
  - cline/cline

# Commands in `run:` scripts that start an agent CLI. Python regular
# expressions, matched against each line. Options may come before the
# prompt flag or subcommand (claude --model x -p ...).
agent_commands:
  - '(^|[\s;&|(])claude\s+([^\n;&|]*\s)?(-p|--print)\b'
  - '@anthropic-ai/claude-code'
  - '(^|[\s;&|(])gemini\s+([^\n;&|]*\s)?(-p|--prompt)\b'
  - '@google/gemini-cli'
  - '(^|[\s;&|(])codex\s+([^\n;&|]*\s)?exec\b'
  - '@openai/codex'
  - '(^|[\s;&|(])aider\s'
  - '(^|[\s;&|(])opencode\s+([^\n;&|]*\s)?run\b'
  - '(^|[\s;&|(])copilot\s+([^\n;&|]*\s)?(-p|--prompt)\b'
  - '(^|[\s;&|(])cline\s'

# Packages that install an agent's CLI, with the command each installs (flagship slice 2c.8). The
# patterns above match their names, so a step that installs one is taken for running an agent. Before
# OBAAF's egress action, a step whose script does nothing but install these packages globally (and
# print the CLI's version) is not taken for running the agent outside the confined command; one that
# names them in any other way is "cannot tell", unless it also runs an agent. The exact forms are in
# docs/checker-configuration.md. (`agent_packages`, below, is the Jenkins analyser's list.)
agent_installs:
  "@anthropic-ai/claude-code": claude
  "@openai/codex": codex
  "@google/gemini-cli": gemini

# Files that steer agents (R5). Glob patterns relative to the repository
# root; `**` matches any number of directories.
instruction_files:
  - AGENTS.md
  - "**/AGENTS.md"
  - AGENT.md
  - "**/AGENT.md"
  - opencode.json
  - opencode.jsonc
  - CLAUDE.md
  - "**/CLAUDE.md"
  - CLAUDE.local.md
  - GEMINI.md
  - "**/GEMINI.md"
  - .github/copilot-instructions.md
  - ".github/instructions/**"
  - ".github/prompts/**"
  - ".github/chatmodes/**"
  - ".github/agents/**"
  - .cursorrules
  - ".cursor/rules/**"
  - .windsurfrules
  - ".windsurf/rules/**"
  - .clinerules
  - ".clinerules/**"
  - ".claude/**"
  - ".gemini/**"
  - ".codex/**"
  - .mcp.json
  - .vscode/mcp.json
  - ".continue/**"
  - .aider.conf.yml

# Steps that upload or publish release artifacts (G7.2, FR6).
upload_actions:
  - r0adkll/upload-google-play
  - softprops/action-gh-release
  - ncipollo/release-action
  - google-github-actions/upload-cloud-storage
  - game-ci/steam-deploy
  - manleydev/butler-publish-itchio-action
  - yeslayla/butler-publish-itchio-action
  - Apple-Actions/upload-testflight-build
upload_commands:
  - '(^|[\s;&|(])steamcmd\b.*\+run_app_build'
  - '(^|[\s;&|(])butler\s+push\b'
  - '(^|[\s;&|(])gh\s+release\s+(upload|create)\b'
  - '(^|[\s;&|(])aws\s+s3\s+(cp|sync|mv)\b'
  - '(^|[\s;&|(])gsutil\s+(-m\s+)?(cp|rsync)\b'
  - '(^|[\s;&|(])gcloud\s+storage\s+cp\b'
  - '(^|[\s;&|(])az\s+storage\s+blob\s+upload'
  - '(^|[\s;&|(])fastlane\s+\S*(deliver|upload_to_app_store|upload_to_testflight|pilot|supply|upload_to_play_store)'
  - '(^|[\s;&|(])xcrun\s+altool\b.*--upload'
  - '(^|[\s;&|(])(npm|pnpm|yarn)\s+publish\b'
  - '(^|[\s;&|(])twine\s+upload\b'
  - '(^|[\s;&|(])cargo\s+publish\b'
  - '(^|[\s;&|(])dotnet\s+nuget\s+push\b'
  - '(^|[\s;&|(])docker\s+push\b'
  - '(^|[\s;&|(]|\./)scripts?/publish'

# Jenkins only (advisory): Pipeline steps and commands that publish outside Jenkins. The
# commands extend upload_commands for Jenkinsfiles; they are kept separate so adding them
# does not move GitHub Actions jobs into the release lane without review. Generic file
# transfer (scp, rsync, sshPublisher, ftpPublisher) is not counted, because it mostly copies
# reports and logs; declare a stage that releases that way with OBAAF_LANE = 'release'.
jenkins_upload_steps:
  - s3Upload
  - nexusArtifactUploader
  - nexusPublisher
  - googleStorageUpload
  - rtUpload
  - rtPublishBuildInfo
  - rtDockerPush
  - azureUpload
  - androidApkUpload
  - appCenter
  - createGitHubRelease
# Jenkins Pipeline steps that run an AI agent (the AI Agent plugin's aiAgent step). Steps of a
# shared library that wrap an agent go in agents.steps in the checker configuration.
jenkins_agent_steps:
  - aiAgent
jenkins_upload_commands:
  - '(^|[\s;&|(])(\./)?(mvn|mvnw)\b[^\n;&|]*\s(deploy|release:perform)\b'
  - '(^|[\s;&|(])(\./)?(gradle|gradlew)\b[^\n;&|]*\s(publish\w*|uploadArchives)\b'
  - '(^|[\s;&|(])(jf|jfrog)\s+rt\s+(u|upload|dp|docker-push|bp|build-publish)\b'
  - '(^|[\s;&|(])helm\s+push\b'
  - '(^|[\s;&|(])(crane|skopeo)\s+(push|copy)\b'
  - '(^|[\s;&|(])curl\b[^\n;&|]*\s(-T|--upload-file)\s'
  - '(^|[\s;&|(])az\s+artifacts\s+universal\s+publish\b'

# Agent CLIs installed from a package registry (R6). An install without a version, or with
# a moving tag such as @latest, runs whatever was published last. npm and PyPI names.
agent_packages:
  - "@anthropic-ai/claude-code"
  - "@google/gemini-cli"
  - "@openai/codex"
  - "@github/copilot"
  - opencode-ai
  - aider-chat
  - aider-install
  - "@qodo/command"

# Steps that sign provenance or other attestations (G7.1, FR5).
provenance_actions:
  - actions/attest-build-provenance
  - actions/attest
  - slsa-framework/slsa-github-generator
provenance_commands:
  - '(^|[\s;&|(])obaaf\s+attest\s+build-record\b'
  - '(^|[\s;&|(])cosign\s+attest(-blob)?\b'

# Steps that verify provenance before an upload (G7.2, FR6). Only release_verify_commands also
# check approvals and agent records; the others check provenance only.
verify_commands:
  - '(^|[\s;&|(])obaaf\s+verify\s+release\b'
  - '(^|[\s;&|(])gh\s+attestation\s+verify\b'
  - '(^|[\s;&|(])cosign\s+verify-(blob-)?attestation\b'
  - '(^|[\s;&|(])slsa-verifier\s+verify'
release_verify_commands:
  - '(^|[\s;&|(])obaaf\s+verify\s+release\b'

# Steps that verify an agent's signed record (R8) and check its proposal (R4) before applying
# it. An effect job needs both, in the job itself or in a job it needs (OBAAF-GHA-021).
record_verify_commands:
  - '(^|[\s;&|(])obaaf\s+verify\s+agent-run\b'
  - '(^|[\s;&|(])gh\s+attestation\s+verify\b'
proposal_check_commands:
  - '(^|[\s;&|(])obaaf\s+proposal\s+check\b'

# Secret names that suggest a signing key or certificate (FR11).
signing_secret_patterns:
  - 'SIGN(ING)?_?(KEY|CERT|CERTIFICATE|IDENTITY|P12|PFX)'
  - 'CODE_?SIGN'
  - 'PRIVATE_?KEY'
  - '(GPG|PGP)_?(KEY|PRIVATE|SECRET)'
  - 'COSIGN_?(KEY|PRIVATE)'
  - 'KEYSTORE'
  - '(^|_)(P12|PFX)($|_)'
  - 'CERTIFICATE_?(P12|PFX|BASE64)'
  - 'DEVELOPER_?ID_?CERT'
  - 'MATCH_?PASSWORD'
  - 'KEY_?STORE'
  - '(^|_)CSC_(LINK|KEY_PASSWORD)($|_)'
  - '(^|_)(MACOS|APPLE|WINDOWS|WIN|MAC)_?(CODESIGN_?)?CERT(IFICATE)?($|_)'
# Commands that load a key file into the build environment. A command continued on the next line
# with a backslash is joined before these are matched.
signing_commands:
  - 'cosign\s+(sign|attest)(-blob)?\b(?!.*--key\s+(awskms|gcpkms|azurekms|hashivault|k8s)://).*--key\b'
  - 'signtool(\.exe)?\s+sign\b.*\s/f\s'
  - '(^|[\s;&|(/])gpg2?(\s+--?\w[\w-]*(=\S+|\s+(?!-)[^\s;&|]+)?)*\s+--import\b'
  - '(^|[\s;&|(])security\s+import\b.*\.(?i:p12|pfx)\b'
  - '(^|[\s;&|(])jarsigner\b.*-keystore\b'
  - '(^|[\s;&|(])apksigner\s+sign\b.*--ks\b'
  - '(?i:\bImport-PfxCertificate\b)'
# Actions that load a signing key or certificate into the runner. Matched as a prefix of the
# `uses:` value, before the `@`.
signing_actions:
  - crazy-max/ghaction-import-gpg
  - apple-actions/import-codesign-certs

# Evidence of an egress restriction for agent jobs (R7, FR7).
egress_actions:
  - step-security/harden-runner

