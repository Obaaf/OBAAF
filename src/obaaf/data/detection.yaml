# Files that steer agents (R5). Glob patterns relative to the repository
# root; `**` matches any number of directories.
instruction_files:
  # Matched without regard to letter case. Where a tool reads a file or folder in every directory,
  # the pattern starts with **/ (slice 2d.2h; each name is from the tool's own documentation, listed
  # in docs/bypass-attempts.md). Files that an instruction file pulls in by reference (`@path`,
  # Aider's `read:`) are not followed.
  - AGENTS.md
  - "**/AGENTS.md"
  - "**/AGENTS.override.md"
  - AGENT.md
  - "**/AGENT.md"
  - REVIEW.md
  - opencode.json
  - opencode.jsonc
  - CLAUDE.md
  - "**/CLAUDE.md"
  - "**/CLAUDE.local.md"
  - GEMINI.md
  - "**/GEMINI.md"
  - .github/copilot-instructions.md
  - ".github/instructions/**"
  - ".github/prompts/**"
  - ".github/chatmodes/**"
  - ".github/agents/**"
  - ".github/skills/**"
  - ".github/hooks/**"
  - ".agents/**"
  - .cursorrules
  - "**/.cursor/**"
  - .windsurfrules
  - "**/.windsurf/**"
  - .clinerules
  - ".clinerules/**"
  - ".cline/**"
  - "**/.claude/**"
  - ".gemini/**"
  - ".codex/**"
  - .mcp.json
  - .vscode/mcp.json
  - ".continue/**"
  - "**/.aider.conf.yml"
  - ".junie/**"
  - ".amazonq/**"
  - ".kiro/**"
  - .rules
  - ".augment/**"
  - .augment-guidelines

# Steps that upload or publish release artifacts (G7.2, FR6).
upload_actions:
  - r0adkll/upload-google-play
  - softprops/action-gh-release
  - ncipollo/release-action
  - google-github-actions/upload-cloud-storage
  - game-ci/steam-deploy
  - manleydev/butler-publish-itchio-action
  - yeslayla/butler-publish-itchio-action
  - Apple-Actions/upload-testflight-build
  # Added by flagship slice 2d.2d: actions whose only job is to publish a package.
  - pypa/gh-action-pypi-publish
  - js-devtools/npm-publish
  - goreleaser/goreleaser-action
  - rubygems/release-gem
  # Flagship slice 2d.2e: release assets uploaded by actions the list did not name.
  - svenstaro/upload-release-action
  - actions/upload-release-asset
upload_commands:
  - '(^|[\s;&|(])steamcmd\b.*\+run_app_build'
  - '(^|[\s;&|(])butler\s+push\b'
  - '(^|[\s;&|(])gh\s+release\s+(upload|create)\b'
  - '(^|[\s;&|(])aws\s+s3\s+(cp|sync|mv)\b'
  - '(^|[\s;&|(])gsutil\s+(-m\s+)?(cp|rsync)\b'
  - '(^|[\s;&|(])gcloud\s+storage\s+cp\b'
  - '(^|[\s;&|(])az\s+storage\s+blob\s+upload'
  - '(^|[\s;&|(])fastlane\s+\S*(deliver|upload_to_app_store|upload_to_testflight|pilot|supply|upload_to_play_store)'
  - '(^|[\s;&|(])xcrun\s+altool\b.*--upload'
  - '(^|[\s;&|(])(npm|pnpm|yarn)\s+publish\b(?!(?=[^\n;&|#]*\s--dry-run(=true)?(?!\S)(?!\s+(false|0|no)(\s|$)))(?![^\n;&|#]*\s(--dry-run=(false|0|no)|--dry-run\s+(false|0|no)|--no-dry-run)(?!\S)))'
  - '(^|[\s;&|(])twine\s+upload\b'
  - '(^|[\s;&|(])cargo\s+publish\b(?!(?=[^\n;&|#]*\s--dry-run(=true)?(?!\S)(?!\s+(false|0|no)(\s|$)))(?![^\n;&|#]*\s(--dry-run=(false|0|no)|--dry-run\s+(false|0|no)|--no-dry-run)(?!\S)))'
  - '(^|[\s;&|(])dotnet\s+nuget\s+push\b'
  - '(^|[\s;&|(])docker\s+push\b'
  - '(^|[\s;&|(]|\./)scripts?/(publish|release|deploy)'
  # Added by flagship slice 2d.2d, from a reviewer's attempts on OBAAF-GHA-015. Each is matched in the
  # script as written, with continued lines joined, and with quotes taken out.
  - '(^|[\s;&|(])gh\s+release\s+edit\b'
  - '(^|[\s;&|(])gh\s+api\b[^\n]*/releases\b'
  - '(^|[\s;&|(])git\s+push\b[^\n]*\s--(tags|follow-tags)\b'
  - '(^|[\s;&|(])aws\s+(-\S+\s+\S+\s+)*s3\s+(cp|sync|mv)\b'
  - '(^|[\s;&|(])docker\s+(buildx\s+)?(build|bake)\b[^\n]*\s--push\b'
  - '(^|[\s;&|(])docker\s+(image|manifest)\s+push\b'
  - '(^|[\s;&|(])(npm|pnpm|yarn)\s+(-\S+\s+)*(npm\s+)?publish\b(?!(?=[^\n;&|#]*\s--dry-run(=true)?(?!\S)(?!\s+(false|0|no)(\s|$)))(?![^\n;&|#]*\s(--dry-run=(false|0|no)|--dry-run\s+(false|0|no)|--no-dry-run)(?!\S)))'
  - '(^|[\s;&|(])cargo\s+(\+\S+\s+)?publish\b(?!(?=[^\n;&|#]*\s--dry-run(=true)?(?!\S)(?!\s+(false|0|no)(\s|$)))(?![^\n;&|#]*\s(--dry-run=(false|0|no)|--dry-run\s+(false|0|no)|--no-dry-run)(?!\S)))'
  - '(^|[\s;&|(])(uv|poetry|hatch|flit)\s+publish\b(?!(?=[^\n;&|#]*\s--dry-run(=true)?(?!\S)(?!\s+(false|0|no)(\s|$)))(?![^\n;&|#]*\s(--dry-run=(false|0|no)|--dry-run\s+(false|0|no)|--no-dry-run)(?!\S)))'
  - '(^|[\s;&|(])gem\s+push\b'
  - '(^|[\s;&|(])(firebase\s+deploy|wrangler\s+(deploy|publish)|netlify\s+deploy\b[^\n]*--prod|vercel\b[^\n]*--prod)\b'
  - '(^|[\s;&|(])curl\b[^\n]*\s(-T|--upload-file)\s'
  - '\b(createRelease|uploadReleaseAsset|updateRelease)\s*\('
  # Flagship slice 2d.2e: publishing the list did not name. The Maven, Gradle and JFrog forms are the
  # Jenkins list's; `gh` with options before `release`; registries for charts, images and packages.
  - '(^|[\s;&|(])(\./)?(mvn|mvnw)\b[^\n;&|]*\s(deploy|release:perform)\b(?![^\n;&|#]*\s-DaltDeploymentRepository=\S*::file:)'
  - '(^|[\s;&|(])(\./)?(gradle|gradlew)\b[^\n;&|]*\s(publish(?!ToMavenLocal\b)\w*|uploadArchives)\b'
  - '(^|[\s;&|(])(\./)?sbt\b[^\n;&|]*\s(\+?publish(Signed)?|\+?release)\b'
  - '(^|[\s;&|(])(jf|jfrog)\s+rt\s+(u|upload|dp|docker-push|bp|build-publish)\b'
  - '(^|[\s;&|(])gh\s+(-\S+\s+\S+\s+)*release\s+(upload|create|edit)\b'
  - '(^|[\s;&|(])(helm|oras|podman|crane)\s+push\b(?![^\n;&|#]*\s(oci://)?(localhost|127\.0\.0\.1)[:/])'
  - '(^|[\s;&|(])(semantic-release|changeset\s+publish|bun\s+publish|jsr\s+publish|vsce\s+publish|ovsx\s+publish)\b(?!(?=[^\n;&|#]*\s(--dry-run(=true)?|-d)(?!\S)(?!\s+(false|0|no)(\s|$)))(?![^\n;&|#]*\s(--dry-run=(false|0|no)|--dry-run\s+(false|0|no)|--no-dry-run)(?!\S)))'
  - '(^|[\s;&|(])(maturin|pdm)\s+(publish|upload)\b'
  - '(^|[\s;&|(])pod\s+trunk\s+push\b'
  - '(^|[\s;&|(])goreleaser\s+release\b(?![^\n;&|#]*\s(--snapshot|--skip[= ]\S*publish|--skip-publish)(\s|$))'
  - '(^|[\s;&|(])aws\s+(-\S+\s+\S+\s+)*s3api\s+put-object\b'
  - 'uploads\.github\.com'
  - '\brequest\s*\(\s*[''"]POST\s+/repos/[^''"]*/releases'

# Jenkins only (advisory): Pipeline steps and commands that publish outside Jenkins. The
# commands extend upload_commands for Jenkinsfiles; they are kept separate so adding them
# does not move GitHub Actions jobs into the release lane without review. Generic file
# transfer (scp, rsync, sshPublisher, ftpPublisher) is not counted, because it mostly copies
# reports and logs; declare a stage that releases that way with OBAAF_LANE = 'release'.
jenkins_upload_steps:
  - s3Upload
  - nexusArtifactUploader
  - nexusPublisher
  - googleStorageUpload
  - rtUpload
  - rtPublishBuildInfo
  - rtDockerPush
  - azureUpload
  - androidApkUpload
  - appCenter
  - createGitHubRelease
# Jenkins Pipeline steps that run an AI agent (the AI Agent plugin's aiAgent step). Steps of a
# shared library that wrap an agent go in agents.steps in the checker configuration.
jenkins_agent_steps:
  - aiAgent
jenkins_upload_commands:
  - '(^|[\s;&|(])(\./)?(mvn|mvnw)\b[^\n;&|]*\s(deploy|release:perform)\b'
  - '(^|[\s;&|(])(\./)?(gradle|gradlew)\b[^\n;&|]*\s(publish\w*|uploadArchives)\b'
  - '(^|[\s;&|(])(jf|jfrog)\s+rt\s+(u|upload|dp|docker-push|bp|build-publish)\b'
  - '(^|[\s;&|(])helm\s+push\b'
  - '(^|[\s;&|(])(crane|skopeo)\s+(push|copy)\b'
  - '(^|[\s;&|(])curl\b[^\n;&|]*\s(-T|--upload-file)\s'
  - '(^|[\s;&|(])az\s+artifacts\s+universal\s+publish\b'

# Steps that sign provenance or other attestations (G7.1, FR5).
provenance_actions:
  - actions/attest-build-provenance
  - actions/attest
  - slsa-framework/slsa-github-generator
provenance_commands:
  - '(^|[\s;&|(])obaaf\s+attest\s+build-record\b'
  - '(^|[\s;&|(])cosign\s+attest(-blob)?\b'

# Steps that verify provenance before an upload (G7.2, FR6). Only release_verify_commands also
# check approvals and agent records; the others check provenance only.
verify_commands:
  - '(^|[\s;&|(])obaaf\s+verify\s+release\b'
  - '(^|[\s;&|(])gh\s+attestation\s+verify\b'
  - '(^|[\s;&|(])cosign\s+verify-(blob-)?attestation\b'
  - '(^|[\s;&|(])slsa-verifier\s+verify'
release_verify_commands:
  - '(^|[\s;&|(])obaaf\s+verify\s+release\b'

# Steps that verify an agent's signed record (R8) and check its proposal (R4) before applying
# it. An effect job needs both, in the job itself or in a job it needs (OBAAF-GHA-021).
record_verify_commands:
  # Flagship slice 2d.2e: `gh attestation verify` is no longer counted here. It checks a signature and
  # a predicate type, not the record's run, snapshot or what the agent was allowed.
  - '(^|[\s;&|(])obaaf\s+verify\s+agent-run\b'
proposal_check_commands:
  - '(^|[\s;&|(])obaaf\s+proposal\s+check\b'

# Secret names that suggest a signing key or certificate (FR11).
signing_secret_patterns:
  - 'SIGN(ING)?_?(KEY|CERT|CERTIFICATE|IDENTITY|P12|PFX)'
  - 'CODE_?SIGN'
  - 'PRIVATE_?KEY'
  - '(GPG|PGP)_?(KEY|PRIVATE|SECRET)'
  - 'COSIGN_?(KEY|PRIVATE)'
  - 'KEYSTORE'
  - '(^|_)(P12|PFX)($|_)'
  - 'CERTIFICATE_?(P12|PFX|BASE64)'
  - 'DEVELOPER_?ID_?CERT'
  - 'MATCH_?PASSWORD'
  - 'KEY_?STORE'
  - '(^|_)CSC_(LINK|KEY_PASSWORD)($|_)'
  - '(^|_)(MACOS|APPLE|WINDOWS|WIN|MAC)_?(CODESIGN_?)?CERT(IFICATE)?($|_)'
  # Flagship slice 2d.2i (names a Jenkins attack got past; `-` and `.` are read as `_` in Jenkins):
  # release.jks, secring.gpg, signing.asc, a credential named GPG, signingInMemoryKey (Gradle),
  # ios-dist-cert, artifact-signer-key. Not `signer` alone: OBAAF's own Jenkins
  # template names `obaaf-release-signer` a credential that can only ask a KMS to sign.
  # Not `ASC` alone (App Store Connect's ASC_KEY_ID), a `GPG_` prefix (GPG_FINGERPRINT) or an upload key
  # (SENTRY_UPLOAD_KEY): the review of slice 2d.2i found them on ordinary workflows.
  - '(^|_)(GPG|PGP)$'
  - '(^|_)(JKS|SECRING)($|_)'
  - '(^|_)(SIGN(ING)?|PRIVATE|SECRET|KEY)_?ASC($|_)'
  - 'SIGNING_?IN_?MEMORY'
  - 'DIST(RIBUTION)?_?CERT'
  - 'SIGNER_?KEY'
# Commands that load a key file into the build environment. A command continued on the next line
# with a backslash is joined before these are matched.
signing_commands:
  # `--key=awskms://...` is a key in a KMS too (flagship slice 2d.2i).
  - 'cosign\s+(sign|attest)(-blob)?\b(?!.*--key(\s+|=)(awskms|gcpkms|azurekms|hashivault|k8s)://).*--key\b'
  - '(?i)signtool(\.exe)?\s+sign\b.*\s/f\s'
  - '(^|[\s;&|(/`])gpg2?(\.exe)?([ \t]+--?\w[\w-]*(=\S+|[ \t]+("[^"\n]*"|''[^''\n]*''|(?!["''-])[^\s;&|]+))?)*[ \t]+--import(?![\w-])'
  # Any `security import` but of a public certificate or a provisioning profile (flagship slice 2d.2i:
  # `security import "$P12"`).
  - '(^|[\s;&|(])security\s+import\s+(?!\S*\.(?i:cer|crt|der|mobileprovision|provisionprofile)["'']?(\s|$))'
  - '(^|[\s;&|(])jarsigner\b.*-keystore\b'
  - '(^|[\s;&|(])apksigner\s+sign\b.*--(ks|key)\b'
  - '(?i:\bImport-PfxCertificate\b)'
  # Flagship slice 2d.2i: commands a Jenkins attack got past.
  - '(?i)(^|[\s;&|(])certutil(\.exe)?\b.*\s-importpfx\b'
  - 'cosign\s+import-key-pair\b'
  - 'docker\s+trust\s+key\s+load\b'
  - '(^|[\s;&|(])osslsigncode\s+sign\b.*\s-(pkcs12|key)\b'
  - '(^|[\s;&|(])openssl\s+(dgst|pkeyutl)\b.*\s-sign\b'
  - '(^|[\s;&|(])ssh-keygen\b.*\s-Y\s+sign\b'
# Actions that load a signing key or certificate into the runner. Matched as a prefix of the
# `uses:` value, before the `@`.
signing_actions:
  - crazy-max/ghaction-import-gpg
  - apple-actions/import-codesign-certs

# Inputs that an action runs as a shell command or a script (OBAAF-GHA-010, flagship slice 2d.2d). An
# expression written in one is expanded before the action runs it, as in a step's `run`. Matched by the
# action's name in any letter case; an action not listed here is not read.
script_inputs:
  actions/github-script: [script]
  azure/cli: [inlineScript]
  azure/powershell: [inlineScript]
  appleboy/ssh-action: [script]
  garygrossgarten/github-action-ssh: [command]
  google-github-actions/ssh-compute: [command, script]
  nick-fields/retry: [command, on_retry_command]
  nick-invision/retry: [command, on_retry_command]
  wandalen/wretry.action: [command]
  addnab/docker-run-action: [run]
  uraimo/run-on-arch-action: [run, install]
  cypress-io/github-action: [build, start, command]

# Secret names that hold a credential for publishing a release: a package registry, an app store, a
# game store, a container registry (OBAAF-GHA-015, flagship slice 2d.2d). Matched without regard to
# letter case. A job that holds one and that untrusted input can start is reported even when nothing
# else marks it a release job.
publishing_secret_patterns:
  - '(^|_)NPM_?(TOKEN|AUTH|PUBLISH)'
  - 'PYPI'
  - 'TWINE_(PASSWORD|TOKEN)'
  - 'CARGO_REGISTRY_TOKEN|CRATES_IO'
  - 'RUBYGEMS|GEM_HOST_API_KEY'
  - 'NUGET_?(API_?)?KEY'
  - 'OSSRH|SONATYPE|MAVEN_(CENTRAL_)?(PASSWORD|TOKEN)'
  - 'DOCKER_?(HUB)?_?(ACCESS_)?(TOKEN|PASSWORD|PAT)'
  - '(^|_)(GHCR|REGISTRY|QUAY)_?(TOKEN|PASSWORD|PAT)'
  - 'HEX_API_KEY|COCOAPODS_TRUNK_TOKEN|PUB_DEV|VSCE_PAT|OVSX_PAT'
  - 'APP_?STORE_?CONNECT|ASC_(KEY|API)|APPLE_(API|ID)_?(KEY|PASSWORD)'
  - 'GOOGLE_PLAY|PLAY_STORE|PLAY_SERVICE_ACCOUNT'
  - 'STEAM_?(USERNAME|PASSWORD|CONFIG|TOTP)|STEAMWORKS'
  - 'BUTLER_API_KEY|ITCH_?IO'
  - 'CHROME_WEBSTORE|AMO_(JWT|API)|FIREFOX_ADDONS'
  - '(^|_)(RELEASE|PUBLISH)_?(TOKEN|KEY|PAT)'

# Actions that publish or deploy and are not among upload_actions (OBAAF-GHA-015, flagship slice 2d.2d).
# They do not put a job in the release lane, which would bring the other release rules; a job that uses
# one and that untrusted input can start is reported by OBAAF-GHA-015 as one that may release.
publishing_actions:
