# Rules of the OBAAF pipeline checker (`obaaf check`).
#
# Each rule names the profile requirements (G…) and agent controls (R…) it
# helps verify, the spec requirement it supports (FR…), why a finding matters
# (`why`: one sentence the text report prints under each finding), and the
# fix. The
# logic lives in src/obaaf/checker/rules.py, keyed by rule ID. Rule IDs are
# stable (NFR7).
#
# Severity: high = a documented attack path is open; medium = a safeguard is
# missing; low = hardening.

version: 0.1.0

rules:
  - id: OBAAF-GHA-001
    title: Secret available to a workflow started by untrusted input
    severity: high
    category: authority
    requirements: [G3.4, G8.1, G9.1]
    supports: [FR3]
    why: >-
      Whoever steers this job through its code or the text it reads can read any secret it is given, and its
      trigger lets less trusted people start it.
    description: >-
      The workflow can be started by people without write access (for example through pull_request_target,
      issue_comment, issues or workflow_run) and a job references a repository or organization secret. Anyone
      who can steer that job, through its code or through text it reads, can read the secret. Jobs behind an
      environment named in plain text are reported at medium severity, because environment secrets are
      released only after required reviewers approve; an environment named by an expression, or not as text,
      keeps the finding high, because GitHub creates an environment it does not know on first use with no
      protection rules, and an expression can name one the event's author picks. Pull-request workflows are
      reported at low severity: forks receive no secrets, but branches pushed by anyone with write access do.
      The job's environment is part of the finding, because a secret of the same name in another environment
      is another secret. Not followed: whether a named environment really requires reviewers (a repository
      setting; `obaaf audit` reads it); events an app can raise for an outsider's change (`check_run`,
      `check_suite`, `status`, `deployment`, `deployment_status`) and `merge_group`, which are not treated as
      untrusted; a workflow another repository calls, whose caller's trigger is not known from its own file
      (a job of the same repository that calls it by its path, `./.github/workflows/...`, gives it the
      events that can start that job, and the finding names what each such caller passes for the secrets
      the job reads, since slice 2d.4b1; a call written as `owner/repo/...@ref` is not matched); and
      secrets that reach the job through artifacts, caches or another job's outputs. An event name written
      other than in lower-case letters and underscores is a problem of the file, which fails the check.
    fix: >-
      Move the step that needs the secret into a workflow that runs only after review (for example on
      a push to a protected branch, or behind an environment with required reviewers), and pass only
      data, never secrets, out of the untrusted workflow.

  - id: OBAAF-GHA-002
    title: Untrusted code checked out in a privileged workflow
    severity: high
    category: authority
    requirements: [G3.1, G9.1]
    supports: [FR3]
    why: >-
      The workflow holds the base repository's token, secrets and cache, so building or running the pull request's
      code hands them to its author.
    description: >-
      A pull_request_target, workflow_run or comment-triggered workflow checks out or fetches the code of
      a pull request. These workflows run with the base repository's token, secrets and cache scope, so
      building or running that code hands them to its author (a "pwn request"). An actions/checkout step's
      `ref` and `repository` are read as expressions, in any letter case, with index syntax, through
      `format`, `join`, `fromJSON` and `toJSON`, and through `env` on the step, job or workflow (a value
      set in one reads the ones outside it, as GitHub evaluates it): the head commit, branch, repository
      or its owner (with or without a `ref`), the merge commit, `after` on a synchronize, a review's
      commit, the pull request's number (from which `refs/pull/N/...` is built) and `refs/pull/` written
      out are the pull request's code. A `ref` or `repository` taken from anything else the checker cannot
      read to a value (a step's or job's output, an input, a variable, a matrix, an `env` name set nowhere
      in the file, inputs written as one expression) is reported at medium as "cannot tell". Scripts
      (`run`, a `docker://` step's `entrypoint` and `args`, the command OBAAF's egress action runs, and a
      quoted script given to `sh -c`, `bash -c` or `eval`) are split as a shell splits them, comments
      dropped, command by command (a pipeline is one command): a command that brings code in (git, after
      any global options and their values, by path or quoted, with fetch, pull, clone, checkout, switch,
      reset, worktree, merge, rebase, cherry-pick, show, apply, am and others; `gh pr checkout`; `gh repo
      clone`; `patch`; `gh api`, curl or wget of an archive, contents, a diff or the pull request's patch
      or diff address) is reported when the same command names the pull request's code: directly, through
      `env`, from the event file, `gh pr view` or `gh pr diff`, by its number, through a variable set
      earlier in the step (`NAME=`, `export`, `read`, `for NAME in`, `mapfile`), through a file an earlier
      command wrote from one of these, or through a git remote added with the head's address. A command
      counts only where a command starts: at the start, after `|`, `then` and the like, after
      `NAME=value`, after `sudo`, `env`, `timeout`, `xargs` or another command that runs the next (with
      its options), and inside a backquote or `$(`. The name of a branch that `git switch -c` or `git
      checkout -b` creates is not read. A script in another language (`shell: python`, `node`, PowerShell)
      and an `actions/github-script` script are split roughly, and git, gh and downloads count anywhere in
      them, also inside a string; their variables count by name. In a github-script script a REST call for
      contents or an archive is read from its own arguments, and a name given to it from where the script
      defines it, and a call for the diff or patch counts when the script applies it. Such a command with
      a step's or job's output, or a field an outsider writes, is "cannot tell"; a "cannot tell" finding
      is identified with everything in the file the value can depend on (the workflow's and job's env, the
      job's strategy, its earlier steps, and the jobs it needs). The job's and step's `if:` are part of
      the finding. Not followed: values passed between steps through `GITHUB_ENV`, `GITHUB_OUTPUT` or
      files; shell functions, arrays and aliases, and a variable set in a `while read` loop fed from its
      end; actions other than actions/checkout that check out code (composite or marketplace actions of
      other repositories; since slice 2d.4b2 the steps of a local composite action are read as the job's,
      with the inputs the using step gives put in); a reusable workflow of another repository called from such a workflow; a ref a caller
      passes to a reusable workflow of another repository as an input; and commands the list above does
      not name. A local reusable workflow's jobs are read with the events that start the jobs of the
      repository that call it (slice 2d.4b1), and each `inputs` reference in it with what each of those
      jobs hands the input (slice 2d.4b3a): its `with:` or the input's default, with the caller's own
      contexts as `caller.<context>` and what its matrix lists and the jobs it needs output, to three
      levels. A checkout of `inputs.ref` given the pull request's head is high; the reference as written
      stays among the values, for a caller the checker cannot see, so one given only the base is still
      "cannot tell".
    fix: >-
      Build pull-request code in a pull_request workflow, which runs with a read-only token and no
      secrets. If a privileged step must follow, pass results through artifacts and treat them as
      untrusted data.

  - id: OBAAF-GHA-003
    title: Agent job can write
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.1]
    agent_controls: [R2, R4]
    supports: [FR8]
    why: >-
      Text the agent reads can direct what it does, so whoever can put text in front of the agent can use any
      write access the job holds or inherits.
    description: >-
      A job that runs an AI agent holds write permissions, or does not declare its permissions and so may
      inherit write access: the repository default, or, in a workflow another can call (`workflow_call`),
      whatever the calling job grants. Text the agent reads can then direct those writes. Permissions written
      in a form GitHub does not document (a scope name in another case, a level other than `read`, `write` or
      `none`, a string other than exactly `read-all` or `write-all`, an expression) are a problem of the file,
      which fails the check, and are read as the widest grant they could be; `permissions:` with no value is
      taken as not written, and a scope name in lower-case letters and hyphens that GitHub does not know is
      read as written. Not followed: the repository's or organization's default token permissions (an
      undeclared job is reported whatever they are); what a workflow of another repository that calls this one
      grants (where jobs of this repository call it, what each grants, followed to the first caller that
      declares, is part of the `inherited` finding, slice 2d.4b3a); write access through a
      token taken from a secret, which OBAAF-GHA-005 reports as a secret; and an agent inside an action from
      another repository. An agent inside a local composite action makes the job an agent job (slice 2d.4a);
      a local action the checker cannot read through is named in a note, and one whose file it cannot read
      is an error.
    fix: >-
      Give the agent job `permissions: {contents: read}` (plus other read permissions it needs) and
      apply its proposals in a separate effect job behind a protected environment.

  - id: OBAAF-GHA-004
    title: Agent job can request cloud credentials
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.1]
    agent_controls: [R3]
    supports: [FR7]
    why: >-
      The agent may be able to request an OIDC token and exchange it for cloud or signing credentials, so text
      that steers the agent can reach them too.
    description: >-
      A job that runs an AI agent has `id-token: write`, so the agent can request an OIDC token and exchange
      it for cloud or signing credentials. A scope written in another case counts as `id-token`. An agent job
      that declares no permissions in a workflow another can call (`workflow_call`) is reported too, because
      the calling job can grant `id-token: write`; where jobs of this repository call it, what each grants
      for `id-token`, followed to the first caller that declares, is part of the finding (slice 2d.4b3a).
      Not followed: what a calling workflow of another repository grants; and
      the repository default, which the checker takes never to include `id-token: write`, so an undeclared job
      in a workflow nothing calls is not reported. Cloud credentials held as long-lived secrets are
      OBAAF-GHA-005's.
    fix: >-
      Remove `id-token: write` from the agent job. Sign the agent-run record in a separate job that the
      agent cannot influence.

  - id: OBAAF-GHA-005
    title: Secret available to an agent job
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.1]
    agent_controls: [R2, R3]
    supports: [FR7]
    why: >-
      Text the agent reads can make it disclose a secret it can read, so a secret in an agent job may be exposed
      to whoever can put text in front of the agent.
    description: >-
      A job that runs an AI agent references a secret, inherits secrets, or uses an environment whose secrets
      it receives. Prompt injection can make the agent disclose any secret in its environment. The job's
      environment is part of the finding, because a secret of the same name in another environment is another
      secret, so an acceptance written for one environment does not cover another. In a workflow that a job of
      the same repository calls by its path (`./.github/workflows/...`), what each such caller passes for the
      secrets the job reads, followed through callers that are themselves called, is part of the finding too,
      so a baseline entry written for one mapping does not cover another (slice 2d.4b1); a secret the caller
      picks with an expression (`secrets[matrix.k]`) is "any secret", whichever it picks. Not followed by the
      finding itself: a caller in another repository, or one written as `owner/repo/...@ref`; the calling
      job, which is not read as an agent job; and secrets that reach the agent through artifacts, caches,
      files or another job's outputs. When the job references secrets, the finding lists five controls and is cleared
      only when the checker has verified all five. (1) Each secret is listed in `protected_secrets` and the
      job declares the environment named there. (2) The secrets are stored only in that environment and only
      protected branches may use it; an explicit audit snapshot no older than 30 days must establish both.
      Missing or incomplete observations leave this control unverified. (3) No pull request, issue or comment can start the job, no checkout step
      names a pull request's ref, and no expression or `if:` in the job reads a field someone without write
      access can write. (4) A control the checker recognises limits the job's network access to an allow-list
      (as OBAAF-GHA-020 reads it). (5) The agent's command cannot read any of the job's secrets
      (`GITHUB_TOKEN` aside, which OBAAF-GHA-003 covers), because a key the agent can read can leave in the
      job's log or an artifact whatever the network allows: verified only where every secret of the job is set
      in the `env` of steps that use OBAAF's egress action, at a commit OBAAF lists as released, on the runner
      it was tested on, and goes to AWF's API proxy (named in `model-keys`) or to nothing the command runs; it
      says where each credential given to such a step goes, whatever its verdict. A secret passed to the
      command, given to another step or to the job's or the workflow's `env`, a job with no confined command
      (GitHub's native firewall holds no key), or an agent or a credential in a step that can run before or
      beside the step that holds the key is "not met". That step holds the key outside the sandbox, so what
      could reach it there is "cannot tell": `ACTIONS_ALLOW_UNSECURE_COMMANDS`, or a key or an `env`
      computed when the job runs, in an `env`, a step before or
      beside it whose script, `env` values or inputs name `GITHUB_ENV`, `exportVariable` or the runner's `_runner_file_commands` folder or whose
      words may leave a process running, a parallel step,
      and service containers given volumes or options; and, since decision D-132, a possible artifact
      upload anywhere in the job, steps after it included, as OBAAF-GHA-020 reads it. Since those steps run no shell, look nothing up
      through the `PATH` and empty the loader's variables (slice 2c.9), bash's, Python's, the `PATH`'s and
      the loader's variables and a write to `GITHUB_PATH` no longer count as reasons of this control's own
      (slice 2c.10b), though such a variable or step can make a step a possible upload; since the action
      removes every `OPENSSL_` variable from them before libcrypto loads (slice 2c.11a), OpenSSL's no
      longer count either (slice 2c.11b). The second control records the selected snapshot date and the evidence it supplies. Not read for the third
      control: what a script, an action other than `actions/checkout` or the agent itself fetches while the
      job runs, apart from a few commands the checker knows (`gh pr checkout`, `git fetch` of `pull/N/head`);
      a workflow that starts this one with `workflow_dispatch` and passes on text an outsider wrote; a value
      handed over through `needs.*.outputs`; and the callers of a reusable workflow, which are reported as
      "cannot tell".
    fix: >-
      Either keep the model credential in an inference proxy outside the job (see
      docs/inference-proxy.md) and pass no secrets to the agent job, or, where the finding lists its
      controls, make all five hold: list each secret in `protected_secrets` with its environment and
      declare that environment on the job; keep the secrets only in that environment and limit it to
      protected branches; start the job only from `push`, `workflow_dispatch`, `schedule` or
      `release`, with no pull-request checkout; and run the agent's command under OBAAF's egress action
      with its host names in `allow` and an Anthropic or OpenAI key in `model-keys`, set in that
      step's `env` and nowhere else in the job, so that the network is limited and the command never
      holds the key. Until the checker can verify all five, accept the finding with an owner, a reason
      and an expiry date.

  - id: OBAAF-GHA-006
    title: Release job can read a shared cache
    severity: high
    category: authority
    requirements: [G4.1, G4.2]
    agent_controls: [R7]
    supports: [FR4]
    why: >-
      Other workflows can write the caches a job restores, so a release job can ship a poisoned entry, and a job
      holding what publishing needs runs it with that.
    description: >-
      A release job restores a GitHub Actions cache, directly or through a setup action that caches by
      default, and its `cache-mode` does not forbid it. Caches can be written by other workflows on the
      same branch or the default branch, so a poisoned entry would reach the release build. A release
      job with no cache step but no `cache-mode: none` is reported at low severity. Since flagship slice
      2d.2e: an input written as an expression is read as the value that restores, a local action is
      taken to restore whatever it holds (since slice 2d.4b2 its steps are also read as the job's, but the
      rule gives one finding for a job, on the first step that restores, which is then the using step),
      `lookup-only: true` restores nothing, and a release
      job that downloads artifacts is reported when a job it needs, directly or not, restores a cache
      (kind `needed-job-restores`; it may name a job whose output the release does not use). Since slice
      2d.4b3b: a job declared a release job that calls workflows of the repository by their path is
      reported when steps of called jobs that are not release jobs themselves, followed through further
      calls, may restore a cache that neither their own cache-mode nor that of a calling job between
      forbids (kind `called-restores`), because GitHub gives a called workflow no more cache access than
      its caller (a called release job's restores are its own finding); `needed-job-restores` reads a
      download in a called job and a needed job that calls a workflow; and in a workflow whose `on` names
      only `workflow_call` and whose every caller in the repository forbids restoring, the job's finding
      has a control that cannot be told, because a caller in another repository is not seen. Since slice
      2d.14: a job nothing puts in the release lane is reported at medium, as one the checker cannot tell
      releases, when it holds what publishing needs and restores a cache that its cache-mode lets through
      (kind `capability-restores`) or downloads artifacts from a job it needs that restores one (kind
      `capability-needed-job-restores`), because code from a poisoned cache entry runs with what it holds
      whether or not the job publishes. What it holds, a fact of the finding, is what OBAAF-GHA-015 counts
      (`packages: write`, an action under `publishing_actions` other than a `docker/build-push-action` step
      that cannot push, a secret whose name says it publishes), a reference that can read every secret,
      and `contents: write` in a job that a release event, a tag push, a tag's creation or another
      workflow's call can start; a called job that declares no permissions holds what its callers in the
      repository grant. For this case a local action is a cache step only when its steps were not read,
      and where they make the job a release job the release case on the same step or job replaces it. Not
      followed: a `docker://`
      step, a step whose `if:` never lets it run (reported anyway), outputs passed between jobs, actions
      that cache that are not listed (`nix-community/cache-nix-action`, `denoland/setup-deno` and others),
      and, for a job that is not a release job, permissions nobody declares (OBAAF-GHA-009 reports them),
      `contents: write` on other events, a credential whose name matches no pattern, and a cache restored
      in a workflow the job calls, which is read in that workflow with the secret names its jobs use (a
      credential passed to it under another name is not counted).
    fix: >-
      Set `cache-mode: none` on release jobs and remove cache restore steps, or regenerate derived data
      inside the release lane.

  - id: OBAAF-GHA-007
    title: Low-trust workflow can write the default-branch cache
    severity: high
    category: authority
    requirements: [G4.1]
    agent_controls: [R7]
    supports: [FR4]
    why: >-
      Code or an agent an outsider steers could write cache entries that release workflows later restore, as in
      the Clinejection case.
    description: >-
      The workflow runs on triggers that outsiders can start (for example pull_request_target,
      issue_comment or workflow_run) and declares a write-capable `cache-mode`. Code or an agent
      steered by an outsider could then poison caches that release workflows restore, as in the
      Clinejection case. GitHub gives some of these triggers read-only cache access by default
      (pull_request_target, issue_comment, and workflow_run runs that follow a pull request from a
      fork), but not every case, and this rule cannot see the default a job gets when it declares
      nothing.
      The value is read the widest way (flagship slice 2d.2e): a value that is not exactly `none`,
      `read`, `write` or `write-only` (another case, an expression, a number, a block scalar) is
      reported as one the checker cannot read, a null at the job does not hide the workflow's value, and
      a key in another spelling is read. Not followed:
      `check_run`, `check_suite`, `status` and `deployment_status` (issue #166), and an `if:` that keeps
      forks or outsiders out (reported anyway).
    fix: >-
      Remove the write-capable `cache-mode`, or set `cache-mode: none` (or `read`) explicitly for jobs
      in this workflow.

  - id: OBAAF-GHA-008
    title: Action or container not pinned to a full digest
    severity: medium
    category: hygiene
    requirements: [G2.1]
    agent_controls: [R6]
    supports: [FR10, FR12]
    why: >-
      Unless the reference is a full digest, whoever can change what it points to (its publisher, or anyone who
      compromises the publisher) chooses code the job runs.
    description: >-
      A third-party action, reusable workflow or container image is referenced by a tag or branch,
      which its publisher, or anyone who compromises the publisher, can move. Release, effect and agent jobs
      are reported at high severity. Ordinary jobs with explicitly limited token permissions,
      no secrets and no privileged outside trigger are reported at low severity; a job in a workflow other
      workflows can call (`workflow_call`) is never low, because its callers' triggers are not in the file.
      Other jobs remain medium: missing token permissions must not silently downgrade a privileged job.
      An action or reusable workflow is pinned only by a full commit SHA as github.com writes one, 40
      hexadecimal digits in lower case (a 64-digit ref can only be a tag or a branch there), and an image
      only by `@sha256:` and 64 hexadecimal digits at its end. Every image is read: the container's and
      each service's, also written as text; one computed when the job runs is reported as such (kind
      `image-expression`) unless it is exactly `${{ matrix.x }}` with the values written out in the file,
      which are read one by one, and one written in a form the checker does not read (not text, a key in
      another letter case, services not written as a mapping) is reported too (`image-unreadable`). An
      action in the repository itself (`./path`, `$/path`) has nothing to pin, except that a `./` action
      after a step that checks out another repository at that path (after `.` and `..` are resolved; an
      absolute path or one with an expression is taken to hold it) is that repository at the ref it was
      checked out at (`local-from-checkout`), and one after an artifact downloaded from another run or
      repository, a cache restored at a workspace path that holds it, or a script line that runs `git
      clone`, `git worktree`, `git submodule`, `gh repo clone`, `gh release download`, `gh run download`,
      `curl`, `wget`, `degit`, `tar x`, `unzip`, `bsdtar` or `7z` and names a workspace path at or under
      the action's top directory (not in a URL) in the same command, or that clones a repository of that
      name with no folder given, is reported as
      one the checker cannot place (`local-after-download`). An empty image is no container. Not followed:
      code merged or patched into the workspace (`git fetch` and `git merge`, `git am`, `git apply`), a
      download whose target is on another line or in `working-directory`, downloads before an action at
      the workspace root (`uses: ./`), an artifact of the same run, a cache restored at a path written
      with `~`, an absolute path, a glob or an expression, the actions a called workflow uses (they are
      checked where its own file is; since slice 2d.4b2 the actions and images a local composite action's
      steps use are read as the job's steps and reported on them), whether a pinned commit is on the repository's own branches or
      only in a fork of it, and what a pinned action fetches or runs when it runs.
    fix: >-
      Pin the reference to a full 40-character commit SHA, or an image to its sha256 digest, and keep
      the version in a comment (for example `uses: actions/checkout@<sha> # v7.0.1`). Let Dependabot
      propose updates to the pin.

  - id: OBAAF-GHA-009
    title: Token permissions not declared
    severity: medium
    category: authority
    requirements: [G3.4]
    supports: [FR3, FR8]
    why: >-
      The job token then gets the repository or organization default, which may include write access that no step
      of the job needs.
    description: >-
      Neither the workflow nor the job declares `permissions`, so the job token gets the repository or
      organization default, which may include write access. The finding is the job's: which events can
      start the job is not part of it (other rules report what a trigger adds), so an acceptance keeps
      covering the job when its triggers change. A `permissions` value the checker cannot read, and a file
      it reads in a way GitHub may not (a YAML merge key, a job id this reader takes for a value other
      than text), are errors of the file, which fail the check. Not followed: the repository's or
      organization's default itself, which `obaaf audit` reads.
    fix: >-
      Declare `permissions: {}` or `permissions: {contents: read}` at the top of the workflow and grant
      each job only what it needs.

  - id: OBAAF-GHA-010
    title: Untrusted event text expanded inside a script
    severity: high
    category: authority
    requirements: [G8.1, G3.1]
    agent_controls: [R1]
    supports: [FR3]
    why: >-
      Text such as a title or a branch name is pasted into the script before the shell runs, so whoever writes it
      may be able to run commands in the job.
    description: >-
      A script interpolates text that an outsider controls, such as an issue title, a pull-request title
      or body, a branch name, a commit message, author or file name, a review comment's file path, an
      edited title's old value or a fork's description, with `${{ }}`: written plainly, with index
      syntax, in any letter case, through `toJSON` or another function given the event object, through
      a group (`(github.event.issue).title`), or through a wildcard or computed index
      (`github.event.*.title`, `github.event[inputs.kind].body`). `${{ env.NAME }}` counts when the
      step, job or workflow sets NAME from one of these fields, directly, through other env values,
      the matrix, another job's output or an `env:` written as one expression; `${{ matrix.x }}` when
      the job's matrix holds one; `${{ needs.a.outputs.x }}` when job a's `outputs` written in the file
      do. A script is a step's `run`, its `shell` (or `defaults.run.shell`), an `actions/github-script`
      script, the command OBAAF's egress action runs, a `docker://` step's `entrypoint` and `args`, and
      the inputs of the actions listed under `script_inputs` in the detection data. Every field a step
      reaches, the references and expressions that reach them, and the job's triggers are the
      finding's facts. It is high when an outsider's event (a pull request, a comment on a commit,
      `check_suite`, `check_run` and `status` included) or another workflow's call can start the job,
      and for a commit's text on `push`, `merge_group` and a `workflow_run` after a push, where a merged
      pull request's title and branch name are in the merge commit's message; medium otherwise. Not
      followed: values set while the job runs (`GITHUB_ENV`, step outputs), values a reusable workflow of
      another repository is given (since slice 2d.4b3a a local reusable workflow's `inputs` are read with
      what the jobs of the repository that call it hand them, their matrix's values and the outputs of
      the jobs they need included, to three levels), an action's `outputs` read in the job, the inputs of
      other actions (since slice 2d.4b2 a local composite action's steps are read with its inputs put in), a `with:`
      written as one expression, and the `env` of a `parallel` group. It does not work out whether an
      expression gives text or only true or false, so `contains(github.event.issue.title, 'bug')` is
      reported too; an acceptance of it names the expression. A matrix that holds one outsider-written
      field makes every `matrix` reference count. The text becomes part of the script before the shell
      runs, so it can run commands. This is how the Nx compromise began.
    fix: >-
      Pass the value through an environment variable (`env: TITLE: ${{ github.event.issue.title }}`)
      and use it quoted in the script (`"$TITLE"`), so the shell treats it as data.

  - id: OBAAF-GHA-011
    title: Checkout leaves the job token on disk
    severity: medium
    category: authority
    requirements: [G8.1, G3.4]
    agent_controls: [R7]
    supports: [FR7]
    why: >-
      Any code or agent that runs later in the job may be able to read the credential from disk and act with it.
    description: >-
      In an agent job or a job started by untrusted input, actions/checkout persists the job token for
      later git commands. Any code or agent that runs later in the job can read it. A job counts when it
      runs an agent or when any event that starts it is one an outsider can cause (a pull request
      included), whatever else also starts it. actions/checkout keeps the credential unless
      `persist-credentials` is written as something other than `true` in any case; an expression counts as
      written only when it is a constant (`${{ false }}`), and otherwise is taken to keep it. The
      finding's facts are the credential kept (the job token, or the token or SSH key given in the step's
      `token` or `ssh-key` input), the triggers, whether the job runs an agent and what the job token can
      write, so an acceptance for a read-only pull_request job does not cover a job that can write or one
      given a personal token. Not followed: credentials kept by other means (`gh auth setup-git`, a `git
      config` a script writes, another action), reusable workflows and composite actions.
    fix: >-
      Add `persist-credentials: false` to the checkout step.

  - id: OBAAF-GHA-012
    title: Agent reads instructions from the change under review
    severity: high
    category: authority
    requirements: [G8.2]
    agent_controls: [R5]
    supports: [FR9]
    why: >-
      The change under review can rewrite the instructions, rules and MCP configuration the agent obeys during its
      run on that change.
    description: >-
      The agent job checks out the pull request's version of the repository, so instruction files, rules
      files and MCP configuration come from the change being reviewed. The change can then rewrite what
      the agent obeys during its own run. The checkout's `ref` and `repository` and the job's scripts are
      read as for OBAAF-GHA-002; a value that also names the base (`head.sha || base.sha`) is the head. On
      pull_request, pull_request_review and pull_request_review_comment, a checkout with no `ref`, or with
      `github.sha`, `github.ref` or `github.ref_name`, takes the merge commit, which holds the pull
      request's files. A `ref` the checker cannot read to a value is reported at medium where an
      outsider's event can start the job. The triggers, the job's and step's `if:` and what was read are
      part of the finding. Not followed: what the agent itself fetches while it runs, the merge commit
      fetched by a script (`git fetch origin "$GITHUB_REF"`), values passed between steps, other checkout
      actions, reusable workflows and composite actions.
    fix: >-
      Check out the protected base branch for instruction files (for example `ref: ${{
      github.event.pull_request.base.sha }}`), and give the agent the pull request's changes only as
      data captured by the snapshot step.

  - id: OBAAF-GHA-013
    title: Self-hosted runner used for untrusted work
    severity: high
    category: authority
    requirements: [G3.1, G3.2]
    agent_controls: [R7]
    supports: [FR3, FR4]
    why: >-
      Unless the runner is ephemeral, code from this job can stay on the host and tamper with later builds, as in
      the PyTorch case.
    description: >-
      A job that pull requests, outside events or an agent can drive runs on a self-hosted runner.
      Unless the runner is ephemeral, code from that job can persist on the host and tamper with later
      builds, as in the PyTorch case. A label is self-hosted when it is `self-hosted` in any letter case,
      also with spaces round it or as one word of a label with spaces or commas, or a runner group
      (which may also hold GitHub's larger runners: such a job is still reported high). A label is
      GitHub-hosted only when it is one of the labels GitHub names for its standard runners and macOS
      larger runners, or `ubuntu-24.04-firewall`, the runner of GitHub's native egress firewall (a
      technical preview), which OBAAF-GHA-020 also reads as GitHub's own (`HOSTED_LABELS`). As for
      every label on that list, the label is taken at its word: whether a self-hosted runner could be
      given the same label is not read. Any other label (`ubuntu-gpu`, a larger runner's name, an
      unresolved input) is reported at medium, because the checker cannot tell what runs the job. A
      runtime selector is informational only in the form
      `github.event.pull_request.head.repo.full_name == github.repository && <runner> || '<hosted label>'`
      (or `!=` the other way round), only when every outside event that starts the job carries the pull
      request, and only when the job runs no agent; any other selector naming `self-hosted`, including
      `head.repo.fork && 'ubuntu-latest' || 'self-hosted'`, which sends a pull request whose fork was
      deleted to the self-hosted runner, is medium. The selector, and the sets a matrix resolves the
      labels to, are facts. Literal matrices that include a self-hosted pool produce a high finding.
      `runs-on` written as one expression, `matrix.x` or `matrix.x || 'label'`, is resolved from a matrix
      written out in the file, the default counting wherever a row may lack the value; values of `x`, an
      `include` or an `include` entry computed when the job runs, a key written in another case, a key
      that is not plain ASCII text, a value YAML 1.2 could read as other than text, a merge key (`<<`) in
      the file, or any other expression is not resolved. A job that calls a reusable workflow is not
      reported (it has no runner); the jobs of a workflow that a job of the same repository calls by its
      path (`./.github/workflows/...`) are read with the events that can start that job, as well as
      `workflow_call` (slice 2d.4b1); not followed: the events of a caller in another repository or
      written as `owner/repo/...@ref`, and agents the checker does not recognise. If you verify the selector and runner lifecycle, record the
      evidence in a job-scoped, expiring `ignore` entry (see the checker configuration guide). A
      declaration is not verification of runtime isolation.
    fix: >-
      Run untrusted and agent jobs on GitHub-hosted or ephemeral runners, and keep persistent
      self-hosted runners for the release lane only.

  - id: OBAAF-GHA-014
    title: Release job not behind a protected environment
    severity: medium
    category: authority
    requirements: [G6.2]
    supports: [FR6]
    why: >-
      Unless an environment is sure to apply, no person has to approve the release, and its credentials are not held
      back until someone does.
    description: >-
      A release job that uploads or publishes does not reference an environment, so no person has to
      approve it and its credentials are not held back until approval.
      An environment counts only when its name is written as text, or as an expression whose every value
      the checker can list and none is blank (flagship slice 2d.2e); a blank name, a number, true or
      false, or an expression that can be blank or name something else is reported as cannot tell. A
      release job with no upload the lists know is reported when it holds what publishing needs
      (`packages: write`, a publishing action, a secret whose name says it publishes). Not read: whether
      the environment has required reviewers (`obaaf audit` reads it), a deployment to GitHub Pages or a
      cloud service (not counted as publishing unless the job is declared a release job), a command
      built from a variable (`$D push`), `rsync`, `scp`, `rclone` and `skopeo`, a dry run (`--dry-run`, `--snapshot`, `publishToMavenLocal`) or a push to `localhost`, and a publish inside a local
      reusable workflow counted for the job that calls it (slice 2d.4b3b; since slice 2d.4b1 a called
      workflow's own job is checked with its callers' events). Since slice 2d.4b2 a publish in a local
      composite action's steps makes the job that uses it a release job.
    fix: >-
      Reference an environment (for example `environment: release`) configured with required reviewers,
      self-review prevention and no administrator bypass.

  - id: OBAAF-GHA-015
    title: Release workflow started by untrusted input
    severity: high
    category: authority
    requirements: [G3.1]
    supports: [FR4]
    why: >-
      Unreviewed changes or outsiders can reach the release lane, so what ships can come from code or input nobody
      approved.
    description: >-
      A release workflow can be started by pull requests, comments, issues or another workflow's run,
      so unreviewed changes or outsiders can reach the release lane. A release job is one that publishes
      by an action or command the detection data lists (read in `run`, github-script and `docker://`
      steps, with continued lines joined and quotes taken out) or that uses an environment whose name,
      or one of the names an expression or matrix gives it, says releases go there: `release`, `prod`,
      `publish`, `store`, `steam`, `itch` or `deploy` anywhere in it (`AppProd`, `euproduction`), once
      words that only hold those letters are taken out (`kitchen`, `restore`, `keystore`, `reproducible`,
      `product`), or `live`, `prd`, `cd`, `pypi`, `testpypi`, `npm`, `crates`, `rubygems`, `nuget`, `pages`
      or `testflight` as a word;
      not `preprod` or `non-prod`. It is medium when
      the only outside events are `pull_request`, `pull_request_review` and `pull_request_review_comment`
      (a run from a fork gets no secrets and a read-only token) and when the job names an environment in
      plain text, which may require a reviewer (as for OBAAF-GHA-001); high otherwise. Why the job is a
      release job, the steps that make it one (by the command or action that publishes, not where it
      publishes to: `docker push localhost:5000/t` and `docker push docker.io/org/app` are the same) and
      its environment are facts. A job nothing marks a
      release job, but that an outside event can start and that has `packages: write`, a secret whose
      name says it publishes, a step using an action under `publishing_actions`, or an environment name
      the checker cannot read, is reported at medium (low on pull request events only) as one that may
      release. Not followed: `id-token: write` on its own (it also signs and attests), publishing through
      a local reusable workflow counted for the job that calls it (plan slice 2d.4b3b; since slice 2d.4b2 a
      local composite action's steps are read as the job's; since slice 2d.4b1 the called workflow's own job is checked with its callers' events), commands not in the lists, and the
      repository's default token permissions. A command named in an `echo` is still taken for one that runs.
    fix: >-
      Start release workflows only from pushes to protected branches or tags, published releases, or
      manual dispatch by maintainers.

  - id: OBAAF-GHA-016
    title: Upload without a provenance check
    severity: high
    category: authority
    requirements: [G7.2, G5.2]
    agent_controls: [R8]
    supports: [FR6]
    why: >-
      Unless a check that stops it verifies the artifact's provenance, approvals and agent-run record, an
      unapproved or tampered artifact can be uploaded.
    description: >-
      A release job uploads or publishes artifacts without first verifying their provenance, approvals
      and agent-run records in an earlier step of the same job or in a job it depends on. A check counts
      only where its failure stops the upload (flagship slice 2d.2e). The reader accepts only what it
      can vouch for and stops at the first line it cannot: the check's line is that one command
      (optionally followed by `|| exit N` or `|| { ...; exit N; }`, or piped under pipefail), outside
      any compound command, in a `run` script in bash or sh with errexit on (GitHub's default `bash -e`
      on a runner labelled as Linux or macOS, `shell: bash`, `shell: sh`, a custom shell with only `-e`,
      `-u`, `-x` and `-o` options, or `set -e` before it), in a step that runs on success only; and
      every line before it is a simple command joined by `;`, `&&`, `||` or `|`, named by a plain word
      that cannot leave the script, run text as commands, or change what a name runs or how the shell
      behaves (no `exit`, `exec`, `eval`, `source`, `.`, `builtin`, `command`, `trap`, `set` but `-e`,
      `-u`, `-x`, `-o`, no assignment to `PATH` or `BASH_ENV`, no `&`, here-document, reserved word,
      backslash but at the end of a line, or expression whose value could hold shell syntax), or a plain
      `if ...; then`, `while ...; do`, `for NAME in ...; do`, `else`, `fi` or `done` line. No word
      before the check may name `PATH`, `BASH_CMDS`, `BASH_ENV` or the like, assign `PYTHONPATH`,
      `LD_PRELOAD` or another variable an interpreter reads at start, assign a variable bash evaluates
      as arithmetic (`RANDOM`, `OPTIND` and the like), or hold an expansion other than `$NAME`, a
      special parameter, a `$(...)` (a subshell), or `${NAME}` with nothing but `[@]`, `[*]`, a length,
      a default (`-`, `:-`, `+`, `:+`) or a pattern removed (`#`, `%`), since any other form (a
      subscript, an offset, `${!...}`, `$((`, `[[`) can evaluate a value as arithmetic that assigns; the
      check's own words are held to the same. No `env` of the step, its job or its workflow may name a
      variable that changes what the shell or the check's program runs (`PATH`, `HOME`, `ENV`,
      `SHELLOPTS`, `PS4`, `EXECIGNORE`, `GCONV_PATH`, `ACTIONS_ALLOW_UNSECURE_COMMANDS`, a `BASH...`,
      `LD_...` or `DYLD_...` name, or a `PYTHON...` one but six that load nothing), or a name written
      as an expression (flagship slice 2d.13). No earlier step of the job may set such a variable for
      the steps after it (the runner gives every later step what a step writes to `GITHUB_ENV`, and
      refuses only `NODE_OPTIONS`; `SHELLOPTS=noexec` makes bash read the check's step and run none of
      it). A bash or sh `run` script is read with the checker's bash lexer: a file command's variable
      (`GITHUB_ENV`, `GITHUB_PATH`, `GITHUB_OUTPUT`, `GITHUB_STATE`, `GITHUB_STEP_SUMMARY`; the runner
      keeps a step's files side by side, so any of their paths leads to `GITHUB_ENV`'s) may appear only
      as a plain redirection target (`$NAME`, `${NAME}`, `${NAME:-/dev/stdout}`), not of `exec`, or a
      file `tee` writes an output or the summary to with its own output sent to no file command; a write
      to `GITHUB_ENV` only as `echo NAME=value` or `printf 'NAME=%s\n' ...` redirected with `>>`, `>`,
      `&>>`, `&>`, `>|` or `>&` (not `<>`, which writes over what is there), with a plain word for a
      name that is not such a variable, no backslash, line break or `$'...'` (which dash, Ubuntu's sh,
      does not read), and no command substitution in the value that assigns such a variable; the script
      may not name `BASH_ENV`, `BASH_FUNC`, `addPath`, `exportVariable`, `set-env`, `add-path`,
      `_runner_file_commands` or `ACTIONS_ALLOW_UNSECURE_COMMANDS`, list names with `${!GITHUB_E*}`,
      or reach the runner's file contexts (`github.env`, `github.path`, the whole `github` context) in
      an expression. Anything else counts as setting such a variable, and so does any of these names in
      the step's `shell`, `env` or inputs, in a step that is not such a script (code in another
      language, an action), or in the workflow's or the job's `env`, `defaults` or `strategy`, which a
      step can run, and a container job's `env` when it names such a variable, or any `-e`, `--env` or
      `--env-file` in its `options` (what its image holds is not read). Names are searched with continued
      lines joined, `$'...'` decoded and quotes taken out. This is a reading of the workflow's text, not a guarantee: a name or a path a script
      assembles otherwise, and what a program or action an earlier step runs writes to the runner's
      files, are not read; nor is a line break that a variable, a file or a command's output puts in
      such a write's value at run time. Given `--help` or `--version` it is no
      check; with `--pre-approval` it is a provenance check. When a step names a check the reader cannot
      vouch for, the finding is kind `cannot-tell` (still high): write the check on a line of its own,
      early in a bash step. A check in PowerShell, cmd, Python, `actions/github-script`, a `docker://`
      step, a subshell, or on a runner that may be Windows does not count, and neither does a needed job
      with `continue-on-error`. Every upload step is checked, not only the first. Not read: what
      commands and actions earlier in the job, in this step or before it, do to the runner (replace the
      `obaaf` it runs, rewrite the policy it reads, export a variable through a file command the checker
      does not see); a `setup-obaaf` from a repository named `obaaf` is trusted to install the real
      `obaaf`; and whether the files verified are the files uploaded.
    fix: >-
      Add `obaaf verify release` as a step before the upload, in the same job or in a job the upload
      job needs, and let a failure stop the job: no `|| true`, `continue-on-error` or `if: always()`.
      A provenance-only check such as `gh attestation verify` is reported at medium, because it does
      not check approvals or agent records.

  - id: OBAAF-GHA-017
    title: Release builds without provenance
    severity: medium
    category: authority
    requirements: [G7.1]
    supports: [FR5]
    why: >-
      Without signed provenance, nobody who takes the release can check which workflow and commit produced it.
    description: >-
      A release workflow publishes artifacts but no job signs provenance for them. A provenance step
      counts only when it runs on success (no `continue-on-error` on the step or its job, no `if:` that
      may skip it, in a job some trigger reaches) and, for a command, when its failure stops the job as
      for OBAAF-GHA-016; an attestation of an SBOM only does not count (flagship slice 2d.2e).
      Provenance verified before the upload counts only when the check comes before every upload and
      stops it. An upload that is `npm publish --provenance` signs its own provenance and is not counted
      (flagship slice 2d.12), only in the form npm's documentation gives: the step's whole script is
      `npm publish` with only `--provenance`, `--access public` and `--tag NAME`, each read as written; the
      job holds `id-token: write`, runs only on GitHub-hosted runners, with no container and no services; an earlier
      `actions/setup-node` step sets Node.js 20 or later (npm 9.5.0 or later), and every earlier step is
      `actions/checkout`, such a setup-node step (npm's own registry, if any), or `npm ci`, `npm install`,
      `npm test` or `npm run NAME`, none with an `env`, an `if` or `continue-on-error`, with no default
      shell set and nothing run beside them; and no `env` of the step, the job or the workflow names
      `PATH`, `ENV`, `SHELLOPTS`, `BASHOPTS`, `PS4`, `EXECIGNORE`, a `BASH`, `LD_` or `NPM_CONFIG_`
      variable, or a `NODE_` one but `NODE_AUTH_TOKEN`. npm then signs before it sends the package, or
      sends nothing. `NPM_CONFIG_PROVENANCE`, `publishConfig`, `.npmrc`, trusted publishing, pnpm, Yarn and
      any other option or earlier step are not read, and the upload is counted. The repository's own files
      (`package.json`, `.npmrc`) and the package's scripts are not read.
      Not read: whether the provenance signed is for the files published, and whether a provenance job
      is tied to the publishing job by `needs`.
    fix: >-
      Add a separate attestation job that signs provenance and an OBAAF build record for every release
      artifact (see templates/github-actions/workflows/obaaf-release.yml), or verify provenance signed
      by another workflow before the upload (see obaaf-publish.yml). For an npm package, publish with
      npm 9.5.0 or later, as one step `npm publish --provenance --access public`, from a GitHub-hosted
      runner in a job with `id-token: write`.

  - id: OBAAF-GHA-018
    title: Signing key available to build steps
    severity: high
    category: authority
    requirements: [G5.1, G3.4]
    supports: [FR11]
    why: >-
      Every step in the job, third-party actions and build scripts included, can read any signing key it is given
      and sign with it.
    description: >-
      A workflow loads a signing key or certificate from a secret or a file, so any build step that runs in
      the job can read it. A job that can read every secret (a reference that is not one literal name, such as
      toJSON(secrets) or a computed index, or `secrets: inherit`) is reported as able to read any signing key
      stored for it, because which secrets exist is not in the workflow. The job's environment is part of a
      finding about its secrets, and so, in a workflow a job of the same repository calls by its path, is what
      each such caller passes for them (slice 2d.4b1). Not followed: a signing secret whose name matches none of the patterns in the
      detection data (names are guesses, and a key can be stored under any name); a signing command or action
      not in that data (commands are matched in `run` and `actions/github-script` scripts, with a line
      continued by a backslash, a PowerShell backtick or a cmd caret joined first); keys fetched at run time
      from a vault or a cloud key service; and, for a step reported for its command, what the command does:
      the finding names the step and not its text, so a harmless step that is accepted keeps its acceptance if
      it later loads a private key.
    fix: >-
      Sign through a hardware-backed or managed signing service (a cloud key service, an HSM-backed
      signing service, or platform-managed signing), so no build step can read the private key.

  - id: OBAAF-GHA-019
    title: Unsafe pull-request checkout explicitly allowed
    severity: high
    category: authority
    requirements: [G3.1, G9.1]
    supports: [FR3]
    why: >-
      This lets actions/checkout check out fork code, which in pull_request_target, workflow_run or another
      privileged workflow can use the base's token and secrets.
    description: >-
      actions/checkout is allowed to check out fork pull-request code with
      `allow-unsafe-pr-checkout: true`, which matters in a workflow that runs with the base repository's
      token and secrets on an event outsiders can cause (pull_request_target, workflow_run, issue_comment
      and the others the checker counts as privileged) and is reported whatever the trigger (flagship
      slice 3.2b's review). Any value but a plainly false one
      (`false`, `0`, `no`, or a constant expression of one) counts, an expression, an empty value and
      other text included: GitHub hands the action what an expression evaluates to, and how
      actions/checkout reads this input was not read. The workflow's triggers and the value are part of
      the finding.
    fix: >-
      Remove `allow-unsafe-pr-checkout` and build pull-request code in a pull_request workflow.

  - id: OBAAF-GHA-020
    title: Agent job without an egress restriction
    severity: low
    category: hygiene
    requirements: [G8.1]
    agent_controls: [R7]
    supports: [FR7]
    why: >-
      An agent steered by text it reads could send code, data or a secret it holds to any host, and nothing the
      checker can verify limits where it connects.
    description: >-
      Nothing the checker can verify limits the agent job's network access. The finding is reported
      for every agent job, with the one control that clears it, and it is cleared only when the
      checker read that control from the workflow and the repository and every condition that makes
      it hold. Two controls can be verified: GitHub's native egress firewall (the job runs on
      `ubuntu-24.04-firewall` and `.github/egress-firewall.yaml` sets `mode: enforce`), which covers
      the whole job from outside the runner; and OBAAF's egress action (`actions/egress`) at a commit
      OBAAF lists as released, with a plain allow-list with no public suffix at or under a name, the
      agent as its command (no other step and no `env` of the job is given a credential, and the job
      cannot request OIDC tokens) and no step after it.
      With either control, a possible artifact upload in the agent job makes otherwise verified
      `egress-enforced` credit "cannot tell", even for inspection-only uploads with no visible download
      (decision D-132). The same applies to `key-out-of-reach` under OBAAF's action. An independent "not
      met" verdict stands. A possible upload is a step that uses upload-artifact or upload-pages-artifact;
      one that uses any action but `actions/checkout`, `actions/download-artifact`, `actions/cache`, and
      OBAAF's egress action and Harden-Runner at listed commits (so an agent run through an action, or an
      `actions/setup-` action, is "cannot tell"); one that runs a script other than lines of `echo`, `pwd`,
      `true`, `:` or an agent's CLI with literal arguments in a POSIX shell the checker reads, or an install
      of an agent's CLI (so `npm ci` or `make` is "cannot tell"); every step of a job in a container; a step
      otherwise not counted, the egress action aside, when an `env` sets a variable that can make it run
      code the checker did not read (bash's, the loader's, Python's, `PATH`, `HOME`, `NODE_OPTIONS`,
      `NODE_PATH`, git's but its identity names, `XDG_CONFIG_HOME`, `TAR_OPTIONS`) or after a step that may
      change later steps; and, on the firewall only, an action after a script that is not plain `echo`
      lines, or one with a post step before it (`actions/checkout`), because the script, the agent's
      included, can change through `GITHUB_ENV` or `GITHUB_PATH` what those run, and actions hold the token
      that uploads artifacts (read from the runner's code, not run).
      Each credential
      given to the action's step is placed as the action reads its inputs: a model key named in
      `model-keys` goes to AWF's API proxy, whose provider host is then shown after the allow-list, and
      one named in `env` or written in `run` (also through `${{ env.KEY }}`) is passed to the command;
      a name the action refuses in a way the checker reads is "not met", and a credential it cannot
      place is "cannot tell". OBAAF lists no released commit
      of the action yet, and lists only commits at or after the last change flagship slice 2c.9 made to it. Harden-Runner is "cannot tell" at best, because the
      repository's tier is not in the workflow, and "not met" at a listed release before v2.16.0 or
      with `sudo` and containers left to the job; its version is read only from a commit OBAAF lists. The Agent Workflow Firewall run from a script is "cannot tell".
      A policy declared in `OBAAF_EGRESS`, or a control behind a condition, is reported too, so it is
      not mistaken for enforcement. A baseline entry that accepts "cannot tell" is for the workflow
      file as it stood, byte for byte. A cleared finding still says what the control does not stop.
      The firewall's policy file is read with the three keys its README describes (`mode`, `allow`,
      `no-default-urls`); any other key, or one of them in another letter case, is "cannot tell". Under
      OBAAF's action, a step that may follow it is taken for `actions/upload-artifact` only when its path
      is exactly that, with no `.`, `..` or empty part; a cache or an earlier step that may name the
      scratch directory (also by a pattern such as `/t[m]p`, or through `mktemp`), and an earlier step
      that may leave a process running (`&`, `nohup`, a container engine, a service or process manager,
      `ssh -f`, `sudo -b`, a script language's fork or spawn, as written in lower case), are "cannot tell"
      or "not met"; a value given outside the confined command whose name says it may be a credential
      (`vars.*_API_KEY`, a job's or step's output named like a token or a secret, an `env` name of a model
      key) is "cannot tell". The agent is looked for in the run script, a github-script script and the
      action's `run`, also with quotes and backslashes taken out, and in each command in any other input
      of an action, a `docker://` step's entrypoint and arguments, the step's `shell`, its `env` values
      and the default shell, whose first word (after assignments, wrappers such as `sudo -u user`, `npx`,
      `nice -n 10` or `timeout 5m`, and a shell's `-c`) is an agent's, the step's env values also put into
      its run script and read as commands; free text in an input or an env value is not a command, unless a line of it begins with an agent's
      name and the words its pattern needs, and in the steps of a local composite action a step uses
      (slice 2d.4a), which then runs outside the confined command. Not followed, and so never a reason the
      finding clears: an agent run by a package script (`npm run`), a called workflow, an action from another
      repository or a local action the checker cannot read through (named in a note); code an earlier action
      runs in its post step; an upload the agent's own command makes (with `sudo`, for one; not tested),
      transfers through caches or job outputs, variables other programs read for their own settings,
      and what another job or repository does with an artifact;
      whether a pinned commit of upload-artifact is on its repository's own branches; and whether a
      runner with the firewall's label has the firewall, which the label is taken to mean.
    fix: >-
      Run the agent job on GitHub's native egress firewall (`runs-on: ubuntu-24.04-firewall` with a
      `.github/egress-firewall.yaml` in `enforce` mode) where the repository can use it, or wrap the
      agent's command in OBAAF's egress action with the host names it needs, or use GitHub Agentic
      Workflows for a new agent workflow. Under OBAAF's action, give an Anthropic or OpenAI key in
      `model-keys` rather than passing a key to the command in `env`, so that the command never holds it. Ephemeral self-hosted runners behind a network policy also
      limit egress, but outside what the checker reads: record them with an ignore entry that names
      an owner, a reason and an expiry date.

  - id: OBAAF-GHA-021
    title: Agent output applied without verifying its record
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.3]
    agent_controls: [R4, R8]
    supports: [FR8, FR10]
    why: >-
      Another run's output is applied without both its agent-run record and its proposal being checked, so a
      tampered artifact could change the repository.
    description: >-
      A workflow started by another workflow's run downloads that run's output and can write to the
      repository, but neither it nor a job it needs both verifies the agent-run record and checks the
      proposal before applying it. Doing only one of the two is reported at medium. A download is
      another run's when `actions/download-artifact` is given a `run-id` other than `${{
      github.run_id }}` or a `repository`, whatever the value, or inputs the checker cannot read, or
      names `workflow_run` in any letter case; when another action whose name says it downloads
      artifacts is used (dawidd6's and its forks); and when the run script, a github-script script,
      the egress action's command or a `docker://` step's arguments, with continued lines joined and
      quotes taken out, run `gh run download` or name `archive_download_url` (flagship slice 2d.3:
      before, only an input that held `workflow_run` as written counted, and scripts as written).
      Other actions' inputs are not read. The checks count
      only before the first step that may apply (anything but a checkout, a download of artifacts, a
      GitHub setup action, or a `setup-obaaf` from a repository named `obaaf`, which is trusted because
      the templates may point at a fork), each where its failure stops the job as for OBAAF-GHA-016, in
      a step that runs nothing but the checks and commands that only read or prepare (`set`, `echo`,
      `read`, `jq`, `sha256sum` and the like, with no substitution); none count when a step that may
      apply runs after a failure (flagship slice 2d.2e). `gh attestation verify` is no longer a record
      check: it checks a signature, not the record. What the job may write is one of the finding's
      facts, so a baseline entry does not cover the same job given wider write access; it does cover
      other commands with the same access, and an `ignore` entry (rule, file, job) covers both.
    fix: >-
      Verify the agent-run record with `obaaf verify agent-run` and check the proposal with `obaaf
      proposal check --repo .` before applying it, in the job that applies it or in a job it needs
      whose failure stops it (no `if: always()`), and let a failure stop the job (see
      obaaf-agent-apply.yml).

  - id: OBAAF-GHA-022
    title: Agent output applied without an approval gate
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.1]
    agent_controls: [R4]
    supports: [FR8]
    why: >-
      Agent output is applied with write permissions, and no person other than the requester has to approve the
      change.
    description: >-
      A job applies agent output with write permissions, but neither it nor a job it needs references
      an environment, so no person other than the requester has to approve the change.
      An environment counts only when it is established as for OBAAF-GHA-014, on the job or on a job it
      needs that has no `continue-on-error` (flagship slice 2d.2e). Whether the environment has required
      reviewers is not read here; `obaaf audit` reads it.
    fix: >-
      Reference an environment with required reviewers and self-review prevention on the job that
      applies agent proposals, or on a job it needs without `if: always()`.

  - id: OBAAF-GHA-023
    title: Template placeholder left in a workflow
    severity: high
    category: authority
    requirements: []
    supports: [FR12]
    why: >-
      A template value left in place means the workflow will not run as intended, and a control the template was
      meant to give may be missing.
    description: >-
      The workflow still contains an OBAAF template placeholder (OBAAF_OWNER or an all-zero commit
      SHA), so it will not run as intended. Each placeholder in a value GitHub reads is one finding, named
      by where it is (the job, the step and the key): values are read as YAML gives them, so an escape or a
      line joined inside double quotes is the placeholder it spells, and a comment is not read.
      `OBAAF_OWNER` is found in any letter case, and the all-zero SHA as exactly 40 zeros after `@` or as
      the ref of a `uses`.
    fix: >-
      Replace the placeholders in the existing workflow with the OBAAF repository and its full commit SHA.
      For a new destination, install the pinned workflows with
      `obaaf templates install --dest DIR --obaaf-repo OWNER/obaaf --obaaf-sha SHA`.

  - id: OBAAF-GHA-024
    title: Protected secret used outside its environment
    severity: high
    category: authority
    requirements: [G3.4, G9.1]
    supports: [FR3, FR12]
    why: >-
      Anyone with write access can push a workflow that reads repository secrets, so a secret worth protecting has
      to stay in its environment.
    description: >-
      The checker configuration lists the secret under protected_secrets, but a job references it without
      declaring the environment that holds it. Anyone with write access can read every repository secret by
      pushing a branch with a new workflow, so a secret worth protecting must live only in an environment
      whose deployment branches are limited to the default branch (or that requires reviewers), and every job
      that uses it must declare that environment. A job that can take every secret counts as using each
      protected secret: that is any use of the secrets context other than one literal name, such as
      toJSON(secrets), secrets.* or secrets[...] with a computed index. A job that calls a reusable workflow
      cannot declare an environment, so passing it a protected secret is reported, by name or with secrets:
      inherit: either passes the secret's repository or organization copy wherever one exists. Every matching
      entry applies, so a looser pattern cannot relax a stricter one, and two entries for the same secret name
      in different case are a configuration error. Environment names are compared without regard to the case
      of the letters A to Z only. An environment named by an expression, one written as a number or true or
      false that could be the named environment in another reader's spelling, and one that differs from the
      named environment only in the case of letters outside ASCII cannot be confirmed and are reported at
      medium severity (an expression is never evaluated, even a constant one). A blank or missing name counts
      as no environment, and a list or a mapping as a name that is not the one wanted. The checker cannot see
      where the secret is stored or the environment's branch rule; check both in the repository settings, or
      with `obaaf audit`.
    fix: >-
      Keep the secret only in the environment named in protected_secrets, limit that environment's
      deployment branches to the default branch, delete any repository or organization copy, and add
      `environment: <name>` to every job that uses it (see docs/github-settings.md#secrets).

  - id: OBAAF-GHA-025
    title: Agent tool installed at a version that can change
    severity: high
    category: hygiene
    requirements: [G2.1]
    agent_controls: [R6]
    supports: [FR10, FR12]
    why: >-
      Whoever controls the download or the registry entry chooses the code that then runs with everything the agent
      job holds.
    description: >-
      An agent job installs or runs a tool at a version it does not fix (flagship slice 2d.5a). Two cases.
      A script downloaded while the job runs is run as code, whatever tool it installs: a download (`curl`,
      `wget`, `irm`, `iwr`, `Invoke-WebRequest`, `Invoke-RestMethod`, `aria2c`) piped to a program that runs
      its input (a shell, PowerShell, `iex`, Python, Node, Perl, Ruby and others, after `sudo`, `env`, `exec`
      and the like, or a program named by a variable; `tee` passes it on; a program given a script file
      reads the download as data), or a download inside `$(...)`, backticks, `<(...)`, `(...)` or after `<<<`
      where what stands before it on the line evaluates or interprets (`eval`, `source`, `.`, `iex`,
      `bash -c`). The checker cannot tell what a downloaded script fetches, and in an agent job it runs with
      the job's keys and token. Or an agent CLI the catalogue names (`agent_packages` in the detection data)
      is installed or run by a package manager (npm, pnpm, yarn, bun, npx, pip, pipx, uv, uvx) without an
      exact version, at a range, a tag or a version set at run time, is updated (in the same step or a later
      one), or its own install script (`agent_install_urls`) is downloaded and run. Read in every script a
      step runs, as OBAAF-GHA-010 reads them, local composite actions' steps included, and a `docker://`
      step's entrypoint and args as one command line; expressions are put in as the runner puts them in
      (`${{ env.NAME }}` as the literal the env sets, any other as a value set at run time); whole-line
      comments are dropped and continued lines joined (a line ending in `|` too); a variable the script, the
      step, the job or the workflow sets to one literal is put in, unless a scope nearer the step is written
      as one expression, or an earlier step writes `GITHUB_ENV`, which makes the job's and the workflow's
      values unknown. Quotes are not read, in either case: a download and a program that runs its input on
      one line are taken together, and a package manager's command written in text (an `echo`, a `grep`, a
      message, a heredoc) is read as one, so either is reported as if it ran; a quoted `;`, `&` or `|`
      does not split a command. The package-manager case uses the same reader as
      OBAAF-JEN-008. A step whose scripts are over 400,000 characters with their variables put in is
      medium: the checker cannot read them. Only agent jobs are read: the same pattern in another job is
      poutine's to report. Not followed: a script downloaded to a file and run in a later command, except
      an agent's own install script; what the downloaded script itself installs; a package named at run
      time; an agent the catalogue does not name, installed by a package manager; installers other than
      those listed (`brew`, `volta`, `deno`, an agent CLI's own `install` or `--upgrade`), and an install
      from a git URL; and an agent action's own input that chooses its CLI's version.
    fix: >-
      Install the agent CLI from its registry at an exact version (for example `npm install -g
      @anthropic-ai/claude-code@1.2.3`, or `pip install aider-chat==0.86.1`), better with its hash from a
      lockfile, and move the version through reviewed changes. If the tool ships only an install script,
      download the release it would install, at a fixed version, check its checksum, and install that instead.

  - id: OBAAF-GHA-026
    title: Agent given a setting or option its own documentation warns about
    severity: high
    category: authority
    requirements: []
    agent_controls: [R2, R7]
    supports: [FR12]
    why: >-
      Its makers warn this lets outsiders prompt the agent, lets it act without approval, exposes the job's
      secrets, or opens a way to other jobs or clients.
    description: >-
      A step gives an agent action a value for an input, or runs an agent's command-line tool with an option,
      that the tool's own documentation warns about (flagship slices 2d.5c1, 2d.5c2a and 2d.5c2b). The values and
      options are data: each agent tool's entry in the detection data lists them under `settings` and
      `flags`, each with the documentation's words, quoted, and the file, commit and lines they were read
      from, and a finding prints both. Inputs, read on 2026-11-19: `openai/codex-action` with
      `safety-strategy: unsafe` (high) or `read-only` (medium), and `allow-users: "*"` (high);
      `anthropics/claude-code-action` with `allowed_non_write_users: "*"` (high) or any other value that is
      not empty (medium), `allowed_bots: "*"` (medium) and `show_full_output: true` (medium), and
      `anthropics/claude-code-base-action` with `show_full_output: true` (medium); read on 2026-11-19 for
      slice 2d.5c2b, `google-github-actions/run-gemini-cli` with `gemini_debug: true` and
      `QwenLM/qwen-code-action` with `qwen_debug: true` (medium: each action warns that debug output could
      reveal sensitive information; both read the input through `fromJSON`, so a value is read as the
      runner's JSON reader reads it: its first token, a string in double or single quotes (`'"true"'`,
      `"'true'"`) or a word up to a separator (`true // off`), and one that starts with a comment is "cannot
      tell"), and `OpenHands/extensions/plugins/pr-review` with `enable-uv-cache:
      true` or `auto` (medium: the action warns that a shared cache can carry a poisoned package into more
      privileged workflows, and `auto` turns setup-uv's cache on on GitHub-hosted runners). A value is compared
      with the white space either Python or JavaScript trims taken off its ends, U+FEFF included, and in any
      letter case, which is wider than some of the actions read it; the input's name is read in any case of
      A to Z, as GitHub does; an action at a path under one of these is read as it. A value the checker
      cannot read is case `computed`, "cannot tell", at most medium: an expression, a list, a mapping, a
      value with a control, format, separator, private-use or unassigned character left inside it other
      than a space, a tab, a carriage return or a line feed (a NUL ends an environment variable), and a
      `with:` that is neither a mapping nor empty (inputs written as one expression, `with: ${{
      fromJSON(...) }}`), which is "cannot tell" for every setting and option of the action. Options, read
      on 2026-11-19: Claude Code's `--dangerously-skip-permissions`, `--allow-dangerously-skip-permissions`,
      `--permission-mode bypassPermissions` (high; claude-code-action's own test for "turns off permission
      checks" matches these three), Codex's
      `--dangerously-bypass-approvals-and-sandbox` and its alias `--yolo` (high) and
      `--dangerously-bypass-hook-trust` (medium), and Gemini CLI's `--yolo`, `-y`, `--y`, `--approval-mode
      yolo` and `--approvalMode yolo` (medium: the same documentation says these turn its sandbox on by
      default); read on 2026-11-19 for slice 2d.5c2b, Qwen Code's `--yolo`, `-y`, `--y`, `--approval-mode
      yolo` and `--approvalMode yolo` (high: its documentation says `--yolo` turns on no sandbox), Kilo
      Code's `--auto` and the hidden `--yolo`, `--dangerously-skip-permissions` and
      `--dangerouslySkipPermissions`, which skip the checks `--auto` answers (high), Cline's `--yolo`, `-y`,
      `--zen`, `-z` and `--auto-approve` or `--autoapprove` with any value but `false` (high; the last ones do
      what `--yolo` does, and Cline's own code puts `true` after a bare one), GitHub Copilot
      CLI's `--allow-all-tools`, `--allow-all` and `--yolo` (high), OpenHands' `--always-approve`, `--yolo`
      and `--headless` and any beginning of them (`--always`, `--yol`, `--head`), as Python's argparse
      takes them (high), Qwen Code's `--insecure`, Copilot CLI's `--show-secrets`, `--trust-folder` and
      `--share-gist` and `--share`, Continue's `cn --auto`, OpenCode's `--hostname 0.0.0.0` and goose's
      `--dangerously-unauthenticated` (medium), and PR-Agent's `--config-branch` given `$GITHUB_HEAD_REF`, a
      value its documentation names (high), where a value the checker cannot read, such as the `${{
      github.head_ref }}` it also names, is "cannot tell" (medium) and a branch written out is not reported. AWS's Copilot CLI is also `copilot`
      and pressly's migration tool is also `goose`: for these two, a command the checker cannot read is not
      "cannot tell" where every place the step names the program is followed by that other tool's own
      commands, options or database drivers (`copilot svc deploy`, `goose postgres "$DB" up`). A program
      after a package runner (`uvx`, `uv ... run`, with uv's options anywhere among those words, `pipx run`)
      may carry its version or extras (`uvx openhands@latest`, `uv tool run openhands==1.2`, `uvx
      openhands[all]`). Case `option`: in `claude_args` of `anthropics/claude-code-action` and
      `anthropics/claude-code-base-action` (a line that starts with `#` is left out, as the action leaves it
      out; a word that would be a warned option once a `$NAME` the action may put in as nothing is taken
      out is "cannot tell") and in `codex-args` of `openai/codex-action` (read as a JSON array when it
      starts with `[`, as the action reads it); white space is what JavaScript takes for it, U+FEFF
      included, and another control, format or separator character is "cannot tell". Case
      `command-option`: wherever a step runs the tool's program or package (`claude`, `npx
      @anthropic-ai/claude-code`, `claude.cmd`, a path to one, the package's `cli.js` under `node`), where a
      command starts (after `sudo`, `env`, `timeout`, `xargs`, `find -exec`, `npx`, `yarn` and the like) or
      as an argument of any command whose arguments are not data (`docker run`, `cross-env`, `ssh`; data:
      `echo`, `grep`, `git`, `find`, a package installer, `docker build`), a quoted argument of such a
      command that names the tool read again as a command line, in its `run`, its `shell`, a
      github-script script, the command OBAAF's egress action runs, another input, `env` value or
      `docker://` command line that starts with the program, and an input named like a command (`command`,
      `args`) that names the tool. A bash or sh script is read twice, the two added together: as bash splits
      it (quotes, backslashes, `$'...'` and `$"..."` as bash reads them; heredocs as data unless a shell
      reads them; a variable put in where its value is known: an `env` value that is plain text, from the
      step, else the job, else the workflow, unless the script sets the name or an earlier step writes
      `GITHUB_ENV` or calls `exportVariable` (then only the step's own `env` is read), or a name the script
      sets once to plain text, and none at all where the script runs `eval`, `source`, a nameref, or
      `declare`, `export`, `printf -v` or `read` with a quoted or computed name, which can set any name;
      command substitutions, `bash -c`, `eval`, a `git` setting whose value names the tool (`alias.r=!cmd`,
      `diff.external`, given with `-c`, `git config` or `GIT_CONFIG_VALUE_n`),
      `env -S`, `su -c`, `script -c`, `flock -c`, `watch`, `npx -c`, aliases, interpreters given code and
      text a shell reads from a pipe, heredoc or here-string read again), and the widest way (comments and
      data heredocs out, quotes and backslashes removed, brackets and commas made spaces, cut where a shell
      starts a command), so an option in a prompt's text or in a JavaScript or Python argument list is read
      as given. A step in another shell (pwsh is the default on a Windows runner), a github-script script
      and code given to an interpreter (`python3 -c`, `perl -e`, a heredoc fed to `node`) are read the
      widest way, the program found anywhere in them, and by their tokens or words (below). An option is matched in any letter case, as `--name=value` and `--name
      value`, and a one-letter option inside a group (`-yp`); nothing after a word `--` is an option, and
      `--name=false` is not a match; a `--` right after an option may be its value and does not end them. "Cannot tell", at most medium, is case `command-computed`, in a step
      that names the tool: a word of the program's command with a variable or substitution outside quotes,
      `"$@"`, `"${NAME[@]}"`, an unquoted glob or a `${{ }}` expression; a quoted word that could start a
      warned option (`"--dangerously-$X"`, `"$EMPTY"--yolo`, `"${F:---yolo}"`); a warned option that takes a
      value given one the checker cannot read; the program run by `xargs` or `parallel`; a command the
      checker cannot name (`$C`, `"$(command -v claude)"`, `{claude,}`) or a new name made for a program
      (`alias`, `hash`, `ln`, `cp`); `IFS` set; `eval` or a shell given text the checker cannot read; a
      script file written in the step and run; text it cannot split; nesting deeper than four levels; in
      PowerShell, a variable (not `$env:NAME`, always one string), group or splat outside quotes among the
      program's words (`claude @a`, `claude $flags`), in cmd a `%VAR%` or `!VAR!` anywhere among them (cmd
      puts its text in before it reads quotes), or a command it cannot name (`& $exe`, `%C%`), commands inside
      `{ }` blocks included; and in code in another
      language (code given to `python3 -c`, `node -e`, `perl -e`, `ruby -e`, `php -r`, awk or a heredoc, a
      github-script script, a step whose `shell` is python, node, ruby, perl or php), read by its tokens
      (flagship slice 2d.5c2c): an argument list with a splat or spread, joined with another, held in a name
      the code changes in a way it cannot read (a change that adds literals or one value, `cmd.append(x)`, is
      read), or given as a value to a call that takes the list (`exec.exec('claude', flags)`, `os.execvp`),
      or with Node's `{shell: true}`; a command line in a string given to a call that runs one (`os.system`, `execSync`,
      backticks, `%x`, `qx`, `shell_exec`, awk's `system` and pipes) and joined with or holding a value
      (`"claude " + f`, `f"claude {f}"`, `"claude #{f}"`, `"claude $f"`, `"claude %s" % f`), which can end the
      string's own quotes; a list joined into such a string; a value pasted into the code before it runs (a
      `${{ }}` expression, a shell expansion in an unquoted heredoc); a value whose known start or end could
      be a warned option (`"--" + x`, `x + "-skip-permissions"`) or that holds one as a literal
      (`env.get("F", "--yolo")`); code the checker cannot split. Literal pieces are joined and matched
      (`"--" + "yolo"`), a name given a literal is that literal, and one value in one place of a list
      (`["claude", "-p", prompt]`) is one word that is not one of these options, as a quoted variable is in
      bash. Read
      in the job's steps and in the steps of the local composite actions it uses. A value only another
      scanner calls dangerous is not reported. Not read: a quoted word that starts with a variable or a
      substitution (`claude -p "$PROMPT"`) is taken for one word that is not one of these options, though
      the tool's own parser may read a value that starts with `-` as an option (#254), and so is one value
      in one place of an argument list in code in another language; in such code, a program name given by
      escapes, pieces or a path built at run time, a list held in a mapping or an attribute of another
      object, Perl's `exec { ... }`, code written into another process's input, and AppleScript and Tcl
      beyond the widest reading; Codex's `--sandbox
      danger-full-access` and the action's `sandbox` input (neither the CLI's files nor the action's give a
      sentence of warning for them) and Codex's `-c` overrides; settings given to `--settings` (a file or
      JSON), claude-code-action's `settings` and codex-action's `codex-home`; an environment variable the
      tool reads; a program name a step builds at run time (from braces, globs, `printf`, another step's
      `GITHUB_ENV`, `GITHUB_PATH` or outputs, `vars`, or a file), as the agent lane does not see it either;
      `python -m` and a repository script a step runs; `BASH_ENV`; a local Docker or JavaScript action; a
      warned mode a tool runs in by default, which no option names (Cline's one-shot runs, and
      run-gemini-cli, gemini-cli-action and qwen-code-action, which run their CLI with `--yolo` themselves;
      #265); a program's name given as an argument of a command that is not on the data list is read as
      the program, so `ollama run qwen $PROMPT` or `--agent openhands $ARGS` is "cannot tell" (#264);
      options described in a tool's files with no sentence of warning (OpenCode's `--auto` and its hidden
      `--yolo` and `--dangerously-skip-permissions`, Aider's `--yes-always`, Qwen Code's `--approval-mode
      auto`, the CLI's default, and `auto-edit`, Copilot CLI's `--allow-all-paths` and `--allow-all-urls`
      alone); Copilot CLI's other spellings (`--allowAllTools`, a beginning of an option), as its parser is
      not in its public files; GitHub Models' action, which runs Copilot CLI with options built from its
      inputs; tools whose options are documented only on a web page, not in a file at a commit (Kiro CLI,
      Amp), and CodeRabbit's reviewer action, whose repository could not be read; the eleven entries with
      nothing to report say what was read in `no_warnings`; claude-code-action's
      `display_report` (its
      warning is about the agent's text in the step summary), a model key written into a workflow in clear
      (a secret-scanning tool's case), and `ACTIONS_STEP_DEBUG`, which turns on full output; an agent action
      used inside another repository's composite action or reusable workflow; and a `uses:` with an empty
      path segment, a leading `/` or a backslash, which the checker does not match to the action at all
      (#245).
    fix: >-
      Remove the input or the option, so the tool uses its default, or set the value the documentation
      recommends: for `openai/codex-action`, `safety-strategy: drop-sudo` (the default) or
      `unprivileged-user`, and no `allow-users` or only named users there (the documentation asks for
      caution even then); for `anthropics/claude-code-action`, named bots in `allowed_bots`, no
      `allowed_non_write_users` except in a workflow whose `permissions` are as narrow as the documentation
      asks, and `show_full_output` only while debugging, in a repository whose logs nobody else can read;
      for `gemini_debug` and `qwen_debug`, the same; for OpenHands' `enable-uv-cache`, `false` (the
      default) unless the runner is one only this workflow uses; for OpenHands' `--headless`, run it only
      in a sandbox, as for the other options.
      For an option: drop it and allow the tools the job needs by name instead (Claude Code's
      `--allowedTools`, Codex's sandbox and permission profiles), or run the agent where the documentation
      says the option is meant for, a sandbox outside the agent's reach. Where the checker cannot tell, write
      the options out in the step.

  # The checker's own configuration. A declaration that tells the checker which rules a job gets
  # is a control like any other: one that does nothing is reported, never dropped without a word.
  - id: OBAAF-CFG-001
    title: Lane declaration that does nothing
    severity: high
    category: authority
    requirements: []
    supports: [FR12]
    why: >-
      The job, stage or file does not get the lane rules the declaration was meant to add, so unless it is in that
      lane anyway, findings can be missing unseen.
    description: >-
      A lane declaration puts a job in a lane (untrusted, agent, effect, release) so that the lane's
      rules apply to it. This one changes nothing, so the job, stage or file it was written for gets
      none of the rules it was meant to add, and every other finding on that job can be missing
      without the report showing it. The cases: OBAAF_LANE, in a job's env, the workflow's env or a
      Jenkinsfile, set to a value that is not a lane (a misspelling such as `agnet`, an expression,
      an empty value, or in a Jenkinsfile a value computed when the build runs; in a Jenkinsfile,
      where the declaration reaches at least one step); the variable under
      another spelling in a job's env or the workflow's env (`obaaf_lane`, `OBAAF-LANE`); OBAAF_LANE
      set in a step's env, a container's or a service's, where the checker does not read it; and an
      entry under `lanes:` in the checker configuration whose value is not a lane, or that names a
      job or Jenkins stage its file does not have, or a file that is not there. The finding is
      reported where the declaration is written: in the workflow or Jenkinsfile, or in the checker
      configuration. It is high because the checker cannot know which findings are missing: the
      agent lane alone has high-severity rules. It is low when nothing can be missing: the declaration
      names `trusted`, which adds no rule even where it is read; it is written where it is not read,
      or under another spelling, in a job that is in the lane it names anyway; or it is an entry for
      a Jenkins stage that is not there and names `untrusted` or `effect`, which change nothing on a
      stage. An entry for a file outside the run (another file when one file is checked, a
      Jenkinsfile when only workflows are checked) is not looked at. An ignore entry cannot accept
      this finding, because it would accept every such declaration in the file it names; a baseline
      entry, which names the one declaration and its value, can. Another spelling is any name that
      looks like OBAAF_LANE, or is one letter from it, once case, separators, invisible characters and
      look-alike letters from other scripts are set aside (`OBAAF.LANE`, `OBAAF_LANES`, a Cyrillic `О`);
      it is reported in any env, in a Jenkinsfile's environment block or withEnv too. The variable in
      any spelling is also reported where nothing reads it as a declaration (kind `elsewhere`): a key of
      a step's `with`, of the matrix or of a called workflow's `with`, an `env` written as one expression
      that names it, a script that writes it to `GITHUB_ENV`, and in a Jenkinsfile an assignment to
      `env.OBAAF_LANE` in a script (`jenkins-scripted`). A name that only holds it (`MY_OBAAF_LANE`), and
      a definition under the name (an input of `workflow_call`, written as a mapping), are not
      declarations. Not followed: a lane variable set by a command the checker does not read as
      writing `GITHUB_ENV`, or written in a file a step sources.
    fix: >-
      Correct the declaration or delete it. The value is one of untrusted, agent, effect, release or
      trusted, and the variable is spelled OBAAF_LANE. In a workflow it belongs in the job's env or
      the workflow's env; in a Jenkinsfile, in an environment block or a withEnv around the steps. A
      `lanes:` entry names a job by the workflow's path from the repository root and the job's id
      (`.github/workflows/ci.yml#build`), as a lane listing of the whole repository prints it, and a
      Jenkinsfile's stage by the file and the stage's own name (`Jenkinsfile#Ship`). Run
      `obaaf check . --lanes` afterwards and confirm the lane (see
      docs/checker-configuration.md#a-declaration-that-does-nothing).

  # Jenkins (advisory). These rules read a Jenkinsfile and the files it names; controller
  # configuration is reported as coverage unknowns, never as a pass. See docs/jenkins.md.
  - id: OBAAF-JEN-001
    title: Credentials available to change-request code or an AI agent
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.4, G8.1, G9.1]
    agent_controls: [R2, R3]
    supports: [FR3, FR7]
    why: >-
      Any change-request code these steps run can read the credential, and an AI agent among them can be told to
      disclose it.
    description: >-
      A credential binding (withCredentials, an environment credentials() entry, sshagent, or a wrapper
      step that takes a credentialsId) surrounds build steps that a change request can reach, or an AI
      agent. The steps run the change's own code, so its author can read the credential even when
      Jenkins takes the Jenkinsfile from a trusted branch; an agent can be told to disclose it. Stages
      that run only for change requests and agent stages are high; stages that nothing in the
      Jenkinsfile keeps away from change requests are medium, because whether the job builds pull
      requests is job configuration. Conditions the checker cannot evaluate are reported as unknown.
    fix: >-
      Bind credentials only in stages that change requests cannot reach (for example `when { branch
      'main' }` or `when { not { changeRequest() } }`, and better in a separate job that builds only
      protected branches), and never around an agent. Keep the model credential in an inference proxy
      outside the agent's workload.

  - id: OBAAF-JEN-002
    title: Build steps on the controller or on agents shared with privileged work
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.1, G3.2]
    agent_controls: [R7]
    supports: [FR3, FR4]
    why: >-
      Build code on the controller can read the keys that decrypt every stored credential, and on a shared agent
      it can tamper with later privileged builds.
    description: >-
      A stage runs on the built-in node (label `built-in` or `master`, or a label expression that can
      select it), where build code can read $JENKINS_HOME and the keys that decrypt every stored
      credential; or one persistent agent label serves both work that change requests or an AI agent
      can steer and a stage that holds credentials or publishes, so that work can tamper with the later
      privileged build. Steps on the controller
      that change requests or an agent can steer are high; others are medium. `agent any` and computed
      labels are reported as unknown, because which agents exist is controller configuration.
    fix: >-
      Set the built-in node's executors to 0 and run builds on agents. Give change-request and agent
      work ephemeral agents (a Kubernetes pod or a fresh container per build) and keep persistent
      agents with privileged labels for protected-branch and release work only.

  - id: OBAAF-JEN-003
    title: AI agent stage can push, start jobs or publish
    severity: high
    category: authority
    remediation: architecture
    platform: jenkins
    requirements: [G8.1]
    agent_controls: [R2, R4]
    supports: [FR8]
    why: >-
      What the agent wrote or was told reaches a push, another job or a release without review.
    description: >-
      A step pushes to the repository, starts another job with the build step, or publishes, after an
      AI agent ran in the same workspace: the same stage, another stage under the same agent, a post
      block, a docker agent with reuseNode, ws() on the same node, or a stash or unarchive of what was
      stashed or archived after the agent. What the agent wrote or was told then reaches the effect
      without review. An effect that runs before the agent in a workspace Jenkins keeps between builds
      is medium: what the agent leaves there is in place for it next build. Separate allocations that
      may be the same machine are reported as unknown. Builds started with the build step run as
      SYSTEM unless build authorization is configured, so job permissions shown to people do not limit
      them.
    fix: >-
      Keep the agent stage inert: let it write a proposal (a patch or bundle) as an artifact, and apply
      it in a separate job that verifies the agent-run record and the proposal (`obaaf verify
      agent-run`, `obaaf proposal check`) behind an input step with a named submitter.

  - id: OBAAF-JEN-004
    title: Pipeline code from an unapproved revision
    severity: high
    category: authority
    platform: jenkins
    requirements: [G1.2, G3.1, G8.2]
    agent_controls: [R5]
    supports: [FR9]
    why: >-
      Code the Jenkinsfile's reviewers never approved runs in the pipeline, outside the Groovy sandbox when it comes
      from a trusted global library.
    description: >-
      The pipeline loads code that the Jenkinsfile's reviewers did not approve: a shared library at a
      version taken from a branch name, parameter, workspace file or other run-time value (a trusted
      global library runs outside the Groovy sandbox), or fetched by a retriever whose remote is a
      run-time value or the build's own checkout (`legacySCM(scm)`); Groovy loaded from the workspace with
      `load`, evaluated from text read at run time (`evaluate`, `Eval`, a GroovyShell, GroovyClassLoader,
      GroovyScriptEngine or JSR-223 engine, also through the script passed as a variable, a method
      pointer or an import alias), or Job DSL run from workspace files, in a stage that change requests
      reach; or Groovy built from a parameter or a change's text, on any branch. For a change request the
      workspace holds the change's own files. Literal text, `readTrusted` and `libraryResource` are not
      findings. A `load` or `evaluate` on a receiver that may be something else (`props.load(...)`) is
      unknown. Library trust, version overrides and Replay permission are controller configuration and
      are reported as unknown.
    fix: >-
      Pin libraries to a reviewed commit (`@Library('lib@<40-character SHA>')`) and disallow version
      overrides for privileged jobs. Read pipeline code with `readTrusted` and `evaluate`, or move it
      into a pinned library, instead of `load` from the workspace. Restrict Run/Replay on jobs that
      hold credentials.

  - id: OBAAF-JEN-005
    title: Release without an approval by a named person
    severity: medium
    category: authority
    platform: jenkins
    requirements: [G6.2]
    agent_controls: [R4]
    supports: [FR6]
    why: >-
      Any user with Build permission, the person who started the build included, can approve the release, or
      nobody is asked at all.
    description: >-
      An input step sets no submitter (or a blank or `null` one, or the group `authenticated`), so any
      user with Build permission on the job can approve it, including the person who started the build;
      or the pipeline publishes with no input step that stops the publish until someone approves: one
      before it on every path, whose abort stops the build, not caught, skipped by a condition, in
      another parallel branch, or in a failure path. Whether approvers are independent of the requester,
      and whether an approval is bound to the exact artifacts, is reported as unknown.
    fix: >-
      Put an input step with `submitter` set to a release group before the publish, keep the requester
      out of that group, and bind the approval to artifact digests (for example with `obaaf verify
      release`).

  - id: OBAAF-JEN-006
    title: Build container or pod can reach the host
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.2]
    agent_controls: [R7]
    supports: [FR4, FR7]
    why: >-
      Code in the container can reach the host and the other builds on it, and a privileged container or the Docker
      socket hands it the host.
    description: >-
      A docker or Kubernetes agent runs privileged, mounts the Docker socket or host paths, shares the
      host's network, PID or IPC namespace, or adds powerful capabilities. Code in the container can
      then reach the host and other builds on it, and a privileged container or the Docker socket gives
      it the host. Agents that run change-request code or an AI agent
      are high; others are medium. Pod templates defined on the controller (inheritFrom) and pod files
      outside the checkout are reported as unknown.
    fix: >-
      Remove the privileged settings. Build images with a rootless builder (for example BuildKit
      rootless or Kaniko) instead of the host's Docker socket, and run untrusted and agent work in pods
      without host mounts, host namespaces or extra capabilities, enforced by an admission policy.

  - id: OBAAF-JEN-007
    title: AI agent stage without an egress restriction
    severity: low
    category: hygiene
    platform: jenkins
    requirements: [G3.3, G8.1]
    agent_controls: [R7]
    supports: [FR7]
    why: >-
      An agent steered by text it reads could send code or credentials to any host, and Jenkins has no egress
      control of its own.
    description: >-
      Nothing in the Jenkinsfile limits the network access of a stage that runs an AI agent, and Jenkins
      has no egress control of its own. A policy declared in `OBAAF_EGRESS` is reported too, so a
      declaration is not mistaken for enforcement. An agent whose shell steps run in a container
      started with exactly one network, `none`, and nothing that reaches the host passes; with a host
      path mounted into that container the finding stays, because a socket there is a way out.
    fix: >-
      Run the agent in a Kubernetes pod in a namespace whose NetworkPolicy allows only the inference
      proxy, with no route to the controller, cloud metadata or the cluster API. When the network
      enforces it outside the Jenkinsfile, record that with an expiring ignore entry.

  - id: OBAAF-JEN-008
    title: Image, library or agent CLI not pinned
    severity: medium
    category: hygiene
    platform: jenkins
    requirements: [G2.1]
    agent_controls: [R6]
    supports: [FR10, FR12]
    why: >-
      Whoever controls the tag, branch or registry entry chooses the code that runs in the pipeline.
    description: >-
      A container image is referenced by a tag instead of a sha256 digest (a docker or Kubernetes agent,
      a pod spec read as YAML, a containerTemplate, docker.image or withDockerContainer, the FROM, COPY
      --from and RUN --mount lines of a Dockerfile a dockerfile agent, docker.build or a script's docker
      build reads, or docker, podman or nerdctl run, create or pull in a script), a shared library is
      loaded at its default version or at a branch or tag, or an agent CLI is installed at a version that
      can move: no version, a range, a tag or a version set at run time, a downloaded install script, an
      update command, or a package.json or requirements file the script installs from, in the folder it
      runs in. Whoever controls the tag, branch or registry entry then chooses the code that runs.
      Variables the file or the script sets to one literal are put in; anything else is unknown. An
      image the job builds itself is not a registry reference. Images used by agent or publishing stages
      are high, stages with credentials medium, others low; libraries are high when any stage runs an
      agent or publishes, else medium; agent CLI installs are high. Not read: shell branches (a pushd in
      each arm of an if), a Dockerfile behind `docker build -` and agents the catalogue does not name.
    fix: >-
      Pin images to `@sha256:` digests, libraries to a full commit SHA, and agent CLIs to an exact
      version (for example `npm install -g @anthropic-ai/claude-code@1.2.3`), and update the pins
      through reviewed changes.

  - id: OBAAF-JEN-009
    title: Untrusted text interpolated into a command
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.1, G8.1]
    agent_controls: [R1]
    supports: [FR3]
    why: >-
      The value is built into a command or Groovy code before it runs, or passed to another job, so whoever writes
      it may be able to run commands there.
    description: >-
      A sh, bat or powershell step builds its script with Groovy interpolation (`"${...}"`) or
      concatenation of text that others control: a change request's title, source branch or author
      name (high), build parameters (medium), or branch and tag names (low), directly or through a
      variable assigned from them, or commit text read with git log. The value becomes part of the
      command before the shell runs. Parameters passed to other jobs from such values are reported at
      medium.
    fix: >-
      Use single-quoted Groovy strings and let the shell expand the value: `sh 'echo "$CHANGE_TITLE"'`,
      with the value in the environment (it already is for CHANGE_* and parameters, or set it with
      withEnv).

  - id: OBAAF-JEN-010
    title: Artifact from another build used by a moving reference
    severity: high
    category: authority
    platform: jenkins
    requirements: [G4.2, G7.2]
    supports: [FR6]
    why: >-
      A selector that moves can pick up another build's output, so what is published may not be what was built and
      checked.
    description: >-
      A pipeline that publishes copies artifacts from another job by a reference that moves (the default
      last successful build, last completed, latest saved, a permalink, a workspace, a `specific` build
      named by anything but its number, an `upstream` that falls back to the last successful build, or a
      Jenkins URL such as `job/b/lastSuccessfulBuild/artifact/`), and no `obaaf verify release`, run as a
      command whose failure stops the build, comes after the copy and before the publish. Another digest
      or signature check, a reference the file computes, and a copy in a form the checker does not read
      are "cannot tell". High when an unchecked publish after the copy is in the copy's own stage.
    fix: >-
      Copy from a specific build number recorded with the approval, and check the artifacts' sha256
      digests against the signed build record (`obaaf verify release`) before publishing.

  - id: OBAAF-JEN-011
    title: Publishing can run after a failed or skipped check
    severity: high
    category: authority
    platform: jenkins
    requirements: [G7.2]
    supports: [FR6]
    why: >-
      The publish can run after verification failed or was skipped.
    description: >-
      A publish step sits in a post condition that runs after failure (always, failure, unstable,
      unsuccessful, changed, regression, aborted, notBuilt, cleanup) or in a Scripted catch or finally
      block, or a check before the publish (`obaaf verify`, `gh attestation verify`, `cosign verify`,
      `slsa-verifier verify`, `sha256sum -c`, `gpg --verify`) cannot stop it: the step ignores the check's
      failure (`returnStatus: true`, `|| true`, a trailing `&`, a pipe without pipefail, `set +e`), or the
      check runs in catchError, warnError or a catch block the publish is not in, in a parallel branch
      beside it, or under a condition the publish does not share. A check the checker cannot read is
      "cannot tell". The publish can then run after verification failed or was skipped.
    fix: >-
      Publish only in steps that run after every check succeeded (in a later stage, or in post {
      success }), and let a failed check stop the build.

  - id: OBAAF-JEN-012
    title: Publish without a provenance check
    severity: high
    category: authority
    platform: jenkins
    requirements: [G5.2, G7.2]
    agent_controls: [R8]
    supports: [FR6]
    why: >-
      Unless a check that stops it verifies the artifact's provenance, approvals and agent-run record, an
      unapproved or tampered artifact can be published.
    description: >-
      The pipeline publishes without first verifying provenance, approvals and agent-run records in an
      earlier step whose failure stops the build. A provenance-only check such as `cosign
      verify-attestation` is reported at medium.
    fix: >-
      Run `obaaf verify release` in a step before the publish, without catchError, warnError,
      returnStatus or `|| true`, so a failure stops the build.

  - id: OBAAF-JEN-013
    title: Secret interpolated into a command
    severity: medium
    category: authority
    platform: jenkins
    requirements: [G3.4]
    supports: [FR7]
    why: >-
      The secret appears in the command line, where other processes on the build agent can read it, and escaping
      it breaks easily.
    description: >-
      A sh, bat or powershell step puts a bound secret into its script with Groovy interpolation. The
      secret then appears in the command line, where other processes on the agent can read it, and
      escaping it breaks easily. The Jenkins documentation warns against this.
    fix: >-
      Reference the secret as a shell variable inside a single-quoted Groovy string, for example
      `sh 'curl -u "$USER:$TOKEN" ...'`.

  - id: OBAAF-JEN-014
    title: Signing key available to build steps
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.4, G5.1]
    supports: [FR11]
    why: >-
      Every step in the binding's scope can read the key and sign with it.
    description: >-
      A credential binding whose ID or variable names signing material (a code-signing certificate,
      keystore or private key), or a command that imports a key, makes the key readable by every step
      in its scope. High when the stage also publishes.
    fix: >-
      Sign through a key service or HSM-backed signing service called by a dedicated signing stage or
      job, so no build step can read the private key.

  - id: OBAAF-JEN-015
    title: Webhook trigger token written in the Jenkinsfile
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.1, G9.1]
    supports: [FR3, FR4]
    why: >-
      Anyone who can read the repository can start the job and choose every value the trigger reads from the
      request.
    description: >-
      A webhook trigger (for example GenericTrigger) has its token written in the Jenkinsfile. The token
      alone authorizes a request, so anyone who can read the repository can start the job and choose every
      value the trigger reads from the request, and the Generic Webhook Trigger plugin runs token-started
      builds as SYSTEM. High when the pipeline holds credentials, publishes or runs an AI agent.
    fix: >-
      Take the token from a Jenkins credential (`tokenCredentialId`), rotate the exposed one, and verify
      the sender with the plugin's HMAC whitelist so forged payloads are rejected.

  - id: OBAAF-REPO-001
    title: CI definition files have no code owner
    severity: medium
    category: authority
    requirements: [G1.1, G1.2, G8.2]
    agent_controls: [R5]
    supports: [FR9]
    why: >-
      A change to how the project builds, releases or runs agents, or to what its checks accept, can then be
      merged without an owner's review.
    description: >-
      No CODEOWNERS rule gives an owner to the workflow files or Jenkinsfiles, the local actions the
      workflows use (`uses: ./path`), the workflow lockfile, or a workflow file not written yet (decided
      from the rules: the last rule that matches every name must give an owner, and no later rule that
      can match one may give none), so a change to how the project builds, releases or runs agents does not
      need an owner's review. A link is checked by its own path and by the file it leads to, and a file
      inside a submodule by the submodule's own entry, which is what a pull request changes. A second
      finding names the files that decide what the checks accept: the CODEOWNERS file in use and each
      place GitHub looks in before it, the checker's configuration (each place it is looked for while
      there is none), a baseline or configuration given by path, and the egress firewall policy's
      place. No ignore or baseline entry can accept that second finding, nor "no CODEOWNERS file" or
      a CODEOWNERS file GitHub does not load, because the acceptance would be kept in a file with no
      owner. CODEOWNERS is read as GitHub documents it (a line ends at a line feed; a pattern and its
      owners are separated by spaces or tabs; a comment begins at a `#` at the start of the line or
      after a space or tab; the last matching rule wins; `**` crosses folders only in `**/`, `/**/` and
      a trailing `/**`; a file of 3 MB or more is not loaded). A rule whose owners are not all in the
      form `@user`, `@org/team` or an e-mail address (with no space or control character; a user name
      may end in a hyphen or hold two in a row, as older accounts do), or that names OBAAF's template
      placeholder, gives no owner. A CODEOWNERS file that is a link, is not
      UTF-8, or needs more comparisons than the checker makes is an error. Limits: whether an owner
      exists and has write access, and whether code-owner review is required, are not checked (`obaaf
      audit` reads review requirements); the check reads the working tree, so on a pull request it
      reads that pull request's CODEOWNERS, while GitHub uses the base branch's; a line indented with
      spaces is read as a rule; scripts a workflow runs, actions a composite or JavaScript action uses,
      Jenkinsfiles in folders Jenkins discovery skips, and a Jenkinsfile that is a link are not counted.
    fix: >-
      Add CODEOWNERS rules for `/.github/` (workflows, local actions, the checker configuration, the
      firewall policy and this file), every Jenkinsfile, a root `obaaf.yml` and `CODEOWNERS`, and any
      baseline kept elsewhere, and require code-owner review on protected branches (see
      templates/github-actions/CODEOWNERS.example).

  - id: OBAAF-REPO-002
    title: Agent instruction files have no code owner
    severity: medium
    category: authority
    requirements: [G8.2]
    agent_controls: [R5]
    supports: [FR9]
    why: >-
      A change to what the agents are told to do then needs no owner's review, and the agents obey the changed
      text.
    description: >-
      The repository contains files that steer AI agents (for example AGENTS.md, CLAUDE.md, REVIEW.md,
      skills, rules files or MCP configuration) that no CODEOWNERS rule gives an owner. Files are found
      by the names the agents' own documentation gives, without regard to letter case: among the files
      git tracks (checked-out submodules included) when the checked folder is the top of a git work
      tree (git is taken from an absolute folder of the `PATH` outside the repository; when there is
      none, every folder is walked and a note says so), otherwise in every folder but `.git`. A link is
      followed while it stays inside the repository, a folder that holds it included (`.github -> .`
      makes the root's `copilot-instructions.md` an instruction file); a link back into a folder
      already entered on the way is followed again, at most once on a way and once for each link and
      set of patterns that could match beneath its name, by whichever way reaches it first (another
      first link on such a way may then go unnamed; the file behind it is still found); one name is
      kept for each file and each link that leads to it. Names are compared as the patterns compare
      them (`ſ` is `s`, `ı` is `i`). The link
      and the file it leads to need an owner too, and a file inside a submodule needs its owner on the
      submodule's own entry. A link out of the repository, to nothing or to something that is neither
      a file nor a folder is named in a note and not read when it, or a name the list gives beneath it
      other than through a leading `**/`, would be an instruction file (so a link out named `docs` is
      not named, though the folder it leads to may hold an AGENTS.md). More than 2,000,000 entries,
      more than 1,000,000 entries looked at behind links, more than 100,000,000 characters of names
      tested or built behind links, more than 200,000 instruction files and links
      reached through links, or more than eight links one through another, is an error. CODEOWNERS is read as for OBAAF-REPO-001. Limits: files an instruction
      file pulls in by reference (`@path` imports, Aider's `read:`, a context file name set in a tool's
      settings) are not followed, a tool whose file names are not in the list is not seen, and in a git
      work tree an untracked file is not looked at.
    fix: >-
      Add CODEOWNERS rules for every agent instruction file and require code-owner review on protected
      branches.

  - id: OBAAF-INS-001
    title: Hidden characters in an agent instruction file
    severity: high
    category: authority
    requirements: [G8.2]
    agent_controls: [R5]
    supports: [FR9]
    why: >-
      Reviewers cannot see such characters but agents read them, so a file can carry instructions nobody approved,
      as in the Rules File Backdoor case.
    description: >-
      An agent instruction or configuration file contains invisible or direction-changing Unicode
      characters. Reviewers cannot see them, but agents read them, which was the vector in the Rules
      File Backdoor case. Every format character, every control character but tab, line feed and
      carriage return, the line and paragraph separators, variation selectors, tag characters and the
      invisible letters (Hangul fillers, the braille blank, Khmer inherent vowels) are reported; an
      emoji sequence, a keycap, the three recommended subdivision flags, one presentation selector
      after a pictograph or arrow (U+2190 to U+21FF, U+2300 to U+23FF, U+2600 to U+27BF, U+2B00 to
      U+2BFF, U+1F000 to U+1FAFF, about 3,900 code points, more than the bases of Unicode's emoji
      variation sequences) or after one of the fifteen other such bases, and a joiner between two
      letters of a script that joins (Arabic, Syriac, Thaana, the Indic scripts, Tibetan, Myanmar,
      Khmer, Mongolian), or after a virama and before such a letter, are not. The format characters of
      Unicode 15.1 are listed, so Python 3.10 and 3.11, whose tables are older, report the same ones.
      A file that is not UTF-8 text, or is larger than two million bytes, is reported because the scan
      cannot see what it hides. A file an agent reads by the name of a picture, archive, document,
      office or compiled file is not scanned when it begins as such a file begins (PNG, JPEG, GIF, PDF, zip, gzip, tar, fonts,
      ELF, SQLite and others) or its bytes look binary (in the first 64 KiB, more than one byte in
      eight, or at least eight and more than one in 64, is a NUL, another control character or a byte
      that is part of no UTF-8 character); otherwise it is read like any other file.
      The finding is each character with a digest of its line; for a direction control, of its
      paragraph. A file is reported once, on its own path when that is an instruction file, otherwise on
      the first name an agent reads it by, with the other names. Limits: soft hyphens, right-to-left marks, ideographic variation selectors and
      Mongolian selectors in ordinary text, and Malayalam's old chillu spelling, are reported too; text
      hidden by Markdown (HTML comments, collapsed sections) and space characters are not; a joiner
      between two emoji, or a joiner or non-joiner between two letters of a script that joins, can still
      carry about one or two bits per gap, and so can a selector after a pictograph or arrow.
    fix: >-
      Remove the characters, review the file's history to find how they arrived, and keep the scan in
      CI with `obaaf check`.
