# Rules of the OBAAF pipeline checker (`obaaf check`).
#
# Each rule names the profile requirements (G…) and agent controls (R…) it
# helps verify, the spec requirement it supports (FR…), and the fix. The
# logic lives in src/obaaf/checker/rules.py, keyed by rule ID. Rule IDs are
# stable (NFR7).
#
# Severity: high = a documented attack path is open; medium = a safeguard is
# missing; low = hardening.

version: 0.1.0

rules:
  - id: OBAAF-GHA-001
    title: Secret available to a workflow started by untrusted input
    severity: high
    category: authority
    requirements: [G3.4, G8.1, G9.1]
    supports: [FR3]
    description: >-
      The workflow can be started by people without write access (for example through pull_request_target,
      issue_comment, issues or workflow_run) and a job references a repository or organization secret. Anyone
      who can steer that job, through its code or through text it reads, can read the secret. Jobs behind an
      environment named in plain text are reported at medium severity, because environment secrets are
      released only after required reviewers approve; an environment named by an expression, or not as text,
      keeps the finding high, because GitHub creates an environment it does not know on first use with no
      protection rules, and an expression can name one the event's author picks. Pull-request workflows are
      reported at low severity: forks receive no secrets, but branches pushed by anyone with write access do.
      The job's environment is part of the finding, because a secret of the same name in another environment
      is another secret. Not followed: whether a named environment really requires reviewers (a repository
      setting; `obaaf audit` reads it); events an app can raise for an outsider's change (`check_run`,
      `check_suite`, `status`, `deployment`, `deployment_status`) and `merge_group`, which are not treated as
      untrusted; a workflow another workflow calls, whose caller's trigger is not known from its own file; and
      secrets that reach the job through artifacts, caches or another job's outputs. An event name written
      other than in lower-case letters and underscores is a problem of the file, which fails the check.
    fix: >-
      Move the step that needs the secret into a workflow that runs only after review (for example on
      a push to a protected branch, or behind an environment with required reviewers), and pass only
      data, never secrets, out of the untrusted workflow.

  - id: OBAAF-GHA-002
    title: Untrusted code checked out in a privileged workflow
    severity: high
    category: authority
    requirements: [G3.1, G9.1]
    supports: [FR3]
    description: >-
      A pull_request_target, workflow_run or comment-triggered workflow checks out or fetches the code
      of a pull request. These workflows run with the base repository's token, secrets and cache scope,
      so building or running that code hands them to its author (a "pwn request").
    fix: >-
      Build pull-request code in a pull_request workflow, which runs with a read-only token and no
      secrets. If a privileged step must follow, pass results through artifacts and treat them as
      untrusted data.

  - id: OBAAF-GHA-003
    title: Agent job can write
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.1]
    agent_controls: [R2, R4]
    supports: [FR8]
    description: >-
      A job that runs an AI agent holds write permissions, or does not declare its permissions and so may
      inherit write access: the repository default, or, in a workflow another can call (`workflow_call`),
      whatever the calling job grants. Text the agent reads can then direct those writes. Permissions written
      in a form GitHub does not document (a scope name in another case, a level other than `read`, `write` or
      `none`, a string other than exactly `read-all` or `write-all`, an expression) are a problem of the file,
      which fails the check, and are read as the widest grant they could be; `permissions:` with no value is
      taken as not written, and a scope name in lower-case letters and hyphens that GitHub does not know is
      read as written. Not followed: the repository's or organization's default token permissions (an
      undeclared job is reported whatever they are); what a calling workflow grants; write access through a
      token taken from a secret, which OBAAF-GHA-005 reports as a secret; and a local composite action that
      runs an agent, which does not make the job an agent job.
    fix: >-
      Give the agent job `permissions: {contents: read}` (plus other read permissions it needs) and
      apply its proposals in a separate effect job behind a protected environment.

  - id: OBAAF-GHA-004
    title: Agent job can request cloud credentials
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.1]
    agent_controls: [R3]
    supports: [FR7]
    description: >-
      A job that runs an AI agent has `id-token: write`, so the agent can request an OIDC token and exchange
      it for cloud or signing credentials. A scope written in another case counts as `id-token`. An agent job
      that declares no permissions in a workflow another can call (`workflow_call`) is reported too, because
      the calling job can grant `id-token: write`. Not followed: what a calling workflow really grants; and
      the repository default, which the checker takes never to include `id-token: write`, so an undeclared job
      in a workflow nothing calls is not reported. Cloud credentials held as long-lived secrets are
      OBAAF-GHA-005's.
    fix: >-
      Remove `id-token: write` from the agent job. Sign the agent-run record in a separate job that the
      agent cannot influence.

  - id: OBAAF-GHA-005
    title: Secret available to an agent job
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.1]
    agent_controls: [R2, R3]
    supports: [FR7]
    description: >-
      A job that runs an AI agent references a secret, inherits secrets, or uses an environment whose secrets
      it receives. Prompt injection can make the agent disclose any secret in its environment. The job's
      environment is part of the finding, because a secret of the same name in another environment is another
      secret, so an acceptance written for one environment does not cover another. Not followed by the finding
      itself: in a called workflow, which secret the caller maps onto each parameter (the caller is not read
      as an agent job; slice 2d.4); and secrets that reach the agent through artifacts, caches, files or
      another job's outputs. When the job references secrets, the finding lists five controls and is cleared
      only when the checker has verified all five. (1) Each secret is listed in `protected_secrets` and the
      job declares the environment named there. (2) The secrets are stored only in that environment and only
      protected branches may use it; this is a repository setting, which `obaaf check` does not read, so it is
      reported as "cannot tell". (3) No pull request, issue or comment can start the job, no checkout step
      names a pull request's ref, and no expression or `if:` in the job reads a field someone without write
      access can write. (4) A control the checker recognises limits the job's network access to an allow-list
      (as OBAAF-GHA-020 reads it). (5) The agent's command cannot read any of the job's secrets
      (`GITHUB_TOKEN` aside, which OBAAF-GHA-003 covers), because a key the agent can read can leave in the
      job's log or an artifact whatever the network allows: verified only where every secret of the job is set
      in the `env` of steps that use OBAAF's egress action, at a commit OBAAF lists as released, on the runner
      it was tested on, and goes to AWF's API proxy (named in `model-keys`) or to nothing the command runs; it
      says where each credential given to such a step goes, whatever its verdict. A secret passed to the
      command, given to another step or to the job's or the workflow's `env`, a job with no confined command
      (GitHub's native firewall holds no key), or an agent or a credential in a step that can run before or
      beside the step that holds the key is "not met". That step holds the key outside the sandbox, so what
      could reach it there is "cannot tell": a variable bash or the loader obeys (`BASH_ENV`, `PATH`,
      `LD_PRELOAD` and others), or `ACTIONS_ALLOW_UNSECURE_COMMANDS`, in an `env`, a step before or beside it
      whose script names `GITHUB_ENV` or `GITHUB_PATH` or may leave a process running (read from its words), a
      parallel step, and service containers given volumes or options. The second control is never verified by
      `obaaf check`, so today the finding can be accepted and cannot be cleared. Not read for the third
      control: what a script, an action other than `actions/checkout` or the agent itself fetches while the
      job runs, apart from a few commands the checker knows (`gh pr checkout`, `git fetch` of `pull/N/head`);
      a workflow that starts this one with `workflow_dispatch` and passes on text an outsider wrote; a value
      handed over through `needs.*.outputs`; and the callers of a reusable workflow, which are reported as
      "cannot tell".
    fix: >-
      Either keep the model credential in an inference proxy outside the job (see
      docs/inference-proxy.md) and pass no secrets to the agent job, or, where the finding lists its
      controls, make all five hold: list each secret in `protected_secrets` with its environment and
      declare that environment on the job; keep the secrets only in that environment and limit it to
      protected branches; start the job only from `push`, `workflow_dispatch`, `schedule` or
      `release`, with no pull-request checkout; and run the agent's command under OBAAF's egress action
      with its host names in `allow` and an Anthropic or OpenAI key in `model-keys`, set in that
      step's `env` and nowhere else in the job, so that the network is limited and the command never
      holds the key. Until the checker can verify all five, accept the finding with an owner, a reason
      and an expiry date.

  - id: OBAAF-GHA-006
    title: Release job can read a shared cache
    severity: high
    category: authority
    requirements: [G4.1, G4.2]
    agent_controls: [R7]
    supports: [FR4]
    description: >-
      A release job restores a GitHub Actions cache, directly or through a setup action that caches by
      default, and its `cache-mode` does not forbid it. Caches can be written by other workflows on the
      same branch or the default branch, so a poisoned entry would reach the release build. A release
      job with no cache step but no `cache-mode: none` is reported at low severity.
    fix: >-
      Set `cache-mode: none` on release jobs and remove cache restore steps, or regenerate derived data
      inside the release lane.

  - id: OBAAF-GHA-007
    title: Low-trust workflow can write the default-branch cache
    severity: high
    category: authority
    requirements: [G4.1]
    agent_controls: [R7]
    supports: [FR4]
    description: >-
      The workflow runs on triggers that outsiders can start (for example pull_request_target,
      issue_comment or workflow_run) and declares a write-capable `cache-mode`. Code or an agent
      steered by an outsider could then poison caches that release workflows restore, as in the
      Clinejection case. GitHub gives some of these triggers read-only cache access by default
      (pull_request_target, issue_comment, and workflow_run runs that follow a pull request from a
      fork), but not every case, and this rule cannot see the default a job gets when it declares
      nothing.
    fix: >-
      Remove the write-capable `cache-mode`, or set `cache-mode: none` (or `read`) explicitly for jobs
      in this workflow.

  - id: OBAAF-GHA-008
    title: Action or container not pinned to a full digest
    severity: medium
    category: hygiene
    requirements: [G2.1]
    agent_controls: [R6]
    supports: [FR10, FR12]
    description: >-
      A third-party action, reusable workflow or container image is referenced by a tag or branch,
      which its publisher, or anyone who compromises the publisher, can move. Release, effect and agent jobs
      are reported at high severity. Ordinary jobs with explicitly limited token permissions,
      no secrets and no privileged outside trigger are reported at low severity. Other jobs
      remain medium: missing token permissions must not silently downgrade a privileged job.
    fix: >-
      Pin the reference to a full 40-character commit SHA, or an image to its sha256 digest, and keep
      the version in a comment (for example `uses: actions/checkout@<sha> # v7.0.1`). Let Dependabot
      propose updates to the pin.

  - id: OBAAF-GHA-009
    title: Token permissions not declared
    severity: medium
    category: authority
    requirements: [G3.4]
    supports: [FR3, FR8]
    description: >-
      Neither the workflow nor the job declares `permissions`, so the job token gets the repository or
      organization default, which may include write access.
    fix: >-
      Declare `permissions: {}` or `permissions: {contents: read}` at the top of the workflow and grant
      each job only what it needs.

  - id: OBAAF-GHA-010
    title: Untrusted event text expanded inside a script
    severity: high
    category: authority
    requirements: [G8.1, G3.1]
    agent_controls: [R1]
    supports: [FR3]
    description: >-
      A script interpolates text that an outsider controls, such as an issue title, a pull-request title
      or body, a branch name or a commit message, with `${{ }}`: written plainly, with index syntax, in
      any letter case, through `toJSON` or another function given the event object, through a group
      (`(github.event.issue).title`), or through a wildcard or computed index
      (`github.event.*.title`, `github.event[inputs.kind].body`). `${{ env.NAME }}` counts when the
      step, job or workflow sets NAME from one of these fields, directly or through other env values
      or the matrix, and `${{ matrix.x }}` when the job's matrix is built from one. Not followed:
      values set while the job runs, values passed between jobs or into reusable workflows and
      composite actions, scripts other than `run` and `actions/github-script`, an `env:` written as
      one expression that itself reads env or matrix values, and a `with:` written as one
      expression. The text becomes part of the script before the shell runs, so it can run
      commands. This is how the Nx compromise began.
    fix: >-
      Pass the value through an environment variable (`env: TITLE: ${{ github.event.issue.title }}`)
      and use it quoted in the script (`"$TITLE"`), so the shell treats it as data.

  - id: OBAAF-GHA-011
    title: Checkout leaves the job token on disk
    severity: medium
    category: authority
    requirements: [G8.1, G3.4]
    agent_controls: [R7]
    supports: [FR7]
    description: >-
      In an agent job or a job started by untrusted input, actions/checkout persists the job token for
      later git commands. Any code or agent that runs later in the job can read it.
    fix: >-
      Add `persist-credentials: false` to the checkout step.

  - id: OBAAF-GHA-012
    title: Agent reads instructions from the change under review
    severity: high
    category: authority
    requirements: [G8.2]
    agent_controls: [R5]
    supports: [FR9]
    description: >-
      The agent job checks out the pull request's version of the repository, so instruction files,
      rules files and MCP configuration come from the change being reviewed. The change can then
      rewrite what the agent obeys during its own run.
    fix: >-
      Check out the protected base branch for instruction files (for example `ref: ${{
      github.event.pull_request.base.sha }}`), and give the agent the pull request's changes only as
      data captured by the snapshot step.

  - id: OBAAF-GHA-013
    title: Self-hosted runner used for untrusted work
    severity: high
    category: authority
    requirements: [G3.1, G3.2]
    agent_controls: [R7]
    supports: [FR3, FR4]
    description: >-
      A job that pull requests, outside events or an agent can drive runs on a self-hosted runner.
      Unless the runner is ephemeral, code from that job can persist on the host and tamper with later
      builds, as in the PyTorch case. Runner labels that are not standard GitHub-hosted labels (custom
      labels, larger runners, unresolved inputs) are reported at medium, because the checker
      cannot tell whether they are self-hosted. An unresolved runtime expression explicitly
      mentioning both a standard hosted label and self-hosted alternatives is informational:
      it needs review, but does not prove an unsafe runner was selected. Literal matrices that
      include a self-hosted pool still produce a high finding. `runs-on` written as one expression,
      `matrix.x` or `matrix.x || 'label'`, is resolved from a matrix written out in the file, the
      default counting wherever a row may lack the value; values of `x`, an `include` or an `include`
      entry computed when the job runs, a key written in another case, a key that is not plain ASCII
      text, a value YAML 1.2 could read as other than text, a merge key (`<<`) in the file, or any other
      expression is not resolved. If you verify the selector and
      runner lifecycle, record the evidence in a job-scoped, expiring `ignore` entry (see the
      checker configuration guide). A declaration is not verification of runtime isolation.
    fix: >-
      Run untrusted and agent jobs on GitHub-hosted or ephemeral runners, and keep persistent
      self-hosted runners for the release lane only.

  - id: OBAAF-GHA-014
    title: Release job not behind a protected environment
    severity: medium
    category: authority
    requirements: [G6.2]
    supports: [FR6]
    description: >-
      A release job that uploads or publishes does not reference an environment, so no person has to
      approve it and its credentials are not held back until approval.
    fix: >-
      Reference an environment (for example `environment: release`) configured with required reviewers,
      self-review prevention and no administrator bypass.

  - id: OBAAF-GHA-015
    title: Release workflow started by untrusted input
    severity: high
    category: authority
    requirements: [G3.1]
    supports: [FR4]
    description: >-
      A release workflow can be started by pull requests, comments, issues or another workflow's run,
      so unreviewed changes or outsiders can reach the release lane.
    fix: >-
      Start release workflows only from pushes to protected branches or tags, published releases, or
      manual dispatch by maintainers.

  - id: OBAAF-GHA-016
    title: Upload without a provenance check
    severity: high
    category: authority
    requirements: [G7.2, G5.2]
    agent_controls: [R8]
    supports: [FR6]
    description: >-
      A release job uploads or publishes artifacts without first verifying their provenance, approvals
      and agent-run records in an earlier step of the same job or in a job it depends on.
    fix: >-
      Add `obaaf verify release` as a step before the upload, in the same job or in a job the upload
      job needs, and let a failure stop the job: no `|| true`, `continue-on-error` or `if: always()`.
      A provenance-only check such as `gh attestation verify` is reported at medium, because it does
      not check approvals or agent records.

  - id: OBAAF-GHA-017
    title: Release builds without provenance
    severity: medium
    category: authority
    requirements: [G7.1]
    supports: [FR5]
    description: >-
      A release workflow publishes artifacts but no job signs provenance for them.
    fix: >-
      Add a separate attestation job that signs provenance and an OBAAF build record for every release
      artifact (see templates/github-actions/workflows/obaaf-release.yml), or verify provenance signed
      by another workflow before the upload (see obaaf-publish.yml).

  - id: OBAAF-GHA-018
    title: Signing key available to build steps
    severity: high
    category: authority
    requirements: [G5.1, G3.4]
    supports: [FR11]
    description: >-
      A workflow loads a signing key or certificate from a secret or a file, so any build step that runs in
      the job can read it. A job that can read every secret (a reference that is not one literal name, such as
      toJSON(secrets) or a computed index, or `secrets: inherit`) is reported as able to read any signing key
      stored for it, because which secrets exist is not in the workflow. The job's environment is part of a
      finding about its secrets. Not followed: a signing secret whose name matches none of the patterns in the
      detection data (names are guesses, and a key can be stored under any name); a signing command or action
      not in that data (commands are matched in `run` and `actions/github-script` scripts, with a line
      continued by a backslash, a PowerShell backtick or a cmd caret joined first); keys fetched at run time
      from a vault or a cloud key service; and, for a step reported for its command, what the command does:
      the finding names the step and not its text, so a harmless step that is accepted keeps its acceptance if
      it later loads a private key.
    fix: >-
      Sign through a hardware-backed or managed signing service (a cloud key service, an HSM-backed
      signing service, or platform-managed signing), so no build step can read the private key.

  - id: OBAAF-GHA-019
    title: Unsafe pull-request checkout explicitly allowed
    severity: high
    category: authority
    requirements: [G3.1, G9.1]
    supports: [FR3]
    description: >-
      actions/checkout is told to check out fork pull-request code in a pull_request_target or
      workflow_run workflow with `allow-unsafe-pr-checkout: true`.
    fix: >-
      Remove `allow-unsafe-pr-checkout` and build pull-request code in a pull_request workflow.

  - id: OBAAF-GHA-020
    title: Agent job without an egress restriction
    severity: low
    category: hygiene
    requirements: [G8.1]
    agent_controls: [R7]
    supports: [FR7]
    description: >-
      Nothing the checker can verify limits the agent job's network access. The finding is reported
      for every agent job, with the one control that clears it, and it is cleared only when the
      checker read that control from the workflow and the repository and every condition that makes
      it hold. Two controls can be verified: GitHub's native egress firewall (the job runs on
      `ubuntu-24.04-firewall` and `.github/egress-firewall.yaml` sets `mode: enforce`), which covers
      the whole job from outside the runner; and OBAAF's egress action (`actions/egress`) at a commit
      OBAAF lists as released, with a plain allow-list with no public suffix at or under a name, the
      agent as its command (no other step and no `env` of the job is given a credential, and the job
      cannot request OIDC tokens) and no step but `actions/upload-artifact` after it. Each credential
      given to the action's step is placed as the action reads its inputs: a model key named in
      `model-keys` goes to AWF's API proxy, whose provider host is then shown after the allow-list, and
      one named in `env` or written in `run` (also through `${{ env.KEY }}`) is passed to the command;
      a name the action refuses in a way the checker reads is "not met", and a credential it cannot
      place is "cannot tell". OBAAF lists no released commit
      of the action yet, and lists only commits at or after the last change flagship slice 2c.6 made to it. Harden-Runner is "cannot tell" at best, because the
      repository's tier is not in the workflow, and "not met" at a listed release before v2.16.0 or
      with `sudo` and containers left to the job; its version is read only from a commit OBAAF lists. The Agent Workflow Firewall run from a script is "cannot tell".
      A policy declared in `OBAAF_EGRESS`, or a control behind a condition, is reported too, so it is
      not mistaken for enforcement. A baseline entry that accepts "cannot tell" is for the workflow
      file as it stood, byte for byte. A cleared finding still says what the control does not stop.
    fix: >-
      Run the agent job on GitHub's native egress firewall (`runs-on: ubuntu-24.04-firewall` with a
      `.github/egress-firewall.yaml` in `enforce` mode) where the repository can use it, or wrap the
      agent's command in OBAAF's egress action with the host names it needs, or use GitHub Agentic
      Workflows for a new agent workflow. Under OBAAF's action, give an Anthropic or OpenAI key in
      `model-keys` rather than passing a key to the command in `env`, so that the command never holds it. Ephemeral self-hosted runners behind a network policy also
      limit egress, but outside what the checker reads: record them with an ignore entry that names
      an owner, a reason and an expiry date.

  - id: OBAAF-GHA-021
    title: Agent output applied without verifying its record
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.3]
    agent_controls: [R4, R8]
    supports: [FR8, FR10]
    description: >-
      A workflow started by another workflow's run downloads that run's output and can write to the
      repository, but neither it nor a job it needs both verifies the agent-run record and checks the
      proposal before applying it. Doing only one of the two is reported at medium.
    fix: >-
      Verify the agent-run record with `obaaf verify agent-run` and check the proposal with `obaaf
      proposal check --repo .` before applying it, in the job that applies it or in a job it needs
      whose failure stops it (no `if: always()`), and let a failure stop the job (see
      obaaf-agent-apply.yml).

  - id: OBAAF-GHA-022
    title: Agent output applied without an approval gate
    severity: high
    category: authority
    remediation: architecture
    requirements: [G8.1]
    agent_controls: [R4]
    supports: [FR8]
    description: >-
      A job applies agent output with write permissions, but neither it nor a job it needs references
      an environment, so no person other than the requester has to approve the change.
    fix: >-
      Reference an environment with required reviewers and self-review prevention on the job that
      applies agent proposals, or on a job it needs without `if: always()`.

  - id: OBAAF-GHA-023
    title: Template placeholder left in a workflow
    severity: high
    category: authority
    requirements: []
    supports: [FR12]
    description: >-
      The workflow still contains an OBAAF template placeholder (OBAAF_OWNER or an all-zero commit
      SHA), so it will not run as intended.
    fix: >-
      Install the templates with `obaaf templates install --obaaf-repo OWNER/obaaf --obaaf-sha SHA`, or
      replace the placeholders by hand.

  - id: OBAAF-GHA-024
    title: Protected secret used outside its environment
    severity: high
    category: authority
    requirements: [G3.4, G9.1]
    supports: [FR3, FR12]
    description: >-
      The checker configuration lists the secret under protected_secrets, but a job references it without
      declaring the environment that holds it. Anyone with write access can read every repository secret by
      pushing a branch with a new workflow, so a secret worth protecting must live only in an environment
      whose deployment branches are limited to the default branch (or that requires reviewers), and every job
      that uses it must declare that environment. A job that can take every secret counts as using each
      protected secret: that is any use of the secrets context other than one literal name, such as
      toJSON(secrets), secrets.* or secrets[...] with a computed index. A job that calls a reusable workflow
      cannot declare an environment, so passing it a protected secret is reported, by name or with secrets:
      inherit: either passes the secret's repository or organization copy wherever one exists. Every matching
      entry applies, so a looser pattern cannot relax a stricter one, and two entries for the same secret name
      in different case are a configuration error. Environment names are compared without regard to the case
      of the letters A to Z only. An environment named by an expression, one written as a number or true or
      false that could be the named environment in another reader's spelling, and one that differs from the
      named environment only in the case of letters outside ASCII cannot be confirmed and are reported at
      medium severity (an expression is never evaluated, even a constant one). A blank or missing name counts
      as no environment, and a list or a mapping as a name that is not the one wanted. The checker cannot see
      where the secret is stored or the environment's branch rule; check both in the repository settings, or
      with `obaaf audit`.
    fix: >-
      Keep the secret only in the environment named in protected_secrets, limit that environment's
      deployment branches to the default branch, delete any repository or organization copy, and add
      `environment: <name>` to every job that uses it (see docs/github-settings.md#secrets).

  # The checker's own configuration. A declaration that tells the checker which rules a job gets
  # is a control like any other: one that does nothing is reported, never dropped without a word.
  - id: OBAAF-CFG-001
    title: Lane declaration that does nothing
    severity: high
    category: authority
    requirements: []
    supports: [FR12]
    description: >-
      A lane declaration puts a job in a lane (untrusted, agent, effect, release) so that the lane's
      rules apply to it. This one changes nothing, so the job, stage or file it was written for gets
      none of the rules it was meant to add, and every other finding on that job can be missing
      without the report showing it. The cases: OBAAF_LANE, in a job's env, the workflow's env or a
      Jenkinsfile, set to a value that is not a lane (a misspelling such as `agnet`, an expression,
      an empty value, or in a Jenkinsfile a value computed when the build runs; in a Jenkinsfile,
      where the declaration reaches at least one step); the variable under
      another spelling in a job's env or the workflow's env (`obaaf_lane`, `OBAAF-LANE`); OBAAF_LANE
      set in a step's env, a container's or a service's, where the checker does not read it; and an
      entry under `lanes:` in the checker configuration whose value is not a lane, or that names a
      job or Jenkins stage its file does not have, or a file that is not there. The finding is
      reported where the declaration is written: in the workflow or Jenkinsfile, or in the checker
      configuration. It is high because the checker cannot know which findings are missing: the
      agent lane alone has high-severity rules. It is low when nothing can be missing: the declaration
      names `trusted`, which adds no rule even where it is read; it is written where it is not read,
      or under another spelling, in a job that is in the lane it names anyway; or it is an entry for
      a Jenkins stage that is not there and names `untrusted` or `effect`, which change nothing on a
      stage. An entry for a file outside the run (another file when one file is checked, a
      Jenkinsfile when only workflows are checked) is not looked at. An ignore entry cannot accept
      this finding, because it would accept every such declaration in the file it names; a baseline
      entry, which names the one declaration and its value, can.
    fix: >-
      Correct the declaration or delete it. The value is one of untrusted, agent, effect, release or
      trusted, and the variable is spelled OBAAF_LANE. In a workflow it belongs in the job's env or
      the workflow's env; in a Jenkinsfile, in an environment block or a withEnv around the steps. A
      `lanes:` entry names a workflow's file and job as `obaaf check . --lanes` prints them, and a
      Jenkinsfile's stage by the file and the stage's own name (`Jenkinsfile#Ship`). Run
      `obaaf check . --lanes` afterwards and confirm the lane (see
      docs/checker-configuration.md#a-declaration-that-does-nothing).

  # Jenkins (advisory). These rules read a Jenkinsfile and the files it names; controller
  # configuration is reported as coverage unknowns, never as a pass. See docs/jenkins.md.
  - id: OBAAF-JEN-001
    title: Credentials available to change-request code or an AI agent
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.4, G8.1, G9.1]
    agent_controls: [R2, R3]
    supports: [FR3, FR7]
    description: >-
      A credential binding (withCredentials, an environment credentials() entry, sshagent, or a wrapper
      step that takes a credentialsId) surrounds build steps that a change request can reach, or an AI
      agent. The steps run the change's own code, so its author can read the credential even when
      Jenkins takes the Jenkinsfile from a trusted branch; an agent can be told to disclose it. Stages
      that run only for change requests and agent stages are high; stages that nothing in the
      Jenkinsfile keeps away from change requests are medium, because whether the job builds pull
      requests is job configuration. Conditions the checker cannot evaluate are reported as unknown.
    fix: >-
      Bind credentials only in stages that change requests cannot reach (for example `when { branch
      'main' }` or `when { not { changeRequest() } }`, and better in a separate job that builds only
      protected branches), and never around an agent. Keep the model credential in an inference proxy
      outside the agent's workload.

  - id: OBAAF-JEN-002
    title: Build steps on the controller or on agents shared with privileged work
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.1, G3.2]
    agent_controls: [R7]
    supports: [FR3, FR4]
    description: >-
      A stage runs on the built-in node (label `built-in` or `master`), where build code can read
      $JENKINS_HOME and the keys that decrypt every stored credential; or one persistent agent label
      serves both work that change requests reach and a stage that holds credentials or publishes, so
      code from a change request can tamper with the later privileged build. Steps on the controller
      that change requests or an agent can steer are high; others are medium. `agent any` and computed
      labels are reported as unknown, because which agents exist is controller configuration.
    fix: >-
      Set the built-in node's executors to 0 and run builds on agents. Give change-request and agent
      work ephemeral agents (a Kubernetes pod or a fresh container per build) and keep persistent
      agents with privileged labels for protected-branch and release work only.

  - id: OBAAF-JEN-003
    title: AI agent stage can push, start jobs or publish
    severity: high
    category: authority
    remediation: architecture
    platform: jenkins
    requirements: [G8.1]
    agent_controls: [R2, R4]
    supports: [FR8]
    description: >-
      A stage that runs an AI agent also pushes to the repository, starts another job with the build
      step, or publishes, in the same workspace. What the agent wrote or was told then reaches the
      effect without review. Builds started with the build step run as SYSTEM unless build
      authorization is configured, so job permissions shown to people do not limit them.
    fix: >-
      Keep the agent stage inert: let it write a proposal (a patch or bundle) as an artifact, and apply
      it in a separate job that verifies the agent-run record and the proposal (`obaaf verify
      agent-run`, `obaaf proposal check`) behind an input step with a named submitter.

  - id: OBAAF-JEN-004
    title: Pipeline code from an unapproved revision
    severity: high
    category: authority
    platform: jenkins
    requirements: [G1.2, G3.1, G8.2]
    agent_controls: [R5]
    supports: [FR9]
    description: >-
      The pipeline loads code that the Jenkinsfile's reviewers did not approve: a shared library at a
      version taken from a branch name, parameter or other run-time value (a trusted global library
      runs outside the Groovy sandbox), or Groovy loaded from the workspace with `load` or evaluated
      from a file in a stage that change requests reach. For a change request the workspace holds the
      change's own files. Library trust, version overrides and Replay permission are controller
      configuration and are reported as unknown.
    fix: >-
      Pin libraries to a reviewed commit (`@Library('lib@<40-character SHA>')`) and disallow version
      overrides for privileged jobs. Read pipeline code with `readTrusted` and `evaluate`, or move it
      into a pinned library, instead of `load` from the workspace. Restrict Run/Replay on jobs that
      hold credentials.

  - id: OBAAF-JEN-005
    title: Release without an approval by a named person
    severity: medium
    category: authority
    platform: jenkins
    requirements: [G6.2]
    agent_controls: [R4]
    supports: [FR6]
    description: >-
      An input step sets no submitter, so any user with Build permission on the job can approve it,
      including the person who started the build; or the pipeline publishes with no input step before
      the publish. Whether approvers are independent of the requester, and whether an approval is bound
      to the exact artifacts, is reported as unknown.
    fix: >-
      Put an input step with `submitter` set to a release group before the publish, keep the requester
      out of that group, and bind the approval to artifact digests (for example with `obaaf verify
      release`).

  - id: OBAAF-JEN-006
    title: Build container or pod can reach the host
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.2]
    agent_controls: [R7]
    supports: [FR4, FR7]
    description: >-
      A docker or Kubernetes agent runs privileged, mounts the Docker socket or host paths, shares the
      host's network, PID or IPC namespace, or adds powerful capabilities. Code in the container can
      then take over the host and every build on it. Agents that run change-request code or an AI agent
      are high; others are medium. Pod templates defined on the controller (inheritFrom) and pod files
      outside the checkout are reported as unknown.
    fix: >-
      Remove the privileged settings. Build images with a rootless builder (for example BuildKit
      rootless or Kaniko) instead of the host's Docker socket, and run untrusted and agent work in pods
      without host mounts, host namespaces or extra capabilities, enforced by an admission policy.

  - id: OBAAF-JEN-007
    title: AI agent stage without an egress restriction
    severity: low
    category: hygiene
    platform: jenkins
    requirements: [G3.3, G8.1]
    agent_controls: [R7]
    supports: [FR7]
    description: >-
      Nothing in the Jenkinsfile limits the network access of a stage that runs an AI agent, and Jenkins
      has no egress control of its own. A policy declared in `OBAAF_EGRESS` is reported too, so a
      declaration is not mistaken for enforcement.
    fix: >-
      Run the agent in a Kubernetes pod in a namespace whose NetworkPolicy allows only the inference
      proxy, with no route to the controller, cloud metadata or the cluster API. When the network
      enforces it outside the Jenkinsfile, record that with an expiring ignore entry.

  - id: OBAAF-JEN-008
    title: Image, library or agent CLI not pinned
    severity: medium
    category: hygiene
    platform: jenkins
    requirements: [G2.1]
    agent_controls: [R6]
    supports: [FR10, FR12]
    description: >-
      A container image is referenced by a tag instead of a sha256 digest, a shared library is loaded at
      its default version or at a branch or tag, or an agent CLI is installed without a fixed version.
      Whoever controls the tag, branch or registry entry then chooses the code that runs. References
      used by agent or publishing stages are high; stages with credentials are medium; others are low.
    fix: >-
      Pin images to `@sha256:` digests, libraries to a full commit SHA, and agent CLIs to an exact
      version (for example `npm install -g @anthropic-ai/claude-code@1.2.3`), and update the pins
      through reviewed changes.

  - id: OBAAF-JEN-009
    title: Untrusted text interpolated into a command
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.1, G8.1]
    agent_controls: [R1]
    supports: [FR3]
    description: >-
      A sh, bat or powershell step builds its script with Groovy interpolation (`"${...}"`) or
      concatenation of text that others control: a change request's title, source branch or author
      name (high), build parameters (medium), or branch and tag names (low), directly or through a
      variable assigned from them, or commit text read with git log. The value becomes part of the
      command before the shell runs. Parameters passed to other jobs from such values are reported at
      medium.
    fix: >-
      Use single-quoted Groovy strings and let the shell expand the value: `sh 'echo "$CHANGE_TITLE"'`,
      with the value in the environment (it already is for CHANGE_* and parameters, or set it with
      withEnv).

  - id: OBAAF-JEN-010
    title: Artifact from another build used by a moving reference
    severity: high
    category: authority
    platform: jenkins
    requirements: [G4.2, G7.2]
    supports: [FR6]
    description: >-
      A pipeline that publishes copies artifacts from another job by a selector that moves (the default
      last successful build, last completed, latest saved, a permalink or a workspace) and does not check
      their digests before publishing, so a different build's output can be published. High when the
      same stage publishes.
    fix: >-
      Copy from a specific build number recorded with the approval, and check the artifacts' sha256
      digests against the signed build record (`obaaf verify release`) before publishing.

  - id: OBAAF-JEN-011
    title: Publishing can run after a failed or skipped check
    severity: high
    category: authority
    platform: jenkins
    requirements: [G7.2]
    supports: [FR6]
    description: >-
      A publish step sits in a post condition that runs after failure (always, failure, unstable,
      unsuccessful, changed, regression, aborted, cleanup) or in a Scripted catch or finally block, or a
      check before the publish ignores its own failure (catchError, warnError, returnStatus, `|| ...`).
      The publish can then run after verification failed or was skipped.
    fix: >-
      Publish only in steps that run after every check succeeded (in a later stage, or in post {
      success }), and let a failed check stop the build.

  - id: OBAAF-JEN-012
    title: Publish without a provenance check
    severity: high
    category: authority
    platform: jenkins
    requirements: [G5.2, G7.2]
    agent_controls: [R8]
    supports: [FR6]
    description: >-
      The pipeline publishes without first verifying provenance, approvals and agent-run records in an
      earlier step whose failure stops the build. A provenance-only check such as `cosign
      verify-attestation` is reported at medium.
    fix: >-
      Run `obaaf verify release` in a step before the publish, without catchError, warnError,
      returnStatus or `|| true`, so a failure stops the build.

  - id: OBAAF-JEN-013
    title: Secret interpolated into a command
    severity: medium
    category: authority
    platform: jenkins
    requirements: [G3.4]
    supports: [FR7]
    description: >-
      A sh, bat or powershell step puts a bound secret into its script with Groovy interpolation. The
      secret then appears in the command line, where other processes on the agent can read it, and
      escaping it breaks easily. The Jenkins documentation warns against this.
    fix: >-
      Reference the secret as a shell variable inside a single-quoted Groovy string, for example
      `sh 'curl -u "$USER:$TOKEN" ...'`.

  - id: OBAAF-JEN-014
    title: Signing key available to build steps
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.4, G5.1]
    supports: [FR11]
    description: >-
      A credential binding whose ID or variable names signing material (a code-signing certificate,
      keystore or private key), or a command that imports a key, makes the key readable by every step
      in its scope. High when the stage also publishes.
    fix: >-
      Sign through a key service or HSM-backed signing service called by a dedicated signing stage or
      job, so no build step can read the private key.

  - id: OBAAF-JEN-015
    title: Webhook trigger token written in the Jenkinsfile
    severity: high
    category: authority
    platform: jenkins
    requirements: [G3.1, G9.1]
    supports: [FR3, FR4]
    description: >-
      A webhook trigger (for example GenericTrigger) has its token written in the Jenkinsfile. The token
      alone authorizes a request, so anyone who can read the repository can start the job and choose every
      value the trigger reads from the request, and the Generic Webhook Trigger plugin runs token-started
      builds as SYSTEM. High when the pipeline holds credentials, publishes or runs an AI agent.
    fix: >-
      Take the token from a Jenkins credential (`tokenCredentialId`), rotate the exposed one, and verify
      the sender with the plugin's HMAC whitelist so forged payloads are rejected.

  - id: OBAAF-REPO-001
    title: CI definition files have no code owner
    severity: medium
    category: authority
    requirements: [G1.1, G1.2, G8.2]
    agent_controls: [R5]
    supports: [FR9]
    description: >-
      No CODEOWNERS rule covers the workflow files or Jenkinsfiles, so a change to how the project
      builds, releases or runs agents does not need an owner's review.
    fix: >-
      Add CODEOWNERS rules for `/.github/workflows/` and every Jenkinsfile, and require code-owner review
      on protected branches (see templates/github-actions/CODEOWNERS.example).

  - id: OBAAF-REPO-002
    title: Agent instruction files have no code owner
    severity: medium
    category: authority
    requirements: [G8.2]
    agent_controls: [R5]
    supports: [FR9]
    description: >-
      The repository contains files that steer AI agents (for example AGENTS.md, CLAUDE.md, rules files
      or MCP configuration) that no CODEOWNERS rule covers.
    fix: >-
      Add CODEOWNERS rules for every agent instruction file and require code-owner review on protected
      branches.

  - id: OBAAF-INS-001
    title: Hidden characters in an agent instruction file
    severity: high
    category: authority
    requirements: [G8.2]
    agent_controls: [R5]
    supports: [FR9]
    description: >-
      An agent instruction or configuration file contains invisible or direction-changing Unicode
      characters. Reviewers cannot see them, but agents read them, which was the vector in the Rules
      File Backdoor case.
    fix: >-
      Remove the characters, review the file's history to find how they arrived, and keep the scan in
      CI with `obaaf check`.
